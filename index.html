    function mevcutMacBilgisi() {
        const huk = document.getElementById('hukOkul')?.value || secimler.hukOkul;
        const muh = document.getElementById('muhOkul')?.value || secimler.muhOkul;
        if (!huk || !muh) return null;
        const id = secimler.macId || macKimligiOlustur(secimler.kategori, huk, muh);
        return { id, hukOkul:huk, muhOkul:muh, etiket:macEtiketi(huk,muh) };
    }

    function canliJuriTakibiBaslat() {
        if (aktifJuriListenerRef) { aktifJuriListenerRef.off(); aktifJuriListenerRef = null; }
        if (aktifJuriMacListenerRef) { aktifJuriMacListenerRef.off(); aktifJuriMacListenerRef = null; }
        const box = document.getElementById('canliJuriDurumu');
        if (!box) return;
        const mac = mevcutMacBilgisi();
        if (!mac) { box.innerHTML = 'Canlı jüri durumu için iki okulu seçiniz.'; return; }
        let sonKayitlar = [];
        let sonMac = {durum:'acik'};
        const render = () => {
            const macKayitlari = sonKayitlar.filter(v => kayitMacId(v) === mac.id);
            const gruplar = new Map();
            macKayitlari.forEach(v => {
                const k = ogrenciGrupKimligi(v);
                if (!gruplar.has(k)) gruplar.set(k, new Set());
                if (v.secim?.juri) gruplar.get(k).add(v.secim.juri);
            });
            const tam = [...gruplar.values()].filter(s=>BEKLENEN_JURILER.every(j=>s.has(j))).length;
            let ogrHtml = '<span style="color:var(--text-muted);">Öğrenci seçilmedi.</span>';
            if (secimler.ogr && secimler.okul) {
                const ogrKisa = secimler.ogr.split(' (')[0];
                const key = [mac.id, secimler.okul, ogrKisa].map(puanMetniNormalize).join('|');
                const juriler = gruplar.get(key) || new Set();
                const eksik = BEKLENEN_JURILER.filter(j=>!juriler.has(j));
                ogrHtml = `<b>${htmlEscape(ogrKisa)}</b>: <span class="${eksik.length?'jury-missing':'jury-ok'}">${juriler.size}/3 jüri</span>${eksik.length?` · Eksik: ${htmlEscape(eksik.join(', '))}`:' · Tamamlandı'}`;
                // Bir jüri puanlama formunda olmasa bile seçtiği öğrencinin ortak sayacı
                // son 1 dakikaya girdiyse uyarıyı seçim ekranında da alır.
                const timerId=ortakSureKimligi(secimler.okul,ogrKisa);
                const timer=sonMac?.konusmaSayaclari?.[timerId];
                if(timer)ortakSureBirDakikaUyarisiKontrolEt(timer,secimler.kategori,mac.id,timerId);
            }
            box.innerHTML = `<div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;"><b>${htmlEscape(mac.etiket)}</b><span class="${sonMac.durum==='kapali'?'jury-missing':'jury-ok'}">${sonMac.durum==='kapali'?'MAÇ KAPALI':'MAÇ AÇIK'}</span></div><div style="margin-top:8px;">${ogrHtml}${secimler.ogr&&secimler.okul?secimEkraniOrtakSureMetni(sonMac,secimler.ogr,secimler.okul):''}</div><div style="margin-top:6px;font-size:12px;color:var(--text-muted);">Puan girilmiş öğrenci/maç: ${gruplar.size} · 3/3 tamamlanan: ${tam}</div>`;
        };
        aktifJuriListenerRef = db.ref('puanlar/' + secimler.kategori);
        aktifJuriListenerRef.on('value', s => { sonKayitlar = snapshotKayitlariniTekillestir(s); render(); });
        aktifJuriMacListenerRef = db.ref(`maclar/${secimler.kategori}/${mac.id}`);
        aktifJuriMacListenerRef.on('value', s => { sonMac = s.val() || {durum:'acik'}; render(); });
        // Seçim ekranındaki son-dakika uyarısı da Firebase sunucu saatiyle hesaplanır.
        void ortakSureSaatiSenkronizeEt();
        if(aktifSecimSureTick)clearInterval(aktifSecimSureTick);
        aktifSecimSureTick=setInterval(()=>{if(document.getElementById('canliJuriDurumu'))render();},1000);
    }

    // V3.18 - Bir öğrencinin konuşması için Firebase üzerinde ortak 6 dakikalık sayaç.
    // İlk jüri ekranı açıldığında başlar; diğer jüri ekranları aynı kaydı canlı izler.
    // Otomatik sayaç süreleri resmî eşitlik hesabını kendiliğinden değiştirmez;
    // süre modalında kontrol edilip kaydedildiğinde sureEsitlik'e aktarılır.
    const ORTAK_SURE_LIMIT=360;
    const ORTAK_SURE_UYARI=300;
    const ORTAK_PUAN_EK_SURE=10; // Altı dakikalık ortak sürenin ardından bütün jüriler için ek gönderim penceresi.
    function ortakSureYedekYolu(kategori,macId,timerId){
        return `arsiv/konusmaSureYedekleri/${kategori}/${macId}/${timerId}`;
    }
    async function ortakSureYedeginiKaydet(kategori,macId,timerId,veri,olay='guncelleme'){
        if(!veri)return;
        const at=Date.now();
        const m=puanlamaMaclar.get(macId)||mevcutMacBilgisi()||{};
        const yedek={...veri,macMeta:{id:macId,kategori,hukOkul:m.hukOkul||secimler.hukOkul||'',
            muhOkul:m.muhOkul||secimler.muhOkul||'',etiket:m.etiket||'',durum:m.durum||'acik',
            fiksturNo:m.fiksturNo||null,ogrenciKaynaklari:m.ogrenciKaynaklari||null},
            yedekClientAt:at,yedekOlayi:olay};
        const yol=ortakSureYedekYolu(kategori,macId,timerId);
        await db.ref(yol+'/sonDurum').transaction(cur=>{
            if(cur&&Number(cur.yedekClientAt||0)>at)return cur;
            return yedek;
        },undefined,false);
        await db.ref(yol+'/gecmis/'+String(at)).set(yedek);
    }
    function macSureYedekYolu(kategori,macId){return `arsiv/macSureYedekleri/${kategori}/${macId}`;}
    async function macSureYedeginiKaydet(kategori,macId,sure,olay='guncelleme'){
        if(!sure)return;
        const at=Date.now(),path=macSureYedekYolu(kategori,macId);
        const yedek={...sure,yedekClientAt:at,yedekOlayi:olay};
        await db.ref(path+'/sonDurum').transaction(cur=>{
            if(cur&&Number(cur.yedekClientAt||0)>at)return cur;
            return yedek;
        },undefined,false);
        await db.ref(path+'/gecmis/'+String(at)).set(yedek);
    }
    const JURI_SURE_AUDIT_OTURUM_KEY='munazaraJuriSureAuditOturumV1';
    const ortakSureUyariVerilenler=new Set();
    let ortakSureSunucuFarki=0,aktifOrtakSureRef=null,aktifOrtakSureTick=null;
    let aktifOrtakSureVerisi=null,aktifOrtakSureKimlik=null,ortakSureBittirmeCalisiyor=false;
    let aktifSecimSureTick=null;
    function ortakSureSimdi(){return Date.now()+ortakSureSunucuFarki;}
    async function ortakSureSaatiSenkronizeEt(){
        try{
            const snap=await db.ref('.info/serverTimeOffset').once('value');
            const offset=snap.val();
            if(typeof offset==='number')ortakSureSunucuFarki=offset;
        }catch(err){console.warn('Ortak süre için sunucu saati eşitlenemedi:',err);}
    }
    // Eski sürümlerde oluşmuş, gerçek 6 dakika dolmadan kapatılmış sayaçları tanır.
    // Yalnızca jüri açıkça 'Konuşma bitti' dediyse erken bitiş geçerlidir.
    function ortakSureErkenKapanmaKaydi(veri){
        if(!veri || !['bitti','tamamlandi'].includes(veri.durum))return false;
        if(veri.bitisNedeni==='konusma_bitti')return false;
        const bas=Number(veri.baslangicAt||0);
        if(!bas)return false;
        const bitis=Number(veri.bitisAt||0);
        return !bitis || bitis < bas + ORTAK_SURE_LIMIT*1000;
    }
    function ortakPuanSonAt(veri){
        const bas=Number(veri?.baslangicAt||0);
        if(!bas)return 0;
        // Bir jüri "Konuşma bitti" dese bile ortak puanlama penceresi kısaltılmaz.
        // Her jüri, aynı başlangıçtan itibaren 6 dakika + 10 saniyeye kadar gönderebilir.
        return bas+(ORTAK_SURE_LIMIT+ORTAK_PUAN_EK_SURE)*1000;
    }
    function ortakPuanPenceresiAcik(veri,kontrolAni=ortakSureSimdi()){
        const son=ortakPuanSonAt(veri);
        return !!son && Number(kontrolAni)<=son;
    }
    function ortakPuanPenceresiKapandi(veri,kontrolAni=ortakSureSimdi()){
        const son=ortakPuanSonAt(veri);
        return !!son && Number(kontrolAni)>son;
    }
    function juriSureDenetimTemeli(extra={}){
        const ot=juriOturumuGetir();
        const mac=puanlamaMaclar.get(secimler.macId)||mevcutMacBilgisi()||{};
        return {
            kategori:secimler.kategori||'', macId:mac.id||secimler.macId||'',
            macEtiketi:mac.etiket||macEtiketi(secimler.hukOkul,secimler.muhOkul),
            fiksturTarihi:mac.fiksturTarih||mac.tarih||'',
            okul:secimler.okul||'', ogrenci:(secimler.ogr||'').split(' (')[0], taraf:secimler.taraf||'',
            juri:ot?.juri||secimler.juri||'', juriAd:ot?.ad||secimler.juriAd||'',
            cihazId:getClientId(), uygulamaSurumu:APP_VERSION, ...extra
        };
    }
    const JURI_SURE_AUDIT_KUYRUK_KEY='munazaraJuriSureAuditKuyrukV1';
    function juriSureAuditKuyruguGetir(){try{return JSON.parse(localStorage.getItem(JURI_SURE_AUDIT_KUYRUK_KEY)||'[]')||[];}catch(_){return [];}}
    function juriSureAuditKuyruguKaydet(q){localStorage.setItem(JURI_SURE_AUDIT_KUYRUK_KEY,JSON.stringify(q));}
    async function juriSureAuditKuyrugunuGonder(){
        if(!navigator.onLine||!firebaseBagli)return;
        const q=juriSureAuditKuyruguGetir();if(!q.length)return;
        const kalan=[];
        for(const item of q){
            try{await db.ref(`arsiv/juriSureOlaylari/${item.kategori}/${item.logId}`).set({...item.kayit,
                createdAt:firebase.database.ServerValue.TIMESTAMP,syncDurumu:'senkronize'});}
            catch(err){console.warn('Bekleyen jüri/süre günlüğü senkronize edilemedi:',err);kalan.push(item);}
        }
        juriSureAuditKuyruguKaydet(kalan);
    }
    function juriSureYerelAuditGuncelle(kategori,logId,patch){
        const q=juriSureAuditKuyruguGetir();const item=q.find(x=>x.kategori===kategori&&x.logId===logId);
        if(!item)return false;
        item.kayit={...item.kayit,...patch,updatedClientAt:Date.now(),syncDurumu:'bekliyor'};
        juriSureAuditKuyruguKaydet(q);return true;
    }
    function juriSureAuditGuncellemeKuyrugaAl(kategori,logId,temel,patch){
        const q=juriSureAuditKuyruguGetir();
        const item=q.find(x=>x.kategori===kategori&&x.logId===logId);
        const kayit={...(item?.kayit||temel||{}),...patch,kategori,logId,updatedClientAt:Date.now(),syncDurumu:'bekliyor'};
        if(item)item.kayit=kayit;else q.push({kategori,logId,kayit});
        juriSureAuditKuyruguKaydet(q);
    }
    async function juriSureOlayiYaz(kayit){
        const kategori=(kayit?.kategori||secimler.kategori||'ORTAOKUL');
        const clientAt=Date.now();
        const govde={...juriSureDenetimTemeli(),...kayit,kategori,clientAt,
            clientId:getClientId(),uygulamaSurumu:APP_VERSION};
        if(!navigator.onLine||!firebaseBagli){
            const logId='pending_'+clientAt+'_'+hash32(String(Math.random())+'|'+getClientId());
            const q=juriSureAuditKuyruguGetir();
            q.push({kategori,logId,kayit:{...govde,logId,syncDurumu:'bekliyor'}});
            juriSureAuditKuyruguKaydet(q);
            return {key:logId,kategori,local:true,update:async patch=>{if(!juriSureYerelAuditGuncelle(kategori,logId,patch))throw new Error('Yerel denetim kaydı kuyruğu bulunamadı.');}};
        }
        const ref=db.ref(`arsiv/juriSureOlaylari/${kategori}`).push();
        await ref.set({...govde,logId:ref.key,createdAt:firebase.database.ServerValue.TIMESTAMP});
        return {key:ref.key,kategori,local:false,update:patch=>ref.update({...patch,updatedAt:firebase.database.ServerValue.TIMESTAMP})};
    }
    async function juriSureOturumLogunuGuncelle(patch){
        try{
            const raw=localStorage.getItem(JURI_SURE_AUDIT_OTURUM_KEY);if(!raw)return;
            const d=JSON.parse(raw);if(!d?.kategori||!d?.logId)return;
            const base=juriSureDenetimTemeli();
            if(d.kategori!==base.kategori||d.macId!==base.macId||
               puanMetniNormalize(d.okul)!==puanMetniNormalize(base.okul)||
               puanMetniNormalize(d.ogrenci)!==puanMetniNormalize(base.ogrenci))return;
            if(!(d.local&&juriSureYerelAuditGuncelle(d.kategori,d.logId,patch)))
                await db.ref(`arsiv/juriSureOlaylari/${d.kategori}/${d.logId}`).update({...patch,updatedAt:firebase.database.ServerValue.TIMESTAMP});
        }catch(err){console.warn('Jüri/süre oturum günlüğü güncellenemedi:',err);}
    }
    async function juriSureOturumLogla(durum='acildi',ek={}){
        try{
            const rec=await juriSureOlayiYaz({islem:'puanlama_ekrani_acma',durum,
                sifirlamaSecenegiSunuldu:true,sifirlamaTalepEdildi:false,sifirlamaKullanildi:false,
                sifirlamaDurumu:'kullanilmadi',izinVerilenEkSureSaniye:ORTAK_PUAN_EK_SURE,...ek});
            localStorage.setItem(JURI_SURE_AUDIT_OTURUM_KEY,JSON.stringify({kategori:secimler.kategori,
                logId:rec.key,local:!!rec.local,macId:secimler.macId,okul:secimler.okul,
                ogrenci:(secimler.ogr||'').split(' (')[0],clientAt:Date.now()}));
        }catch(err){console.warn('Puanlama açılış denetim kaydı yazılamadı:',err);}
    }
    async function juriSurePenceresiniSifirla(kaynak='juri_secim_ekrani'){
        const oturum=juriOturumuGetir();
        const mac=puanlamaMaclar.get(secimler.macId)||mevcutMacBilgisi();
        const ogr=(secimler.ogr||'').split(' (')[0];
        if(!mac?.id||!secimler.okul||!ogr||!secimler.taraf){
            alert('Sıfırlama için önce maç, taraf ve öğrenci seçilmelidir. Puanlar silinmez; yalnızca seçili öğrencinin ortak süresi yenilenir.');return;
        }
        let auditRef=null;
        const logTemel=juriSureDenetimTemeli({islem:'ortak_sure_sifirlama',durum:'onay_bekliyor',
            kaynakEkran:kaynak,istegeBagli:true,sifirlamaTalepEdildi:true,sifirlamaKullanildi:false,uygulandi:false,
            sebep:'',oncekiSayac:null,yeniSayac:null});
        try{auditRef=await juriSureOlayiYaz(logTemel);}
        catch(err){alert('Denetim kaydı yazılamadığı için sıfırlama yapılmadı. Firebase bağlantısını kontrol edin.\n'+String(err?.message||err));return;}
        const auditGuncelle=async patch=>{
            try{await auditRef.update(patch);return true;}
            catch(e){
                console.warn('Sıfırlama sonucu günlüğe yazılamadı; yerel aktarım kuyruğuna alınıyor:',e);
                juriSureAuditGuncellemeKuyrugaAl(auditRef.kategori,auditRef.key,logTemel,patch);
                return false;
            }
        };
        if(!navigator.onLine||!firebaseBagli){
            await auditGuncelle({durum:'baglanti_yok',hata:'Çevrimdışı olduğu için ortak sayaç sıfırlanmadı.',uygulandi:false,sifirlamaKullanildi:false});
            alert('Ortak süre bütün jüri cihazlarında aynı anda sıfırlanabilmesi için internet bağlantısı gerekir. İşlem yapılmadı; bu sonuç yerel günlüğe alındı ve bağlantı gelince yönetici günlüğüne aktarılacak.');return;
        }
        if(!oturum||!juriOturumuSeciliMacaUygun(oturum,mac)){
            await auditGuncelle({durum:'juri_kilidi_uyumsuz',hata:'Seçili maçın gününe/kategorisine uygun jüri kilidi yok.',uygulandi:false,sifirlamaKullanildi:false});
            alert('Önce seçili maç için geçerli jüri kilidini seçin. Sıfırlama yapılmadı; talep günlüğe kaydedildi.');return;
        }
        const vazgec=async neden=>{
            await auditGuncelle({durum:'iptal_edildi',iptalNedeni:neden,uygulandi:false,sifirlamaKullanildi:false});

${mac.etiket||'Seçili maç'} · ${ogr}

Bu işlem yalnızca seçili öğrencinin ortak 6 dakikalık sayacını tüm jüri cihazlarında yeniden başlatır. Mevcut puan kayıtları silinmez. İşlem yönetici günlüğüne kaydedilecektir.

            if(!result.committed)throw new Error('Firebase ortak süreyi güncelleyemedi; yeniden deneyin.');
            const yeni=result.snapshot?.val()||null;

    function ortakSureKimligi(okul,ogrenci){
        const key=[skorEslesmeAnahtari(okul),skorEslesmeAnahtari(ogrenci)].join('|');
        return 's_'+hash32(key,2166136261)+hash32(key,3339675911);
    }
    function ortakSureKalan(veri){
        if(!veri)return null;
        // Eski sürüm veya başka bir istemci sayacı erken kapattıysa gerçek 6 dakika
        // dolana kadar çalışan sayaç gibi değerlendir; puan kaydı sayaç durumunu değiştirmez.
        const eskiErkenKapanma=ortakSureErkenKapanmaKaydi(veri);
        const kapaliDurum=['bitti','tamamlandi'].includes(veri.durum) && !eskiErkenKapanma;
        const sinir=!kapaliDurum ? ORTAK_SURE_LIMIT : (Number(veri.limitSaniye)||ORTAK_SURE_LIMIT);
        const gecti=kapaliDurum
            ? Math.max(0,Number(veri.sureSaniye)||0)
            : Math.max(0,Math.floor((ortakSureSimdi()-Number(veri.baslangicAt||0))/1000));
        const bitti=kapaliDurum || gecti>=sinir;
        return {gecen:Math.min(sinir,gecti),kalan:Math.max(0,sinir-gecti),bitti};
    }
    function ortakSureTemizle(){
        if(aktifOrtakSureRef){try{aktifOrtakSureRef.off();}catch(_){}aktifOrtakSureRef=null;}
        if(aktifOrtakSureTick)clearInterval(aktifOrtakSureTick);
        aktifOrtakSureTick=null;aktifOrtakSureKimlik=null;aktifOrtakSureVerisi=null;
        if(aktifSecimSureTick)clearInterval(aktifSecimSureTick);
        aktifSecimSureTick=null;
    }
    async function ortakSureBaslat(kategori,mac,okul,ogrenci){
        const host=document.getElementById('ortakKonusmaSayaci');if(!host)return;
        const ad=(ogrenci||'').split(' (')[0];
        const id=ortakSureKimligi(okul,ad);
        const ref=db.ref(`maclar/${kategori}/${mac.id}/konusmaSayaclari/${id}`);
        ortakSureTemizle();aktifOrtakSureKimlik={kategori,macId:mac.id,id,ogrenci:ad,okul};
        host.textContent='⏱ Ortak 6 dakikalık süre Firebase’den kontrol ediliyor…';
        try{
            const offset=(await db.ref('.info/serverTimeOffset').once('value')).val();
            if(typeof offset==='number')ortakSureSunucuFarki=offset;
            if(!document.getElementById('ortakKonusmaSayaci') || aktifOrtakSureKimlik?.id!==id)return;
            aktifOrtakSureRef=ref;
            ref.on('value',snapshot=>{
                if(aktifOrtakSureRef!==ref)return;
                aktifOrtakSureVerisi=snapshot.val();ortakSureGoster();
            },err=>{if(aktifOrtakSureRef===ref){aktifOrtakSureVerisi=null;host.innerHTML='Sayaç okunamadı: '+htmlEscape(err.message||err)+'<div><button class="btn" style="width:auto;margin-top:8px;background:#92400e" onclick="juriSurePenceresiniSifirla(\'puanlama_ekrani\')">↻ Sorun giderme için ortak süreyi sıfırla</button></div>';ortakPuanArayuzunuGuncelle();}});
            aktifOrtakSureTick=setInterval(ortakSureGoster,1000);
            const m=await macDurumuGetir(kategori,mac.id);
            if(m.durum==='kapali'||m.durum==='iptal')return;
            // Veri zaten varsa kimse yeniden başlatamaz (birden çok jüri güvenli).
            if(!navigator.onLine||!firebaseBagli){
                if(host)host.textContent='Bağlantı yok: ortak sayaç başlatılmadı.';
                return;
            }
            let yedek=null;
            const mevcut=await ref.once('value');
            if(!mevcut.exists()){
                try{
                    const yedekSnap=await db.ref(ortakSureYedekYolu(kategori,mac.id,id)+'/sonDurum').once('value');
                    yedek=yedekSnap.val()||null;
                }catch(err){console.warn('Ortak süre arşiv yedeği okunamadı:',err);}
            }
            const yedekGecerli=!!(yedek&&Number(yedek.baslangicAt)>0&&
                ['calisiyor','bitti','tamamlandi'].includes(yedek.durum));
            const baslatma=await ref.transaction(cur=>{
                if(cur)return cur;
                if(yedekGecerli)return {...yedek,arsivdenGeriYuklendiAt:ortakSureSimdi()};
                return {ogrenci:ad,okul,taraf:secimler.taraf,baslangicAt:ortakSureSimdi(),
                    limitSaniye:ORTAK_SURE_LIMIT,durum:'calisiyor',kaynak:'juri_puanlama',version:1};
            },undefined,false);
            const sonVeri=baslatma.snapshot?.val()||null;
            if(sonVeri){
                void ortakSureYedeginiKaydet(kategori,mac.id,id,sonVeri,
                    baslatma.committed&&yedekGecerli?'arsivden_geri_yuklendi':'sayac_kontrol')
                    .catch(err=>console.warn('Ortak süre yedeği yazılamadı:',err));
                if(baslatma.committed&&yedekGecerli){
                    const bilgi=document.getElementById('ortakKonusmaSayaci');
                    if(bilgi)bilgi.dataset.recoveredFromArchive='true';
                }
            }
        }catch(err){
            const alan=document.getElementById('ortakKonusmaSayaci');
            aktifOrtakSureVerisi=null;
            if(alan)alan.innerHTML='Ortak sayaç başlatılamadı: '+htmlEscape(String(err?.message||err))+'<div><button class="btn" style="width:auto;margin-top:8px;background:#92400e" onclick="juriSurePenceresiniSifirla(\'puanlama_ekrani\')">↻ Sorun giderme için ortak süreyi sıfırla</button></div>';
            ortakPuanArayuzunuGuncelle();
        }
    }
    function ortakSureUyariSesiCal(){
        // Ses engellense bile görünür uyarı aşağıda mutlaka gösterilir.
        try{
            const AudioSinifi=window.AudioContext||window.webkitAudioContext;
            if(!AudioSinifi)return;
            const audio=new AudioSinifi();
            const ses=audio.createOscillator();
            const seviye=audio.createGain();
            ses.type='sine';ses.frequency.value=880;
            seviye.gain.value=0.12;
            ses.connect(seviye);seviye.connect(audio.destination);
            ses.start();ses.stop(audio.currentTime+0.35);
            ses.onended=()=>{void audio.close();};
        }catch(e){console.warn('Süre uyarısı sesi açılamadı:',e);}
    }
    function ortakSureBirDakikaUyarisiKontrolEt(veri,kategori,macId,timerId){
        if(!veri)return;
        const s=ortakSureKalan(veri);
        if(!s||s.bitti||s.gecen<ORTAK_SURE_UYARI)return;
        const eskiErkenKapanma=ortakSureErkenKapanmaKaydi(veri);
        const aktif=veri.durum==='calisiyor'||eskiErkenKapanma;
        if(!aktif)return;
        const anahtar=[kategori,macId,timerId,veri.baslangicAt].join('|');
        if(ortakSureUyariVerilenler.has(anahtar))return;
        ortakSureUyariVerilenler.add(anahtar);
        ortakSureUyariSesiCal();
        alert('⚠️ 5 dakika doldu! Ortak konuşma süresinin bitmesine 1 dakika kaldı. Bu uyarı seçili öğrenci için jüri ekranlarında gösterilir.');
    }
    function ortakPuanArayuzunuGuncelle(){
        const veri=aktifOrtakSureVerisi;
        const acik=ortakPuanPenceresiAcik(veri);
        document.querySelectorAll('#kriterListesi .puan-btn').forEach(btn=>{
            btn.style.pointerEvents=acik?'auto':'none';
            btn.style.opacity=acik?'1':'.3';
            btn.setAttribute('aria-disabled',String(!acik));
        });
        const gonder=document.getElementById('btnPuanGonder');
        if(gonder&&!puanGonderiliyor){
            gonder.disabled=!acik;
            gonder.innerText=acik?'Puanları Gönder ✓':'Süre Doldu — Puan Gönderilemez';
        }
    }
    function ortakSureGoster(){
        const host=document.getElementById('ortakKonusmaSayaci');
        if(!host)return;
        const v=aktifOrtakSureVerisi;
        const s=ortakSureKalan(v);
        if(!s){
            host.innerHTML=`⏱ Ortak sayaç henüz oluşmadı veya okunamadı. Puanlama penceresi doğrulanamıyor.
                <div><button class="btn" style="width:auto;margin-top:8px;background:#92400e" onclick="juriSurePenceresiniSifirla('puanlama_ekrani')">↻ Sorun giderme için ortak süreyi sıfırla</button></div>`;
            ortakPuanArayuzunuGuncelle();return;
        }
        const bitti=s.bitti;
        const eskiErkenKapanma=ortakSureErkenKapanmaKaydi(v);
        const ortakSayacAktif=v?.durum==='calisiyor'||(eskiErkenKapanma&&!bitti);
        const besDakikaUyarisi=ortakSayacAktif&&s.gecen>=ORTAK_SURE_UYARI;
        const sonAt=ortakPuanSonAt(v);
        const simdi=ortakSureSimdi();
        const puanKapandi=simdi>sonAt;
        const ekSureKalan=Math.max(0,Math.ceil((sonAt-simdi)/1000));
        const altiDakikaDoldu=simdi>=Number(v.baslangicAt||0)+ORTAK_SURE_LIMIT*1000;
        const ekSureAktif=bitti&&!puanKapandi;
        const erkenKonusmaBitisi=v?.bitisNedeni==='konusma_bitti';
        const baslik=puanKapandi?'PUAN GİRİŞ SÜRESİ DOLDU':erkenKonusmaBitisi?'KONUŞMA BİTTİ — JÜRİ PUANLAMASI DEVAM EDİYOR':ekSureAktif?(v.durum==='tamamlandi'?'6 DAKİKA DOLDU':'ORTAK SÜRE BİTTİ')+' — PUAN GÖNDERME İÇİN SON '+ekSureKalan+' SN':bitti?'SÜRE TAMAMLANDI':'Kalan süre: '+sureyiMetneDonustur(s.kalan);
        host.innerHTML=`<div style="font-size:17px;font-weight:bold;color:${puanKapandi?'#fb7185':ekSureAktif?'#facc15':bitti?'#fb7185':besDakikaUyarisi?'#facc15':'#38bdf8'}">⏱ ${baslik}</div>
            <div style="font-size:12px">${htmlEscape(v.ogrenci||'')} · Kullanılan: ${sureyiMetneDonustur(s.gecen)} · Firebase ortak sayacı</div>
            ${erkenKonusmaBitisi&&!puanKapandi?`<div role="status" style="background:#123b35;color:#a7f3d0;border:1px solid #0f766e;padding:10px;border-radius:8px;margin-top:8px;font-size:13px;font-weight:700;">Konuşma süresi ${sureyiMetneDonustur(s.gecen)} olarak kaydedildi. Diğer jüri üyeleri, ortak başlangıçtan itibaren 6 dakika + 10 saniyelik süre dolana kadar puanlamaya devam edebilir. Kalan puanlama süresi: ${sureyiMetneDonustur(ekSureKalan)}.</div>`:''}
            ${besDakikaUyarisi?'<div role="alert" style="background:#713f12;color:#fef08a;border:2px solid #facc15;padding:12px;border-radius:10px;margin-top:10px;font-size:17px;font-weight:800;">⚠️ 5. DAKİKA DOLDU — SON 1 DAKİKA! Öğrenciyi uyarın.</div>':''}
            ${ekSureAktif&&!erkenKonusmaBitisi?`<div role="alert" style="background:#713f12;color:#fef08a;border:1px solid #facc15;padding:9px;border-radius:8px;margin-top:8px;font-size:13px;font-weight:750;">⚠️ Puan göndermek için yalnızca ${ekSureKalan} saniye kaldı. Süre dolunca puan seçimi ve gönderme kapanır.</div>`:''}
            ${puanKapandi?'<div role="alert" style="background:#451a1a;color:#fecaca;border:1px solid #b91c1c;padding:9px;border-radius:8px;margin-top:8px;font-size:13px;font-weight:750;">Ortak sayaç bittikten sonra ek 10 saniye de tamamlandı. Puan seçimi/gönderme kapatıldı. Gerekliyse seçili öğrenci için isteğe bağlı sıfırlama yapın; bu işlem tüm jüri cihazlarını etkiler ve kayda alınır.</div>':''}
            ${!bitti?'<button class="btn" style="width:auto;margin-top:7px;padding:6px 12px;background:#475569" onclick="ortakSureErkenBitir()">⏹ Konuşma bitti — süreyi kaydet</button>':''}
            ${puanKapandi?`<button class="btn" style="width:auto;margin-top:7px;padding:7px 12px;background:#92400e" onclick="juriSurePenceresiniSifirla('puanlama_ekrani')">↻ Sorun varsa ortak süreyi sıfırla</button>`:''}`;
        ortakPuanArayuzunuGuncelle();
        if(besDakikaUyarisi&&(v.durum==='calisiyor'||eskiErkenKapanma))
            ortakSureBirDakikaUyarisiKontrolEt(v,aktifOrtakSureKimlik?.kategori,aktifOrtakSureKimlik?.macId,aktifOrtakSureKimlik?.id);
        // Sayaç yalnızca gerçek 6 dakika dolduğunda kapanır. Eski sürümün
        // erken puan gönderimiyle kapanmış kayıtları da burada onarılarak tamamlanır.
        if(bitti&&(v.durum==='calisiyor'||eskiErkenKapanma)&&!ortakSureBittirmeCalisiyor){
            ortakSureBittirmeCalisiyor=true;
            const k=aktifOrtakSureKimlik;
            void aktifOrtakSureRef.transaction(cur=>{
                const erkenKapanma=ortakSureErkenKapanmaKaydi(cur);
                if(!cur||!(cur.durum==='calisiyor'||erkenKapanma))return;
                const bas=Number(cur.baslangicAt||0);
                if(!bas||ortakSureSimdi()<bas+ORTAK_SURE_LIMIT*1000)return;
                return {...cur,durum:'tamamlandi',limitSaniye:ORTAK_SURE_LIMIT,
                    sureSaniye:ORTAK_SURE_LIMIT,bitisAt:bas+ORTAK_SURE_LIMIT*1000,
                    bitisNedeni:'sure_doldu'};
            },undefined,false).then(result=>{
                if(result.committed&&k){
                    void ortakSureYedeginiKaydet(k.kategori,k.macId,k.id,result.snapshot.val(),'sure_doldu')
                        .catch(e=>console.warn('Tamamlanan süre yedeklenemedi:',e));
                    void otomatikSureleriKaydet(k.kategori,k.macId);
                }
            }).catch(e=>console.warn('Süre tamamlanması senkronu:',e))
              .finally(()=>{ortakSureBittirmeCalisiyor=false;});
        }
    }
    // Geriye dönük uyumluluk: bu yardımcı artık yalnızca süre kaydını okur.
    // Puan gönderimi ortak sayaçta yazma yapmaz ve hiçbir jüriyi kilitlemez.
    async function ortakSurePuanGonderinceBitir(kategori,mac,okul,ogrenci,gondermeAni){
        const ad=(ogrenci||'').split(' (')[0];
        const id=ortakSureKimligi(okul,ad);
        const ref=db.ref(`maclar/${kategori}/${mac.id}/konusmaSayaclari/${id}`);
        const snap=await ref.once('value');
        const veri=snap.val();
        if(!veri)throw new Error('Bu öğrenci için ortak sayaç kaydı bulunamadı.');

    async function ortakSureErkenBitir(){
        if(!aktifOrtakSureRef||!aktifOrtakSureVerisi||!confirm('Konuşma tamamlandı mı? Geçen süre öğrenci adına Firebase’e kaydedilecek.'))return;
        try{
            const result=await aktifOrtakSureRef.transaction(cur=>{
                if(!cur||cur.durum!=='calisiyor')return;
                const s=ortakSureKalan(cur);
                return {...cur,durum:'bitti',limitSaniye:ORTAK_SURE_LIMIT,sureSaniye:s.gecen,bitisAt:ortakSureSimdi(),bitisNedeni:'konusma_bitti'};
            },undefined,false);
            if(result.committed&&aktifOrtakSureKimlik){
                const k=aktifOrtakSureKimlik;
                await ortakSureYedeginiKaydet(k.kategori,k.macId,k.id,result.snapshot.val(),'konusma_bitti');
                await otomatikSureleriKaydet(k.kategori,k.macId);
            }
            if(!result.committed)alert('Süre başka jüri tarafından tamamlanmış; güncel kayıt görüntüleniyor.');
        }catch(err){alert('Öğrenci konuşma süresi kaydedilemedi: '+String(err?.message||err));}
    }
    function secimEkraniOrtakSureMetni(mac,ogr,okul){
        const v=mac?.konusmaSayaclari?.[ortakSureKimligi(okul,(ogr||'').split(' (')[0])];

    }

    async function puanlamaSayfasinaGec() {
        const oturum = juriOturumuGetir();
        if (!oturum) return alert('Önce bu cihazı 1., 2. veya 3. jüriye kilitleyin.');
        secimler.juri = oturum.juri;
        secimler.juriAd = oturum.ad;
        if(!secimler.taraf || !secimler.juri || !secimler.ogr || !secimler.okul || !secimler.hukOkul || !secimler.muhOkul) return alert('Lütfen seçimleri eksiksiz yapın!');
        const fixtureMac=puanlamaMaclar.get(secimler.macId);
        if(!juriOturumuSeciliMacaUygun(oturum,fixtureMac))
            return alert('Bu jüri kilidi seçili maçın günü/kategorisi için geçerli değil. “Jüri Kilidini Kaldır” düğmesiyle kilidi kaldırın ve günün asıl jüri listesinden kendi adınızı seçin.');
        const source=fixtureMac?puanlamaKaynakAdi(fixtureMac,secimler.taraf):puanlamaTamOkulEslesmesi(secimler.okul);
        if(!source || !(puanlamaKayitliOkullar[source]||[]).length)
            return alert('Bu okulun öğrenci listesi bulunamadı. Önce öğrenci kayıtlarını kontrol edin veya okul eşleştirmesini kaydedin.');
        if(!(puanlamaKayitliOkullar[source]||[]).some((ad,i)=>`${ad} (${i<3?i+1+'. Konuşmacı':'Grup Sözcüsü'})`===secimler.ogr))
            return alert('Seçilen öğrenci kayıtlı listede bulunamadı. Önce öğrenci seçimini yenileyin.');
        const mac = mevcutMacBilgisi();
        if (!mac) return alert('Maç bilgisi eksik.');
        secimler.macId=mac.id;
        aktifPuanTaslak=puanTaslakBaglamiOlustur(mac,oturum);
        verilenPuanlar={};
        // Ortak sayaç daha önce bitmiş ve ortak 6 dakika + 10 saniyelik pencere kapanmışsa ekranı açma.

        try{
            const timerId=ortakSureKimligi(secimler.okul,(secimler.ogr||'').split(' (')[0]);

            if(navigator.onLine&&firebaseBagli){
                const ts=await db.ref(`maclar/${secimler.kategori}/${mac.id}/konusmaSayaclari/${timerId}`).once('value');
                timer=ts.val();
            }else timer=fixtureMac?.konusmaSayaclari?.[timerId]||null;
            if(timer&&ortakPuanPenceresiKapandi(timer)){
                await juriSureOlayiYaz(juriSureDenetimTemeli({islem:'puanlama_ekrani_acma',durum:'engellendi_sure_asimi',
                    hata:'Ortak sayaç bitişinden sonraki 10 saniyelik puanlama penceresi dolmuş.',sifirlamaSecenegiSunuldu:true,
                    sifirlamaTalepEdildi:false,sifirlamaKullanildi:false,izinVerilenEkSureSaniye:ORTAK_PUAN_EK_SURE})).catch(e=>console.warn('Süre aşımı günlüğü yazılamadı:',e));
                alert('Bu öğrenci için Ortak sayaç bitişinden sonraki 10 saniyelik puanlama penceresi dolmuş. Puanlama ekranı açılmadı. Gerekliyse geri dönüp “Puanlama açılmıyor mu? Ortak süreyi sıfırla” düğmesiyle gerekçeli ve kayıtlı sıfırlama yapın.');
                return;
            }
        }catch(timerCheckErr){console.warn('Puanlama açılışında süre kontrolü tamamlanamadı:',timerCheckErr);}
        if (navigator.onLine && firebaseBagli) {
            const durum = await macDurumuGetir(secimler.kategori, mac.id);
            if (['kapali','iptal'].includes(durum?.durum)) return alert('Bu maç kapatılmış veya iptal edilmiştir. Puanlama yapılamaz.');
        }
        verilenPuanlar = {};
        const html = `<div class="card"><h2>Puanlama Tablosu: ${htmlEscape(secimler.ogr)}</h2>
                    <div style="font-size:14px; color:var(--text-muted); margin-bottom:20px;">Kategori: <b>${htmlEscape(secimler.kategori)}</b> | Maç: <b>${htmlEscape(mac.etiket)}</b> | Okul: <b>${htmlEscape(secimler.okul)}</b> | Değerlendiren: <b>${htmlEscape(oturum.juri)} · ${htmlEscape(oturum.ad)}</b></div>
                    <div id="ortakKonusmaSayaci" class="puanlama-bilgi">⏱ Ortak süre başlatılıyor…</div>
                    <div style="font-size:12px;line-height:1.5;color:#cbd5e1;margin:-3px 0 10px;">Ortak süre 6 dakikadır. Süre bitince puan seçimi ve gönderme için en fazla 10 saniye ek süre tanınır; bu pencere kapanınca giriş engellenir. Sorun yaşandıysa yalnızca gerekçeyle ve denetim kaydı oluşturarak ortak süre sıfırlanabilir.</div>
                    <div id="juriSureBilgisi" class="puanlama-bilgi">Resmî öğrenci süresi kontrol ediliyor…</div>
                    <div id="kriterListesi"></div>
                    <div id="puanTaslakDurumu" class="puanlama-bilgi" style="font-size:12px;">Puan seçimleri otomatik olarak cihazda, bağlantı varsa Firebase’de taslak kaydedilir.</div>
                    <button id="btnPuanGonder" class="btn" style="background:var(--success); border:none; margin-top:25px; padding:16px; font-size:16px;" onclick="puanlariGonder()">Puanları Gönder ✓</button>
                    <button class="btn" style="background:#475569" onclick="renderPuanlamaSecim()">← Geri Dön</button></div>`;
        document.getElementById('app').innerHTML = html;
        ortakPuanArayuzunuGuncelle();
        void juriSureOturumLogla('acildi',{izinVerilenEkSureSaniye:ORTAK_PUAN_EK_SURE,
            surePenceresi:'6 dakika + en fazla 10 saniye',sifirlamaSecenegiSunuldu:true,
            sifirlamaTalepEdildi:false,sifirlamaKullanildi:false,sifirlamaDurumu:'kullanilmadi'});
        const list = document.getElementById('kriterListesi');
        db.ref(`maclar/${secimler.kategori}/${mac.id}`).once('value').then(snapshot=>{
            const alan=document.getElementById('juriSureBilgisi');if(!alan)return;
            const m=snapshot.val()||{};
            const taraf=secimler.taraf==='HÜKÜMET'?'huk':'muh';
            const ad=skorEslesmeAnahtari((secimler.ogr||'').split(' (')[0]);
            const rec=(m.sureEsitlik?.ogrenciler?.[taraf]||[]).find(x=>skorEslesmeAnahtari(x.ad)===ad);
            alan.textContent=rec ? '⏱ Kayıtlı konuşma süresi: '+sureyiMetneDonustur(rec.saniye)
                : '⏱ Bu öğrenci için henüz resmî konuşma süresi kaydedilmemiş. Yönetici → Maç Yönetimi → Öğrenci Süreleri bölümünden kaydedilebilir.';
        }).catch(err=>{const alan=document.getElementById('juriSureBilgisi');if(alan)alan.textContent='Konuşma süresi okunamadı: '+String(err?.message||err);});
        void ortakSureBaslat(secimler.kategori,mac,secimler.okul,secimler.ogr);
        krit.forEach((k, i) => {
            const d = document.createElement('div'); d.className = 'kriter-card';
            let kutular = '';
            for(let n=1; n<=k.m; n++) kutular += `<div class="puan-btn" onclick="puanSec(this, ${i}, ${n})">${n}</div>`;
            d.innerHTML = `<span class="kriter-label">${i+1}. ${k.t} <span style="color:var(--text-muted); font-weight:normal;">(Maks: ${k.m})</span></span><div class="puan-row">${kutular}</div>`;
            list.appendChild(d);
        });
        void puanTaslaginiGeriYukle(aktifPuanTaslak);
    }

    function puanSec(element, kriterIndex, puan) {
        if(!aktifOrtakSureVerisi){alert('Ortak süre doğrulanmadan puan girilemez. Bağlantıyı kontrol edin veya sorun giderme sıfırlamasını kullanın.');return;}
        if(!ortakPuanPenceresiAcik(aktifOrtakSureVerisi)){
            ortakSureGoster();
            alert('Puan girişi süresi doldu. Ortak sayaç bitişinden sonraki 10 saniyelik sınır aşıldığı için puan girişi kapatıldı.');return;
        }
        element.parentElement.querySelectorAll('.puan-btn').forEach(x => x.classList.remove('selected'));
        element.classList.add('selected');
        verilenPuanlar[kriterIndex] = puan;
        puanTaslaginiKaydet();
    }

    async function puanlariGonder() {
        if (puanGonderiliyor) return;
        // Gönderim hakkı, ağ gecikmesinden sonra değil kullanıcının butona bastığı anda ölçülür.
        const puanGondermeAni=ortakSureSimdi();
        if(!aktifOrtakSureVerisi){
            await juriSureOlayiYaz(juriSureDenetimTemeli({islem:'puan_gonderme',durum:'engellendi_sayac_yok',
                hata:'Ortak sayaç doğrulanamadı; puan kaydedilmedi.',sifirlamaTalepEdildi:false,sifirlamaKullanildi:false})).catch(e=>console.warn('Puan engeli günlüğü yazılamadı:',e));
            await juriSureOturumLogunuGuncelle({durum:'puan_gonderme_engellendi_sayac_yok',puanGonderildi:false});
            return alert('Ortak süre doğrulanamadığı için puan kaydedilmedi. Bağlantıyı kontrol edin; gerekirse ortak süreyi gerekçeli olarak sıfırlayın.');
        }
        if(!ortakPuanPenceresiAcik(aktifOrtakSureVerisi,puanGondermeAni)){
            await juriSureOlayiYaz(juriSureDenetimTemeli({islem:'puan_gonderme',durum:'engellendi_sure_asimi',
                hata:'Ortak sayaç bitişinden sonraki 10 saniyelik puanlama penceresi dolmuş.',sifirlamaSecenegiSunuldu:true,
                sifirlamaTalepEdildi:false,sifirlamaKullanildi:false,izinVerilenEkSureSaniye:ORTAK_PUAN_EK_SURE})).catch(e=>console.warn('Süre aşımı günlüğü yazılamadı:',e));
            ortakSureGoster();
            await juriSureOturumLogunuGuncelle({durum:'puan_gonderme_engellendi_sure_asimi',puanGonderildi:false,
                puanGondermeEngelNedeni:'Ortak sayaç bitişinden sonraki 10 saniye doldu.'});
            return alert('Ortak sayaç bitişinden sonraki 10 saniyelik puanlama süresi doldu. Puanlar gönderilmedi. Gerekliyse isteğe bağlı ve gerekçeli ortak süre sıfırlaması kullanabilirsiniz.');
        }
        if(Object.keys(verilenPuanlar).length < 13) return alert('Lütfen tüm 13 kriteri puanlayın!');
        const oturum = juriOturumuGetir();
        if (!oturum) return alert('Günün jüri listesinden adınızı seçip kilitleyin.');
        const seciliFixture = puanlamaMaclar.get(secimler.macId);
        if(!juriOturumuSeciliMacaUygun(oturum,seciliFixture))
            return alert('Jüri kilidi seçili maçın günü/kategorisi için geçerli değil. Kilidi kaldırıp günün asıl jüri listesinden kendi adınızı seçin.');
        secimler.juri = oturum.juri;
        secimler.juriAd = oturum.ad;
        const mac = mevcutMacBilgisi();
        if (!mac) return alert('Maç bilgisi eksik.');
        secimler.macId = mac.id;
        secimleriKaydet();
        const kayitId = puanKayitKimligi(secimler, mac.id);
        const btn = document.getElementById('btnPuanGonder');
        puanGonderiliyor = true;
        if (btn) { btn.disabled = true; btn.innerText = 'Gönderiliyor...'; }

        const yerelZaman = Date.now();
        const kayitTemel = {
            secim: { ...secimler, juri: oturum.juri, juriAd: oturum.ad },
            puanlar: { ...verilenPuanlar },
            macId: mac.id,
            mac: macEskiEtiketi(mac.hukOkul, mac.muhOkul),
            macEtiketi: mac.etiket,
            clientId: getClientId(),
            localUpdatedAt: yerelZaman,
            version: 3
        };

        try {
            if (!navigator.onLine || !firebaseBagli) {
                puaniKuyrugaEkle({ kategori:secimler.kategori, macId:mac.id, kayitId, kayit:{...kayitTemel, createdAt:yerelZaman, updatedAt:yerelZaman, queuedOffline:true},
                    taslakYolu:aktifPuanTaslak?.cloudPath,taslakYerelAnahtari:aktifPuanTaslak?.localKey });
                await juriSureOturumLogunuGuncelle({durum:'puanlar_kuyruga_alindi',puanGonderildi:false,puanKuyrugaAlindi:true,puanGondermeAniClient:puanGondermeAni});
                alert('İnternet bağlantısı yok. Puan bu cihazda kuyruğa alındı; bağlantı gelince gönderilecek. Ortak sayaç değiştirilmeyecek.');
                secimler.ogr = '';
                secimleriKaydet();
                return renderPuanlamaSecim(mac.id);
            }

            await ensureMatchExists(secimler.kategori, mac.hukOkul, mac.muhOkul);
            const m = await macDurumuGetir(secimler.kategori, mac.id);
            if (['kapali','iptal'].includes(m?.durum)) return alert('Bu maç kapatılmış veya iptal edilmiştir. Puan gönderilmedi.');

            // Her jüri, kendi deterministik puan kayıt anahtarına yazar. Bütün kategori
            // kayıtlarını okumak veya kategori düğümüne toplu update göndermek gerekmez.
            const kayitRef=db.ref(`puanlar/${secimler.kategori}/${kayitId}`);
            const oncekiSnap=await kayitRef.once('value');
            const onceki=oncekiSnap.val()||null;
            if(onceki){
                const ogrAd=(secimler.ogr||'').split(' (')[0];
                const onay=confirm(`${oturum.juri} tarafından ${ogrAd} için daha önce puan gönderilmiş.\n\nYalnızca bu jüriye ait önceki kayıt güncellenecek. Devam edilsin mi?`);
                if(!onay)return;
            }
            const kayit = {
                ...kayitTemel,
                createdAt: onceki?.createdAt || firebase.database.ServerValue.TIMESTAMP,
                updatedAt: firebase.database.ServerValue.TIMESTAMP,
                queuedOffline: false
            };
            // Ağda kayıt öncesi son ortak süre denetimi: gönderim tıklaması geç kalmışsa yazma.
            const sonTimerSnap=await db.ref(`maclar/${secimler.kategori}/${mac.id}/konusmaSayaclari/${ortakSureKimligi(secimler.okul,(secimler.ogr||'').split(' (')[0])}`).once('value');
            const sonTimer=sonTimerSnap.val();
            if(!ortakPuanPenceresiAcik(sonTimer,puanGondermeAni)){
                aktifOrtakSureVerisi=sonTimer||aktifOrtakSureVerisi;ortakSureGoster();
                await juriSureOlayiYaz(juriSureDenetimTemeli({islem:'puan_gonderme',durum:'engellendi_son_kontrol',
                    hata:'Firebase üzerindeki son süre kontrolünde ortak sayaç bitişinden sonraki 10 saniyelik sınır aşılmış.',
                    sifirlamaSecenegiSunuldu:true,sifirlamaTalepEdildi:false,sifirlamaKullanildi:false,
                    izinVerilenEkSureSaniye:ORTAK_PUAN_EK_SURE})).catch(e=>console.warn('Son kontrol günlüğü yazılamadı:',e));
                await juriSureOturumLogunuGuncelle({durum:'puan_gonderme_engellendi_sure_asimi',puanGonderildi:false,
                    puanGondermeEngelNedeni:'Firebase son kontrolünde 10 saniyelik pencere doldu.'});
                alert('Firebase üzerindeki son kontrol, puanlama süresinin dolduğunu gösterdi. Puan kaydedilmedi. Gerekliyse ortak süreyi sıfırlayıp yeniden puanlayın.');
                return;
            }
            aktifOrtakSureVerisi=sonTimer;
            // Doğrudan yalnızca bu jüriye ait kaydı yaz. Başka jürilerin kayıtları ve sayaç
            // bu işlem tarafından hiçbir zaman güncellenmez.
            await kayitRef.set(kayit);
            const puanYedekYolu=`arsiv/juriPuanYedekleri/${secimler.kategori}/${mac.id}/${kayitId}`;
            try{
                await db.ref(puanYedekYolu+'/sonDurum').set({...kayit,yedekAt:firebase.database.ServerValue.TIMESTAMP});
                await db.ref(puanYedekYolu+'/gecmis/'+String(yerelZaman)).set({...kayit,yedekAt:firebase.database.ServerValue.TIMESTAMP,yedekOlayi:onceki?'juri_puani_guncellendi':'juri_puani_ilk_kayit'});
            }catch(yedekErr){console.warn('Resmî puan kaydedildi ancak bağımsız arşiv yedeği yazılamadı:',yedekErr);}
            await puanTaslaginiSil(aktifPuanTaslak);
            eskiJuriPuanMukerrerleriniTemizle(secimler.kategori,kayitId,kayitId);
            await juriSureOturumLogunuGuncelle({durum:'puanlar_gonderildi',puanGonderildi:true,
                puanGonderildiAt:firebase.database.ServerValue.TIMESTAMP,puanGondermeAniClient:puanGondermeAni,
                kaydedilenKayitId:kayitId});
            alert(onceki ? 'Bu jüriye ait puanlar güncellendi.' : 'Puanlar başarıyla buluta gönderildi!');
            // Turnuva ağacını yansıtma ikincil işlemdir; başarısızlığı kaydedilmiş puanı geri almış gibi göstermez.
            try{await turnuvaAgacinaPuanYansit(secimler.kategori, mac.hukOkul, mac.muhOkul);}
            catch(agacErr){console.warn('Puan kaydedildi ancak turnuva ağacı güncellenemedi:',agacErr);}
            secimler.ogr = '';
            secimleriKaydet();
            renderPuanlamaSecim(mac.id);
        } catch (err) {
            console.error('Puan gönderme hatası:', err);
            const code = String(err?.code || '').toLowerCase();
            if (!code.includes('permission')) {
                puaniKuyrugaEkle({ kategori:secimler.kategori, macId:mac.id, kayitId, kayit:{...kayitTemel, createdAt:yerelZaman, updatedAt:yerelZaman, queuedOffline:true} });
                await juriSureOturumLogunuGuncelle({durum:'puanlar_kuyruga_alindi_hata',puanGonderildi:false,puanKuyrugaAlindi:true,
                    puanKuyrukHatasi:String(err?.message||err),puanGondermeAniClient:puanGondermeAni});
                alert('Bağlantı sorunu nedeniyle puan yerel kuyruğa alındı. İnternet geldiğinde otomatik gönderilecek; ortak sayaç kapatılmadı.');
                secimler.ogr = '';
                secimleriKaydet();
                renderPuanlamaSecim(mac.id);
            } else {
                alert('Puan gönderilemedi: Firebase erişim yetkisi reddedildi.');
            }
        } finally {
            puanGonderiliyor = false;
            const yeniBtn = document.getElementById('btnPuanGonder');
            if (yeniBtn) { yeniBtn.innerText = 'Puanları Gönder ✓'; ortakPuanArayuzunuGuncelle(); }
        }
    }

                }
            }catch(err){console.warn('Sabit fikstür maçları listeye eklenemedi (mevcut kayıtlar korunur):',err);}
            raporVerisiniIsle(kayitlar, maclarMap, resmiFikstur);
        } catch (err) {
            console.error('Rapor verisi okunamadı:', err);
            alert('Sonuçlar okunamadı: ' + (err?.message || err));

    function raporVerisiniIsle(kayitlar, maclarMap, resmiFikstur={}) {
        const mSet = new Map();
        const ogrenciPuanlari = {};
        const okulPuanlari = {};
        const juriGruplari = {};
        kayitlar.forEach(v => {
            const mid = kayitMacId(v), ml = kayitMacEtiketi(v);
            mSet.set(mid, ml);
            const toplamPuan = puanToplami(v);
            const secim = v.secim || {};
            const ogrKisa = (secim.ogr || '').split(' (')[0];
            if(secim.ogr) {
                const temizIsim = ogrKisa + ' (' + (secim.okul || '-') + ')';
                if(!ogrenciPuanlari[temizIsim]) ogrenciPuanlari[temizIsim] = { skor:0, sayac:0 };
                ogrenciPuanlari[temizIsim].skor += toplamPuan;
                ogrenciPuanlari[temizIsim].sayac += 1;
                const gk = ogrenciGrupKimligi(v);
                if(!juriGruplari[gk]) juriGruplari[gk] = { macId:mid, mac:ml, okul:secim.okul||'-', ogrenci:ogrKisa, juriler:new Set(), toplam:0, sayac:0 };
                if(secim.juri) juriGruplari[gk].juriler.add(secim.juri);
                juriGruplari[gk].toplam += toplamPuan;
                juriGruplari[gk].sayac += 1;
            }
            if(secim.okul) {
                if(!okulPuanlari[secim.okul]) okulPuanlari[secim.okul]=0;
                okulPuanlari[secim.okul] += toplamPuan;
            }
        });
        // İlgili kategorideki fikstür maçları, henüz puan girilmemiş olsa da kapsamda tutulur.
        Object.entries(maclarMap||{}).forEach(([id,m])=>{
            if(m?.hukOkul && m?.muhOkul && !mSet.has(id))
                mSet.set(id,m.etiket||macEtiketi(m.hukOkul,m.muhOkul));
        });
        const siraliList = Object.keys(ogrenciPuanlari).map(isim=>({isim,ortalama:Number((ogrenciPuanlari[isim].skor/ogrenciPuanlari[isim].sayac).toFixed(1)),juriSayisi:ogrenciPuanlari[isim].sayac})).sort((a,b)=>b.ortalama-a.ortalama);
        const podium=document.getElementById('mvp-podium');
        if(siraliList.length){podium.innerHTML=''; for(let i=0;i<Math.min(3,siraliList.length);i++) podium.innerHTML += `<div class="summary-row"><span class="summary-name">${htmlEscape(siraliList[i].isim.split(' (')[0])}</span><span class="summary-score">${siraliList[i].ortalama.toFixed(1)} Ort.</span></div>`;} else podium.innerHTML='Veri yok.';
        const siraliOkullar=Object.keys(okulPuanlari).map(oAd=>({isim:oAd,toplam:okulPuanlari[oAd]})).sort((a,b)=>b.toplam-a.toplam);
        const schoolBoard=document.getElementById('school-leaderboard');
        if(siraliOkullar.length){schoolBoard.innerHTML=''; siraliOkullar.forEach((x,i)=>schoolBoard.innerHTML += `<div class="summary-row"><span class="summary-name">${i+1}. ${htmlEscape(x.isim)}</span><span class="summary-score">${x.toplam} Puan</span></div>`);} else schoolBoard.innerHTML='Veri yok.';
        const juriRows=Object.values(juriGruplari).sort((a,b)=>(a.mac+a.okul+a.ogrenci).localeCompare(b.mac+b.okul+b.ogrenci,'tr'));
        const tamSayisi=juriRows.filter(x=>BEKLENEN_JURILER.every(j=>x.juriler.has(j))).length;
        const eksikSayisi=juriRows.length-tamSayisi;
        const metrics=document.getElementById('adminMetrics');
        if(metrics) metrics.innerHTML=`<div class="admin-metric"><span>Tekil Puan Kaydı</span><strong>${kayitlar.length}</strong></div><div class="admin-metric"><span>Puanlanan Öğrenci/Maç</span><strong>${juriRows.length}</strong></div><div class="admin-metric"><span>3/3 Jüri Tamam</span><strong>${tamSayisi}</strong></div><div class="admin-metric"><span>Jürisi Eksik</span><strong>${eksikSayisi}</strong></div>`;
        const coverage=document.getElementById('juryCoverage');
        if(coverage){let html='<table class="tutanak-table"><tr><th>Maç</th><th>Okul</th><th>Öğrenci</th><th>Jüri Durumu</th><th>Eksik Jüri</th><th>Ortalama</th></tr>'; juriRows.forEach(x=>{const eksikler=BEKLENEN_JURILER.filter(j=>!x.juriler.has(j)); const tam=!eksikler.length; const ort=x.sayac?(x.toplam/x.sayac).toFixed(1):'-'; html += `<tr><td>${htmlEscape(x.mac)}</td><td>${htmlEscape(x.okul)}</td><td>${htmlEscape(x.ogrenci)}</td><td class="${tam?'jury-ok':'jury-missing'}">${x.juriler.size}/3</td><td>${tam?'—':htmlEscape(eksikler.join(', '))}</td><td>${ort}</td></tr>`;}); coverage.innerHTML=html+'</table>';}
        sonRaporVerisi={kategori:secimler.kategori,kayitlar,juriRows,siraliList,siraliOkullar,maclarMap,resmiFikstur};
        raporGunSecenekleriniDoldur();
        tutanakTablosuDoldur();
    }

    // V3.21 - Gün seçmeli resmî takım puan tutanağı: öğrenci kayıtları ayrıntıda korunur.
    // Resmî galip veya kesinleşmiş puanlar ham jüri puanlarıyla asla değiştirilmez.
    function raporYerelBugunAnahtari() {
        const d=new Date();
        return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    function raporGunAnahtariSatirdan(m) {
        return raporFiksturTarihAnahtari(m?.fiksturTarih||m?.tarih||'');
    }

    function raporGunFiltresineUyar(m, secili= document.getElementById('gunFiltre')?.value||'hepsi') {
        if(secili==='hepsi')return true;
        const tarih=raporGunAnahtariSatirdan(m);
        return secili==='tarihsiz' ? !tarih : tarih===secili;
    }

    function raporGunSecenekleriniDoldur() {
        const select=document.getElementById('gunFiltre');
        if(!select||!sonRaporVerisi)return;
        const onceki=select.value;
        const gunler=new Map();
        for(const r of raporTakimVerisiniDerle(sonRaporVerisi)){
            const raw=String(r.m?.fiksturTarih||r.m?.tarih||'').trim();
            const key=raporGunAnahtariSatirdan(r.m);
            if(key){if(!gunler.has(key))gunler.set(key,raw||key);}
            else if(!gunler.has('tarihsiz'))gunler.set('tarihsiz','Tarihi henüz belirlenmeyen maçlar');
        }
        const tarihli=[...gunler.entries()].filter(([k])=>k!=='tarihsiz').sort((a,b)=>a[0].localeCompare(b[0]));
        let html='<option value="hepsi">Tüm Günler (genel rapor)</option>';
        for(const [key,label] of tarihli)html+=`<option value="${htmlEscape(key)}">${htmlEscape(label)}</option>`;
        if(gunler.has('tarihsiz'))html+=`<option value="tarihsiz">${htmlEscape(gunler.get('tarihsiz'))}</option>`;
        select.innerHTML=html;
        const mevcutGecerli=onceki && [...select.options].some(o=>o.value===onceki);
        const ilkGun=tarihli[0]?.[0]||(gunler.has('tarihsiz')?'tarihsiz':'hepsi');
        select.value=mevcutGecerli?onceki:(gunler.has(raporYerelBugunAnahtari())?raporYerelBugunAnahtari():ilkGun);
    }

    function raporFiksturTarihAnahtari(tarih) {
        const s=String(tarih||'').trim();
        const iso=s.match(/(20\d{2})-(\d{1,2})-(\d{1,2})/);
        if(iso)return `${iso[1]}-${iso[2].padStart(2,'0')}-${iso[3].padStart(2,'0')}`;
        const tr=s.match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](20\d{2})/);
        if(tr)return `${tr[3]}-${tr[2].padStart(2,'0')}-${tr[1].padStart(2,'0')}`;
        const aylar=['ocak','şubat','mart','nisan','mayıs','haziran','temmuz','ağustos','eylül','ekim','kasım','aralık'];
        const parca=s.toLocaleLowerCase('tr-TR').match(/^(\d{1,2})\s+(\S+)\s+(20\d{2})/);
        if(parca){const ix=aylar.indexOf(parca[2]);if(ix>=0)return `${parca[3]}-${String(ix+1).padStart(2,'0')}-${parca[1].padStart(2,'0')}`;}
        return '';
    }

    function raporTakimVerisiniDerle(veri=sonRaporVerisi) {
        if(!veri)return [];
        const tum=new Map(Object.entries(veri.maclarMap||{}));
        for(const v of veri.kayitlar){
            const id=kayitMacId(v),s=v.secim||{};
            if(!tum.has(id)&&s.hukOkul&&s.muhOkul)
                tum.set(id,{id,etiket:kayitMacEtiketi(v),hukOkul:s.hukOkul,muhOkul:s.muhOkul,durum:'acik'});
        }
        const kategori=veri.kategori==='LİSE'?'lise':'ortaokul';
        const jurilerTarih=veri.resmiFikstur?.juries||{};
        const sonuclar=veri.resmiFikstur?.finalizedMatches||{};
        const rows=[];
        for(const [id,m] of tum){
            if(!m?.hukOkul||!m?.muhOkul)continue;
            const votes=veri.kayitlar.filter(v=>kayitMacId(v)===id);
            const roleScores=BEKLENEN_JURILER.map(()=>({huk:0,muh:0,hukKayit:0,muhKayit:0,names:new Set()}));
            let bekleyenPuan=false;
            for(const v of votes){
                const x=v.secim||{};
                const ix=BEKLENEN_JURILER.indexOf(x.juri);
                if(ix<0)continue;
                const name=puanMetniNormalize(x.juriAd||v.juriAd||'');
                if(name)roleScores[ix].names.add(name);
                const hangi=(skorEslesmeAnahtari(x.okul)===skorEslesmeAnahtari(m.hukOkul)||skorEslesmeAnahtari(x.okul)===skorEslesmeAnahtari(m.ogrenciKaynaklari?.huk))?'huk':
                    (skorEslesmeAnahtari(x.okul)===skorEslesmeAnahtari(m.muhOkul)||skorEslesmeAnahtari(x.okul)===skorEslesmeAnahtari(m.ogrenciKaynaklari?.muh))?'muh':
                    x.taraf==='HÜKÜMET'?'huk':x.taraf==='MUHALEFET'?'muh':null;
                if(!hangi)continue;
                const valid=krit.every((k,i)=>{const n=Number(v.puanlar?.[i]??v.puanlar?.[String(i)]);return Number.isInteger(n)&&n>=1&&n<=k.m;});
                if(!valid){bekleyenPuan=true;continue;}
                roleScores[ix][hangi]+=puanToplami(v);
                roleScores[ix][hangi+'Kayit']++;
            }
            const date=raporFiksturTarihAnahtari(m.fiksturTarih||m.tarih||'');
            const gorevli=jurilerTarih[date]?.[kategori]||{};
            const gorevliRoller=['asil1','asil2','asil3'];
            const names=roleScores.map((x,i)=>{
                if(x.names.size)return {name:[...x.names].join(' / '),kaynak:'puan',coklu:x.names.size>1};
                const n=puanMetniNormalize(gorevli[gorevliRoller[i]]?.name||'');
                return {name:n||'—',kaynak:n?'fikstur':'eksik',coklu:false};
            });
            const rawH=roleScores.reduce((t,x)=>t+x.huk,0),rawM=roleScores.reduce((t,x)=>t+x.muh,0);
            const resmi=sonuclar[m.fiksturNo]||m.sonuc||{};
            const saved=(m.durum==='kapali' && m.sonuc)?m.sonuc:resmi;
            const puanH=typeof saved.puanHuk==='number'&&Number.isFinite(saved.puanHuk)?saved.puanHuk:(rawH||null);
            const puanM=typeof saved.puanMuh==='number'&&Number.isFinite(saved.puanMuh)?saved.puanMuh:(rawM||null);
            const sure=m.sureEsitlik||{};
            const auto=otomatikSureleriDerle(m);
            const sureH=sure.hukSaniye??(auto.ogrenciler.huk.length?auto.toplam.huk:null);
            const sureM=sure.muhSaniye??(auto.ogrenciler.muh.length?auto.toplam.muh:null);
            const kazanan=saved.kazanan||'';
            const cift=saved.yontem==='cift_eleme';
            const sonucVar=!!kazanan||cift;
            const durum=cift?'İki okul elendi':sonucVar?'Kesinleşti':m.durum==='iptal'?'İptal':bekleyenPuan?'Eksik puan':votes.length?'Değerlendirme sürüyor':'Henüz puan yok';
            rows.push({id,m,roles:roleScores,names,puanH,puanM,sureH,sureM,kazanan,
                cift,sonucVar,durum,puanKayitSayisi:votes.length,resmi,saved});
        }
        return rows.sort((a,b)=>(Number(a.m.fiksturNo)||999999)-(Number(b.m.fiksturNo)||999999)||
            String(a.m.etiket||'').localeCompare(String(b.m.etiket||''),'tr'));
    }

    function raporTakimTablosuHtml(rows,imzali=false) {
        const nameCells=imzali?'<th>1. Jüri / Adı</th><th>2. Jüri / Adı</th><th>3. Jüri / Adı</th><th>1. İmza</th><th>2. İmza</th><th>3. İmza</th>':
            '<th>1. Jüri / Adı</th><th>2. Jüri / Adı</th><th>3. Jüri / Adı</th>';
        let html=`<table class="${imzali?'toplu-print-table':'tutanak-table takim-ekran-tablosu'}"><thead><tr>
            <th>No</th><th>Tarih</th><th>Hükümet Takımı</th><th>Muhalefet Takımı</th>
            <th>1. Jüri H/M</th><th>2. Jüri H/M</th><th>3. Jüri H/M</th>
            <th>H Puan</th><th>M Puan</th><th>Süre H/M</th><th>Kazanan / Sonuç</th>
            ${nameCells}</tr></thead><tbody>`;
        rows.forEach((r,i)=>{
            const data=r.roles.map(x=>x.hukKayit||x.muhKayit?`${x.hukKayit?x.huk:'—'} / ${x.muhKayit?x.muh:'—'}`:'—');
            const resmiNot=r.sonucVar?'':' <small>(kısmi)</small>';
            const sonuc=r.cift?'Galip yok – çift eleme':r.kazanan||r.durum;
            const tarih=r.m.fiksturTarih||'—';
            const sign=imzali?'<td class="imza-bos"></td><td class="imza-bos"></td><td class="imza-bos"></td>':'';
            html+=`<tr data-rapor-mac-id="${htmlEscape(r.id)}" class="${r.sonucVar?'kesin-sonuc':''}"><td>${htmlEscape(r.m.fiksturNo||i+1)}</td>
                <td>${htmlEscape(tarih)}</td><td>${htmlEscape(r.m.hukOkul)}</td><td>${htmlEscape(r.m.muhOkul)}</td>
                ${data.map(v=>`<td class="num-cell">${v}</td>`).join('')}
                <td class="num-cell"><b>${r.puanH??'—'}</b>${resmiNot}</td>
                <td class="num-cell"><b>${r.puanM??'—'}</b>${resmiNot}</td>
                <td class="num-cell">${r.sureH!=null?sureyiMetneDonustur(r.sureH):'—'} / ${r.sureM!=null?sureyiMetneDonustur(r.sureM):'—'}</td>
                <td><b>${htmlEscape(sonuc)}</b></td>
                ${r.names.map(n=>`<td>${htmlEscape(n.name)}${n.kaynak==='fikstur'?'<sup>*</sup>':''}</td>`).join('')}
                ${sign}</tr>`;
        });
        return html+(rows.length?'':'<tr><td colspan="17">Henüz karşılaşma bulunamadı.</td></tr>')+'</tbody></table>';
    }

    // Sonuç ekranı açıldığında veya gün filtresi değiştiğinde görünür tablodaki
    // aktif maça; yoksa bugünün sıradaki, gün bittiyse son maçına kendiliğinden gider.
    function raporSonucMacinaOtomatikOdaklan(rows){
        const root=document.getElementById('rapor-tablosu');
        if(!root||!Array.isArray(rows)||!rows.length)return;
        const simdi=Date.now();
        const bugun=raporYerelBugunAnahtari();
        const zamanli=rows.map(r=>({r,ar:puanlamaMacSaatAraliginiCoz(r.m)})).filter(x=>x.ar);
        const aktif=zamanli.filter(x=>x.ar.baslangic<=simdi && simdi<=x.ar.bitis);
        let hedef=aktif.length===1?aktif[0].r:null;
        if(!hedef && aktif.length>1){
            // Çakışan seans varsa rastgele seçme; listede ilk görünen maç kullanılabilir.
            hedef=aktif.sort((a,b)=>a.ar.baslangic-b.ar.baslangic)[0].r;
        }
        if(!hedef){
            const siradakiBugun=zamanli.filter(x=>x.ar.tarihKey===bugun && x.ar.baslangic>simdi && !['kapali','iptal'].includes(x.r.m?.durum))
                .sort((a,b)=>a.ar.baslangic-b.ar.baslangic);
            if(siradakiBugun.length)hedef=siradakiBugun[0].r;
        }
        if(!hedef){
            const gecmisBugun=zamanli.filter(x=>x.ar.tarihKey===bugun && x.ar.bitis<simdi)
                .sort((a,b)=>b.ar.baslangic-a.ar.baslangic);
            if(gecmisBugun.length)hedef=gecmisBugun[0].r;
        }
        if(!hedef){
            const siradaki=zamanli.filter(x=>x.ar.baslangic>simdi && !['kapali','iptal'].includes(x.r.m?.durum))
                .sort((a,b)=>a.ar.baslangic-b.ar.baslangic);
            if(siradaki.length)hedef=siradaki[0].r;
        }
        if(!hedef && zamanli.length){
            hedef=zamanli.slice().sort((a,b)=>b.ar.baslangic-a.ar.baslangic)[0].r;
        }
        if(!hedef)hedef=rows[0];
        const satir=[...root.querySelectorAll('tr[data-rapor-mac-id]')].find(el=>el.dataset.raporMacId===String(hedef.id));
        if(!satir)return;
        root.querySelectorAll('tr.rapor-otomatik-hedef').forEach(el=>el.classList.remove('rapor-otomatik-hedef'));
        satir.classList.add('rapor-otomatik-hedef');
        // DOM'un yerleşmesi için kısa gecikme; yönetici aşağı kaydırmak zorunda kalmaz.
        window.setTimeout(()=>{
            if(!satir.isConnected)return;
            satir.scrollIntoView({behavior:'smooth',block:'center',inline:'nearest'});
        },120);
    }

    function tutanakTablosuDoldur(){
        if(!adminYetkiliMi())return;
        const root=document.getElementById('rapor-tablosu');
        if(!root||!sonRaporVerisi)return;
        const secili=document.getElementById('gunFiltre')?.value||'hepsi';
        const rows=raporTakimVerisiniDerle().filter(x=>raporGunFiltresineUyar(x.m,secili));
        let html=`<h3 style="color:var(--text-main)">Takım Bazlı Puan ve Sonuç Özeti</h3>
            <div class="puanlama-bilgi">Her maç tek satırdır. Süreler takım toplamıdır. Jüri adı önce sistemdeki gerçek puan kaydından, yoksa resmî fikstür görevlendirmesinden alınır. Kesinleşmemiş skorlar resmî sonuç değildir.</div>`;

    function canliResmiMacSonucu(fiksturNo, kategori){

    async function yoneticiMaciniHazirla(kategori,macId){
        const ref=db.ref(`maclar/${kategori}/${macId}`);
        let f=yoneticiFiksturMaclari.find(x=>x.id===macId && x.kategori===kategori);
        let s=await ref.once('value');
        let mac=s.val();
        if((!mac||!mac.hukOkul||!mac.muhOkul||!String(mac.durum||'').trim())&&!f){
            // Liste henüz yüklenmemişse, yalnızca bu eksik kayıt için sabit fikstürü yeniden oku.
            try{
                const liste=await puanlamaFiksturMaclariniOku();
                const raw=liste.find(x=>x.cat===(kategori==='LİSE'?'lise':'ortaokul')&&
                    macKimligiOlustur(kategori,x.team1,x.team2)===macId&&puanlamaGecerliFiksturMaci(x));
                if(raw)f=puanlamaFiksturMacKaydi(raw);
            }catch(err){console.warn('Eksik maç alanları için fikstür yeniden okunamadı:',err);}
        }
        if(!mac){
            if(!f)throw new Error('Bu maçın resmî fikstür bilgisi bulunamadı. Fikstür ekranından kontrol edin.');
            await ensureMatchExists(kategori,f.hukOkul,f.muhOkul);
            s=await ref.once('value');
            mac=s.val();
        }
        if(!mac)throw new Error('Maç kaydı oluşturulamadı.');
        // Eski/eksik Firebase düğümlerinde yalnızca eksik metadata onarılır.
        // Puan, sayaç, toplam süre, sonuç ve mevcut diğer alanlar aynen korunur.
        const durumMetni=String(mac.durum||'').trim();
        const durumNorm=durumMetni.toLocaleLowerCase('tr-TR').replace(/ı/g,'i').replace(/ç/g,'c');
        const durumBilinen=['acik','open','kapali','closed','iptal','cancelled'].includes(durumNorm);
        const durumEksik=!durumMetni;
        const durumDuzeltmeGerekli=durumBilinen&&mac.durum!==(
            ['acik','open'].includes(durumNorm)?'acik':
            ['kapali','closed'].includes(durumNorm)?'kapali':'iptal');
        if((!mac.hukOkul||!mac.muhOkul||durumEksik||durumDuzeltmeGerekli) && f?.hukOkul && f?.muhOkul){
            const repaired=await ref.transaction(cur=>{
                if(!cur)return cur;
                const next={...cur};
                if(!next.hukOkul)next.hukOkul=f.hukOkul;
                if(!next.muhOkul)next.muhOkul=f.muhOkul;
                if(!next.id)next.id=macId;
                if(!next.kategori)next.kategori=kategori;
                if(!next.etiket)next.etiket=macEtiketi(f.hukOkul,f.muhOkul);
                if(!next.fiksturNo)next.fiksturNo=f.fiksturNo||null;
                const raw=String(next.durum||'').trim();
                const norm=raw.toLocaleLowerCase('tr-TR').replace(/ı/g,'i').replace(/ç/g,'c');
                if(!raw){
                    // Durum alanı boşsa, kapanış kanıtı bulunmayan maç açık kabul edilir.
                    // Kapanış işareti/sonucu varsa yanlışlıkla yeniden açma.
                    next.durum=(next.sonuc||next.closedAt)?'kapali':'acik';
                }else if(['acik','open'].includes(norm))next.durum='acik';
                else if(['kapali','closed'].includes(norm))next.durum='kapali';
                else if(['iptal','cancelled'].includes(norm))next.durum='iptal';
                return next;
            },undefined,false);
            mac=repaired.snapshot?.val()||mac;
        }
        if(!mac.hukOkul||!mac.muhOkul)
            throw new Error('Maç kaydında okul bilgisi eksik. Sabit fikstürden güvenli onarım yapılamadı; puan ve süre verileri korunuyor.');
        if(!String(mac.durum||'').trim())
            throw new Error('Maç kaydının durumu eksik ve güvenli biçimde onarılamadı; puan ve süreler korunuyor.');
        return mac;
    }

    function skorEslesmeAnahtari(ad) {
        return puanMetniNormalize(ad).replace(/\s+/g, ' ').toLocaleLowerCase('tr-TR');
    }

    function okulCiftiEslesiyor(a,b,c,d) {
        const aa=skorEslesmeAnahtari(a), bb=skorEslesmeAnahtari(b);
        const cc=skorEslesmeAnahtari(c), dd=skorEslesmeAnahtari(d);
        return !!aa && !!bb && ((aa===cc && bb===dd) || (aa===dd && bb===cc));
    }

    function sureyiMetneDonustur(saniye) {
        if (!Number.isFinite(Number(saniye)) || saniye === null || saniye === undefined) return '—';
        const n=Math.max(0,Math.floor(Number(saniye)));
        return `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`;
    }

    function sureMetniniCoz(metin) {
        const s=String(metin || '').trim();
        if (!/^\d{1,3}:[0-5]\d$/.test(s)) return null;
        const [dakika,saniye]=s.split(':').map(Number);
        const toplam=dakika*60+saniye;
        return Number.isSafeInteger(toplam) && toplam>0 && toplam<=359999 ? toplam : null;
    }

    // V3.10 - Oynanmış maçın öğrenci listesi kaynağı farklı adla kayıtlıysa
    // süreler için kayıtlı listeden veya BU MAÇIN mevcut jüri puanlarından güvenli kurtarma.
    // Yalnızca seçilen maça ait puanlar okunur; puanlar ve fikstür asla değiştirilmez.
    let sureKurtarmaBaglam=null;
    function surePuandanOgrenciListesi(snapshot,macId) {
        const sonuc={huk:[],muh:[]}, seen={huk:new Set(),muh:new Set()};
        if(!snapshot)return sonuc;
        snapshot.forEach(c=>{
            const v=c.val(), sec=v?.secim||{};
            if(!v||kayitMacId(v)!==macId)return;
            const taraf=sec.taraf==='HÜKÜMET'?'huk':sec.taraf==='MUHALEFET'?'muh':'';
            if(!taraf)return;
            const tam=puanMetniNormalize(sec.ogr);
            const ad=tam.replace(/\s*\((?:[1-9]\d*\.\s*Konuşmacı|Grup Sözcüsü)\)\s*$/iu,'').trim();
            const key=skorEslesmeAnahtari(ad);
            if(!key||seen[taraf].has(key))return;
            seen[taraf].add(key);
            const n=Number(tam.match(/\((\d+)\.\s*Konuşmacı\)/iu)?.[1]||999);
            sonuc[taraf].push({ad,sira:n});
        });
        for(const taraf of ['huk','muh'])sonuc[taraf].sort((a,b)=>a.sira-b.sira||a.ad.localeCompare(b.ad,'tr'));
        return {huk:sonuc.huk.map(x=>x.ad),muh:sonuc.muh.map(x=>x.ad)};
    }
    function sureKurtarmaBaslat(baglam){
        sureKurtarmaBaglam=baglam;
        const {kategori,mac,okullar,puandan}=baglam;
        const keys=Object.keys(okullar).filter(k=>okullar[k]?.length).sort((a,b)=>a.localeCompare(b,'tr'));
        const defaultKaynak={};
        for(const taraf of ['huk','muh']){
            const okul=taraf==='huk'?mac.hukOkul:mac.muhOkul;
            const kaynak=mac.ogrenciKaynaklari?.[taraf]||okul;
            const iki=keys.filter(k=>guvenliOkulAnahtari(k)===guvenliOkulAnahtari(kaynak));
            const dogrudan=keys.filter(k=>guvenliOkulAnahtari(k)===guvenliOkulAnahtari(okul));
            defaultKaynak[taraf]=iki.length===1?iki[0]:dogrudan.length===1?dogrudan[0]:'';
        }
        // En güvenilir kaynak: doğru okul adındaki kadro. Maçta jüri puanı varsa
        // otomatik seçim bu öğrencilerin tamamını kapsamalıdır.
        const kapsiyor=(taraf,kaynak)=>{
            const roster=okullar[kaynak]||[];
            const keys=new Set(roster.map(skorEslesmeAnahtari));
            return roster.length>0 && (puandan[taraf]||[]).every(ad=>keys.has(skorEslesmeAnahtari(ad)));
        };
        for(const taraf of ['huk','muh']){
            const okul=taraf==='huk'?mac.hukOkul:mac.muhOkul;
            const adayTam=keys.filter(k=>guvenliOkulAnahtari(k)===guvenliOkulAnahtari(okul));
            const tam=adayTam.length===1?adayTam[0]:'';
            if(tam && kapsiyor(taraf,tam)) defaultKaynak[taraf]=tam;
            else if(defaultKaynak[taraf] && !kapsiyor(taraf,defaultKaynak[taraf])) defaultKaynak[taraf]='';
            // Tam isim bulunmazsa, puanlanmış öğrencilerin tümünü içeren TEK kadroyu kullan.
            if(!defaultKaynak[taraf] && (puandan[taraf]||[]).length){
                const adaylar=keys.filter(k=>kapsiyor(taraf,k));
                if(adaylar.length===1) defaultKaynak[taraf]=adaylar[0];
            }
        }
        if(defaultKaynak.huk&&defaultKaynak.muh && defaultKaynak.huk!==defaultKaynak.muh){
            sureSureFormuGoster(baglam,{huk:okullar[defaultKaynak.huk],muh:okullar[defaultKaynak.muh]},defaultKaynak);

        const secici=taraf=>{

                <p class="sure-hint">${value?'Kayıtlı öğrenci listesi bulundu.':'Fikstürdeki adla eşleşen liste yok.'} Aşağıdan gerçekte yarışan okulun öğrenci listesini seçin.</p>
                <select id="sureKurtarma_${taraf}" aria-label="${htmlEscape(okul)} öğrenci kaynağı" onchange="sureKurtarmaOnizle()">
                <option value="">Öğrenci listesi seçin</option>${opts}
                ${scor?`<option value="__PUAN__">⭐ Bu maçta jüri puanı girilmiş ${scor} öğrenci</option>`:''}
                </select><div id="sureKurtarmaListe_${taraf}" class="sure-hint"></div></div>`;
        };
        const host=document.getElementById('sureModalHost');if(!host)return;
        host.innerHTML=`<div class="sure-modal-bg" role="dialog" aria-modal="true" aria-label="Öğrenci listesi kurtarma"><div class="sure-modal-card" style="width:min(950px,98vw)">
            <h2>⏱ Öğrenci Listesi Bulunamadı — Güvenli Süre Kurtarma</h2>
            <div class="puanlama-bilgi hata">Bu hata öğrencilerin silindiği anlamına gelmez. Resmî fikstürdeki okul adı ile Firebase'deki öğrenci listesinin adı farklı olabilir. Kategori: <b>${htmlEscape(kategori)}</b>.</div>
            <p class="sure-hint">Yalnızca yarışmış iki okulun <b>gerçek öğrenci listesini</b> seçin; seçeneklerin altındaki isimleri kontrol edin. İlgili okul kayıtları görünmüyorsa aynı maça kaydedilmiş jüri puanlarından öğrencileri seçebilirsiniz. Bu, puanları ve maç eşleşmesini değiştirmez. Jüri puanından getirilen liste eksikse süreleri kaydetmeden önce kontrol edin.</p>
            <div class="sure-student-grid">${secici('huk')}${secici('muh')}</div>
            <button class="btn" style="background:#0369a1" onclick="sureKurtarmayiUygula()">✓ Öğrenci Listelerini Doğrula ve Süreyi Aç</button>
            <button class="btn" onclick="sureModalKapat()">Kapat (Verileri Değiştirme)</button>
        </div></div>`;
        sureKurtarmaOnizle();
    }
    function sureKurtarmaOnizle(){

    function sureKurtarmayiUygula(){
