    <style>
        :root {
            --bg-main: #1e293b;
            --bg-card: #0f172a;
            --border-color: #334155;

            --success: #10b981;
            --accent: #facc15;

        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg-main); padding: 20px; color: var(--text-main); margin: 0; min-height: 100vh; position: relative; padding-bottom: 60px; box-sizing: border-box; }
        .card { background: var(--bg-card); padding: 30px; border-radius: 16px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.4); max-width: 850px; margin: 20px auto; border: 1px solid var(--border-color); }

        h3 { color: var(--text-muted); font-size: 18px; margin-top: 25px; }

        .btn { display: block; width: 100%; padding: 14px; margin: 8px 0; background: #1e293b; color: var(--text-main); border: 1px solid var(--border-color); border-radius: 10px; cursor: pointer; font-weight: bold; text-align: center; transition: all 0.2s ease; font-size: 15px; }
        .btn:hover { background: #334155; transform: translateY(-1px); }
        .btn-active { background: var(--success) !important; border-color: var(--success); box-shadow: 0 0 12px rgba(16, 185, 129, 0.4); }
        
        input, textarea, select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid var(--border-color); border-radius: 10px; box-sizing: border-box; background: #1e293b; color: var(--text-main); font-size: 15px; transition: border 0.2s; }
        input:focus, select:focus { border-color: var(--primary); outline: none; }
        
        .btn-grid { display: grid; gap: 8px; margin: 12px 0; }
        .kat-btn { background: #1e293b; border: 1px solid var(--border-color); color: var(--text-muted); }
        .kat-btn.btn-active { background: var(--primary) !important; border-color: var(--primary); box-shadow: 0 0 12px rgba(59, 130, 246, 0.4); }
        
        .kriter-card { background: #111827; padding: 18px; border-radius: 12px; margin-bottom: 12px; border: 1px solid var(--border-color); }
        .kriter-label { font-weight: 600; font-size: 14px; color: var(--text-main); display: block; }
        .puan-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
        .puan-btn { width: 38px; height: 38px; border: 1px solid var(--border-color); border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 14px; background: #1f2937; color: var(--text-muted); transition: all 0.15s; font-weight: bold; }
        .puan-btn:hover { color: #fff; border-color: #64748b; }
        .puan-btn.selected { background: var(--success); color: white; border-color: var(--success); box-shadow: 0 0 10px rgba(16,185,129,0.4); }

        .tutanak-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 20px; border-radius: 8px; overflow: hidden; }
        .tutanak-table th { background: #111827; color: var(--text-muted); padding: 12px; border: 1px solid var(--border-color); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .tutanak-table td { padding: 12px; border: 1px solid var(--border-color); text-align: center; background: #161e2e; }
        .tutanak-table tr:nth-child(even) td { background: #111827; }

        .report-summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .admin-summary-grid { display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:10px; margin:14px 0 18px; }
        .admin-metric { background:#111827; border:1px solid var(--border-color); border-radius:10px; padding:12px; text-align:center; }
        .admin-metric strong { display:block; font-size:22px; color:var(--accent); margin-top:3px; }

        .jury-ok { color:#34d399; font-weight:700; }
        .jury-missing { color:#fbbf24; font-weight:700; }
        .mvp-box { background: linear-gradient(135deg, #1e1b4b, #311042); border: 1px solid #4c1d95; padding: 15px; border-radius: 12px; text-align: center; }
        .school-total-box { background: linear-gradient(135deg, #064e3b, #022c22); border: 1px solid #065f46; padding: 15px; border-radius: 12px; text-align: center; }

        .summary-name { font-weight: bold; color: var(--text-main); }
        .summary-score { font-weight: 800; color: var(--accent); }

        .match-box { border: 1px solid var(--border-color); padding: 18px; margin: 10px; border-radius: 12px; width: 250px; display: inline-block; vertical-align: top; text-align: left; background: #111827; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); }

        .win-tag { margin-top: 12px; padding: 8px; background: rgba(16, 185, 129, 0.15); color: #34d399; border-radius: 6px; font-weight: bold; font-size: 12px; text-align: center; border: 1px solid rgba(16, 185, 129, 0.3); }
        .old-tur { margin-top: 25px; border-top: 2px dashed var(--border-color); padding-top: 15px; }
        .champ-card { background: linear-gradient(135deg, #fef08a, #facc15); border: none; padding: 30px; border-radius: 14px; text-align: center; font-size: 26px; font-weight: 800; color: #713f12; margin: 25px 0; box-shadow: 0 10px 20px rgba(250,204,21,0.3); animation: pulse 2s infinite; }
        
        .file-upload-wrapper { border: 2px dashed var(--border-color); padding: 20px; border-radius: 10px; text-align: center; background: #111827; margin: 15px 0; }
        
        .arge-footer { position: absolute; bottom: 15px; left: 0; width: 100%; text-align: center; font-size: 12px; color: var(--text-muted); opacity: 0.7; letter-spacing: 0.5px; }
        .about-team-list { text-align: left; background: #111827; padding: 20px; border-radius: 12px; border: 1px solid var(--border-color); margin: 20px 0; }
        .about-team-item { padding: 8px 12px; border-bottom: 1px solid rgba(255,255,255,0.05); font-weight: bold; color: var(--text-main); display: flex; align-items: center; gap: 10px; }
        .about-team-item:last-child { border-bottom: none; }

        @media (max-width:700px) { .admin-summary-grid { grid-template-columns:1fr 1fr; } }

<body>

<div id="app"></div>

<div class="arge-footer">
    © 2026 Iğdır Millî Eğitim Müdürlüğü — Tüm Hakları Saklıdır.
</div>

<script>
    const APP_VERSION = '3.30 · Jüri Bağımsız Puanlama ve Veri Kurtarma';
    const krit = [
        {t:"Argüman Mantıklı ve Tutarlı mı?", m:5}, {t:"Argümanlar Örneklerle Destekleniyor mu?", m:5}, {t:"Argümanın Güncel ve Bilimsel Verilere Dayanıyor mu?", m:5},
        {t:"Ses Tonu ve Vurgu", m:10}, {t:"Jest ve Mimiklerin Etkin Kullanımı", m:10}, {t:"Göz Teması ve Konuşma Hızı", m:5},
        {t:"Materyal Kullanımı", m:5}, {t:"Karşıt Görüşe Cevap Verebilme", m:10}, {t:"Saygılı ve Etkin Üslup Kullanımı", m:10},
        {t:"Tartışmanın Farklı ve Derin Bir Biçimde Ele Alınması", m:10}, {t:"Konuşma Süresini Etkin Kullanabiliyor mu?", m:10},
        {t:"Konuşma İyi Planlanmış mı?", m:10}, {t:"Konuşma Esnasında Konu Bütünlüğü Sağlanıyor mu?", m:5}
    ];

    const BEKLENEN_JURILER = ['1. Jüri', '2. Jüri', '3. Jüri'];
    const kSifre = "MTk5Mg==";
    const JURI_OTURUM_KEY = 'munazaraJuriOturumuV3';
    const OFFLINE_QUEUE_KEY = 'munazaraOfflineQueueV3';
    const CLIENT_ID_KEY = 'munazaraClientIdV1';
    const TURN_CACHE_PREFIX = 'turnuvaCacheV3_';

    let aktifMacSecimleri = JSON.parse(localStorage.getItem('aktifMacSecimleri')) || {
        kategori: 'ORTAOKUL', hukOkul: '', muhOkul: '', taraf: '', juri: '', juriAd: '', ogr: '', okul: '', macId: ''
    };
    let secimler = { ...aktifMacSecimleri };
    let verilenPuanlar = {};
    let puanGonderiliyor = false;
    let sonRaporVerisi = null;
    let firebaseBagli = false;
    let aktifJuriListenerRef = null;
    let aktifJuriMacListenerRef = null;
    let aktifCanliPanelRefs = [];
    let aktifTurnuvaRef = null;

    function puanMetniNormalize(v) {
        return String(v ?? '').normalize('NFC').trim();
    }

    function htmlEscape(v) {
        return String(v ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    }

    function hash32(str, seed=2166136261) {
        let h = seed >>> 0;
        for (let i = 0; i < str.length; i++) {
            h ^= str.charCodeAt(i);
            h = Math.imul(h, 16777619);
        }
        return (h >>> 0).toString(16).padStart(8, '0');
    }

    function getClientId() {
        let id = localStorage.getItem(CLIENT_ID_KEY);
        if (!id) {
            id = 'c_' + hash32(String(Date.now()) + '|' + Math.random(), 2166136261) + hash32(navigator.userAgent || '', 3339675911);
            localStorage.setItem(CLIENT_ID_KEY, id);
        }
        return id;
    }

    function macEtiketi(hukOkul, muhOkul) {
        return `${puanMetniNormalize(hukOkul)} VS ${puanMetniNormalize(muhOkul)}`;
    }

    function macKimligiOlustur(kategori, hukOkul, muhOkul) {
        const temel = [kategori, hukOkul, muhOkul].map(puanMetniNormalize).join('|').toLocaleLowerCase('tr-TR');
        return 'm_' + hash32(temel, 2166136261) + hash32(temel, 3339675911);
    }

    function macEskiEtiketi(hukOkul, muhOkul) {
        return `${hukOkul}-vs-${muhOkul}`;
    }

    function kayitMacId(v) {
        if (v?.macId) return v.macId;
        const s = v?.secim || {};
        if (s.hukOkul && s.muhOkul) return macKimligiOlustur(s.kategori || v.kategori || '', s.hukOkul, s.muhOkul);
        if (v?.mac) return 'legacy_' + hash32(String(v.mac).toLocaleLowerCase('tr-TR'));
        return 'legacy_genel';
    }

    function kayitMacEtiketi(v) {
        if (v?.macEtiketi) return v.macEtiketi;
        const s = v?.secim || {};
        if (s.hukOkul && s.muhOkul) return macEtiketi(s.hukOkul, s.muhOkul);
        return String(v?.mac || 'Genel').replace('-vs-', ' VS ');
    }

    function puanKayitKimligi(secimObj, macId) {
        const s = secimObj || {};
        const temel = [
            s.kategori, macId, s.okul, s.ogr, s.juri, s.taraf
        ].map(puanMetniNormalize).join('|').toLocaleLowerCase('tr-TR');
        return 'p_' + hash32(temel, 2166136261) + hash32(temel, 3339675911);
    }

    // Eski rastgele anahtarlı mükerrer puan kayıtları yalnızca ana puan başarıyla
    // kaydedildikten sonra arka planda temizlenir; bu işlem başka jüri kayıtlarını etkilemez.
    function eskiJuriPuanMukerrerleriniTemizle(kategori,kayitId,kanonikAnahtar){
        void db.ref(`puanlar/${kategori}`).once('value').then(snapshot=>{
            const silinecek=[];
            snapshot.forEach(c=>{
                if(c.key===kanonikAnahtar)return;
                const v=c.val();
                if(!v||!v.secim||!v.puanlar)return;
                if(puanKayitKimligi(v.secim,kayitMacId(v))===kayitId)
                    silinecek.push(db.ref(`puanlar/${kategori}/${c.key}`).remove());
            });
            return Promise.allSettled(silinecek);
        }).catch(err=>console.warn('Eski mükerrer puanları arka planda temizleme başarısız:',err));
    }

    function puanToplami(v) {
        const p = (v && v.puanlar) || {};
        return krit.reduce((toplam, _k, i) => toplam + Number(p[i] ?? p[String(i)] ?? 0), 0);
    }

    function snapshotKayitlariniTekillestir(snapshot) {
        const map = new Map();
        if (!snapshot) return [];
        snapshot.forEach(c => {
            const v = c.val();
            if (!v || !v.secim || !v.puanlar) return;
            const mid = kayitMacId(v);
            const dogalId = puanKayitKimligi(v.secim, mid);
            map.set(dogalId, { ...v, macId: mid, macEtiketi: kayitMacEtiketi(v), _firebaseKey: c.key, _dogalId: dogalId });
        });
        return Array.from(map.values());
    }

    function ogrenciGrupKimligi(v) {
        const s = v.secim || {};
        return [kayitMacId(v), s.okul || '', (s.ogr || '').split(' (')[0]].map(puanMetniNormalize).join('|');
    }

    function secimleriKaydet() {
        localStorage.setItem('aktifMacSecimleri', JSON.stringify(secimler));
    }

    // Puan taslakları jüri koltuğu + öğrenci bazında ayrıdır; her seçim önce cihazda,
    // bağlantı varsa ayrıca Firebase'de saklanır. Resmî puan kaydı oluşmadan silinmez.
    const PUAN_TASLAK_KEY_PREFIX='munazaraPuanTaslakV1_';
    let aktifPuanTaslak=null;
    function puanTaslakBaglamiOlustur(mac,oturum){
        const secim={...secimler,macId:mac.id,juri:oturum.juri,juriAd:oturum.ad};
        const kayitId=puanKayitKimligi(secim,mac.id);
        return {
            kategori:secimler.kategori,macId:mac.id,kayitId,secim,
            localKey:PUAN_TASLAK_KEY_PREFIX+secimler.kategori+'_'+mac.id+'_'+kayitId,
            cloudPath:`puanTaslaklari/${secimler.kategori}/${mac.id}/${kayitId}`
        };
    }
    function puanTaslakVerisiOlustur(ctx){
        return {secim:ctx.secim,macId:ctx.macId,puanlar:{...verilenPuanlar},
            clientId:getClientId(),localUpdatedAt:Date.now(),durum:'taslak'};
    }
    function puanTaslaginiKaydet(){
        const ctx=aktifPuanTaslak;if(!ctx)return;
        const veri=puanTaslakVerisiOlustur(ctx);
        try{localStorage.setItem(ctx.localKey,JSON.stringify(veri));}
        catch(err){console.warn('Puan taslağı cihazda saklanamadı:',err);}
        const durum=document.getElementById('puanTaslakDurumu');
        if(durum)durum.textContent='Taslak cihazda kaydedildi; Firebase yedeği kontrol ediliyor…';
        if(navigator.onLine&&firebaseBagli){
            db.ref(ctx.cloudPath).transaction(cur=>{
                const tamamlandiAt=Number(cur?.tamamlandiAt||0);
                if(cur?.durum==='gonderildi'&&tamamlandiAt>=Number(veri.localUpdatedAt||0))return cur;
                if(Number(cur?.localUpdatedAt||0)>Number(veri.localUpdatedAt||0))return cur;
                return {...veri,updatedAt:firebase.database.ServerValue.TIMESTAMP};
            },undefined,false).then(result=>{
                if(aktifPuanTaslak===ctx&&document.getElementById('puanTaslakDurumu'))
                    document.getElementById('puanTaslakDurumu').textContent=result.committed
                        ?'✓ Taslak cihazda ve Firebase’de otomatik kaydedildi.':'✓ Daha yeni bir taslak veya gönderim kaydı korundu.';
            }).catch(err=>{
                console.warn('Firebase puan taslağı yedeklenemedi:',err);
                if(aktifPuanTaslak===ctx&&document.getElementById('puanTaslakDurumu'))
                    document.getElementById('puanTaslakDurumu').textContent='⚠ Taslak bu cihazda saklandı; Firebase yedeği yazılamadı.';
            });
        }else if(durum)durum.textContent='⚠ Taslak bu cihazda saklandı; bağlantı gelince bulut yedeği alınacak.';
    }
    async function puanTaslaginiGeriYukle(ctx){
        if(!ctx)return;
        let veri=null,kaynak='cihaz';
        try{veri=JSON.parse(localStorage.getItem(ctx.localKey)||'null');}catch(_){}
        if(navigator.onLine&&firebaseBagli){
            try{
                const snap=await db.ref(ctx.cloudPath).once('value');
                const bulut=snap.val();
                const yerelAt=Number(veri?.localUpdatedAt||0);
                if(bulut?.durum==='gonderildi'&&Number(bulut.tamamlandiAt||0)>=yerelAt){
                    try{localStorage.removeItem(ctx.localKey);}catch(_){}
                    veri=null;
                }else if(bulut&&bulut.puanlar&&(!veri||Number(bulut.localUpdatedAt||0)>=yerelAt)){
                    veri=bulut;kaynak='Firebase';
                }
            }catch(err){console.warn('Bulut puan taslağı okunamadı:',err);}
        }
        if(aktifPuanTaslak!==ctx||!document.getElementById('kriterListesi'))return;
        if(Object.keys(verilenPuanlar||{}).length)return; // Okuma sürerken yapılan yeni seçimleri ezme.
        const restored={};
        for(let i=0;i<krit.length;i++){
            const p=Number(veri?.puanlar?.[i]??veri?.puanlar?.[String(i)]);
            if(Number.isInteger(p)&&p>=1&&p<=krit[i].m)restored[i]=p;
        }
        if(!Object.keys(restored).length){
            const d=document.getElementById('puanTaslakDurumu');
            if(d)d.textContent='Taslak yedekleme hazır: her kriter seçimi otomatik saklanır.';
            return;
        }
        verilenPuanlar=restored;
        document.querySelectorAll('#kriterListesi .kriter-card').forEach((kart,i)=>{
            const secili=restored[i];
            if(!secili)return;
            kart.querySelectorAll('.puan-btn').forEach(btn=>{
                if(Number(btn.textContent.trim())===secili)btn.classList.add('selected');
            });
        });
        try{localStorage.setItem(ctx.localKey,JSON.stringify(veri));}catch(_){}
        const d=document.getElementById('puanTaslakDurumu');
        if(d)d.textContent=`↩ ${Object.keys(restored).length}/13 kriter ${kaynak} yedeğinden geri yüklendi.`;
    }
    async function puanTaslaginiSil(ctx){
        if(!ctx)return;
        try{localStorage.removeItem(ctx.localKey);}catch(_){}
        if(navigator.onLine&&firebaseBagli){
            try{
                await db.ref(ctx.cloudPath).transaction(cur=>{
                    if(!cur)return cur;
                    if(cur.durum==='gonderildi')return cur;
                    const now=Date.now();
                    return {...cur,durum:'gonderildi',tamamlandiAt:now,
                        tamamlananLocalUpdatedAt:Number(cur.localUpdatedAt||0)};
                },undefined,false);
            }catch(err){console.warn('Tamamlanan puan taslağı bulutta işaretlenemedi:',err);}
        }
    }

    function LogSifre(metin) {
        return btoa(metin);
    }

    function adminSifreDogrula(mesaj='Yetkili şifresini giriniz:') {
        const girdi = prompt(mesaj);
        if (girdi === null) return false;
        if (LogSifre(girdi.trim()) !== kSifre) {
            alert('Hatalı şifre! Erişim reddedildi.');
            return false;
        }
        sessionStorage.setItem('adminGiris', 'onayli');
        return true;
    }

    function adminYetkiliMi() {
        return sessionStorage.getItem('adminGiris') === 'onayli';
    }

    function juriOturumuGetir() {
        try { return JSON.parse(localStorage.getItem(JURI_OTURUM_KEY) || 'null'); } catch (_) { return null; }
    }

    async function juriOturumuKilitle(juri, ad) {
        const mac = puanlamaMaclar.get(secimler.macId);
        const baglam = juriSecimBaglami(mac);
        if (!baglam) return alert('Önce tarihi belli bir maç seçin. Günün jüri isimleri maç seçildikten sonra gösterilir.');
        const rolAnahtari = ({'1. Jüri':'asil1','2. Jüri':'asil2','3. Jüri':'asil3'})[juri];
        const temizAd = puanMetniNormalize(ad);
        if (!rolAnahtari || !temizAd) return alert('Günün üç asıl jüri listesinden kendi adınızı seçin.');
        // Asıl jüri girişinde yalnızca aynı gün/kategori için resmî görevlendirilen isim kabul edilir.
        try {
            const snap = await db.ref(`fikstur/tekSalon_2026_2027/juries/${baglam.gunKey}/${baglam.kategori}`).once('value');
            const gorevli = snap.val() || {};
            const resmiAd = puanMetniNormalize(gorevli[rolAnahtari]?.name || '');
            if (!resmiAd || resmiAd !== temizAd) {
                alert('Günün jüri görevlendirmesi değişmiş veya okunamamış. Güncel isimler yeniden yüklenecek; listeden tekrar seçin.');
                void juriPaneliniGuncelle(mac);
                return;
            }
        } catch (err) {
            alert('Günün jüri görevlendirmesi doğrulanamadı. İnternet bağlantısını kontrol edip tekrar deneyin.');
            return;
        }
        const oturum = { juri, ad: temizAd, yedekMi:false, gunKey: baglam.gunKey, gunLabel: baglam.gunLabel,
            kategori: baglam.kategori, lockedAt: Date.now(), clientId: getClientId() };
        localStorage.setItem(JURI_OTURUM_KEY, JSON.stringify(oturum));
        secimler.juri = juri;
        secimler.juriAd = temizAd;
        secimleriKaydet();
        renderPuanlamaSecim();
        if(typeof sonucDuyuruGoster==='function')sonucDuyuruGoster();
    }

    // Yedek jüri adı ilk ekranda listelenmez. Yalnızca kullanıcı değişim düğmesine
    // bastıktan sonra yedek bilgisi gösterilir ve yerine geçeceği jüri koltuğu seçilir.
    async function yedekJuriOturumuAc(juri) {
        const mac = puanlamaMaclar.get(secimler.macId);
        const baglam = juriSecimBaglami(mac);
        const rolAnahtari = ({'1. Jüri':'asil1','2. Jüri':'asil2','3. Jüri':'asil3'})[juri];
        if (!baglam) return alert('Önce tarihi belli bir maç seçin.');
        if (!rolAnahtari) return alert('Geçerli bir jüri koltuğu seçin.');
        let yedekAd = '', asilAd = '';
        try {
            const snap = await db.ref(`fikstur/tekSalon_2026_2027/juries/${baglam.gunKey}/${baglam.kategori}`).once('value');
            const roster = snap.val() || {};
            yedekAd = puanMetniNormalize(roster.yedek?.name || '');
            asilAd = puanMetniNormalize(roster[rolAnahtari]?.name || '');
        } catch (err) {
            return alert('Yedek jüri görevlendirmesi doğrulanamadı. İnternet bağlantısını kontrol edip tekrar deneyin.');
        }
        if (!yedekAd || /^(protokol|belirlenecek|[-—]+)$/i.test(yedekAd))
            return alert('Bu gün ve kategori için kullanılabilir bir yedek jüri görevlendirmesi bulunamadı.');
        const soru = `${yedekAd}, ${juri} (${asilAd || 'asıl jüri'}) koltuğunun yerine görevlendirilecek.\n\nBu değişikliği bu cihazdaki jüri oturumu için uygulayalım mı?`;
        if (!confirm(soru)) return;
        // Puan kaydında 1./2./3. jüri rolü korunur; yedek kişi seçilen koltuğa vekâleten puan girer.
        const oturum = {
            juri, ad: yedekAd, yedekMi:true, yedekYerine:juri, asilinAdi:asilAd,
            gunKey:baglam.gunKey, gunLabel:baglam.gunLabel, kategori:baglam.kategori,
            lockedAt:Date.now(), clientId:getClientId()
        };
        localStorage.setItem(JURI_OTURUM_KEY, JSON.stringify(oturum));
        secimler.juri = juri;
        secimler.juriAd = yedekAd;
        secimleriKaydet();
        renderPuanlamaSecim();
        if(typeof sonucDuyuruGoster==='function')sonucDuyuruGoster();
    }

    async function yedekJuriDegisimPaneliniAc() {
        const panel = document.getElementById('juriOturumPanel');
        if (!panel) return;
        const onceki = document.getElementById('yedekJuriDegisimAlan');
        if (onceki) { onceki.remove(); return; }
        const mac = puanlamaMaclar.get(secimler.macId);
        const baglam = juriSecimBaglami(mac);
        if (!baglam) return alert('Önce tarihi belli bir maç seçin. Yedek jüri o gün ve kategoriye göre getirilir.');

        const alan = document.createElement('div');
        alan.id = 'yedekJuriDegisimAlan';
        alan.style.cssText = 'margin-top:14px;padding:14px;background:#111c31;border:1px solid #a16207;border-radius:10px;';
        alan.innerHTML = '<div style="font-size:13px;font-weight:800;color:#fcd34d;margin-bottom:6px;">Yedek jüriyle değiştir</div>' +
            '<div style="font-size:12px;color:#cbd5e1;line-height:1.5;margin-bottom:10px;">Yedek jüri yalnızca seçtiğiniz asıl jüri koltuğunun yerine geçer. Normal jüri listesine eklenmez.</div>' +
            '<div id="yedekJuriBilgi" style="font-size:13px;color:#f8fafc;">Günün yedek jüri görevlendirmesi yükleniyor…</div>';
        panel.appendChild(alan);
        try {
            const snap = await db.ref(`fikstur/tekSalon_2026_2027/juries/${baglam.gunKey}/${baglam.kategori}`).once('value');
            if (!document.getElementById('yedekJuriDegisimAlan')) return;
            const roster = snap.val() || {};
            const yedek = roster.yedek || {};
            const yedekAd = puanMetniNormalize(yedek.name || '');
            const bilgi = document.getElementById('yedekJuriBilgi');
            if (!yedekAd || /^(protokol|belirlenecek|[-—]+)$/i.test(yedekAd)) {
                bilgi.textContent = 'Bu gün ve kategori için kullanılabilir bir yedek jüri görevlendirmesi yok.';
                bilgi.style.color = '#fed7aa';
                return;
            }
            bilgi.textContent = `${yedekAd}${yedek.school && yedek.school !== '-' ? ' · '+yedek.school : ''}`;
            const etiket = document.createElement('label');
            etiket.htmlFor = 'yedekJuriKoltukSec';
            etiket.style.cssText = 'display:block;margin-top:12px;font-size:12px;color:#cbd5e1;';
            etiket.textContent = 'Hangi jüri koltuğunun yerine geçecek?';
            const select = document.createElement('select');
            select.id = 'yedekJuriKoltukSec';
            select.style.marginTop = '5px';
            const roller = [['1. Jüri','asil1'],['2. Jüri','asil2'],['3. Jüri','asil3']];
            const oturum = juriOturumuGetir();
            for (const [rol, anahtar] of roller) {
                const kisi = roster[anahtar] || {};
                const isim = puanMetniNormalize(kisi.name || '');
                const opt = document.createElement('option');
                opt.value = rol;
                opt.textContent = `${rol}${isim && !/^(protokol|belirlenecek|[-—]+)$/i.test(isim) ? ' · '+isim : ''}`;
                if (oturum && oturum.juri === rol) opt.selected = true;
                select.appendChild(opt);
            }
            const uygula = document.createElement('button');
            uygula.className = 'btn';
            uygula.style.cssText = 'margin:10px 0 0;background:#92400e;border-color:#b45309;';
            uygula.textContent = 'Bu yedek jüriyle değiştir';
            uygula.onclick = () => { void yedekJuriOturumuAc(select.value); };
            alan.append(etiket, select, uygula);

    function offlineKuyrukGetir() {
        try { return JSON.parse(localStorage.getItem(OFFLINE_QUEUE_KEY) || '{}') || {}; } catch (_) { return {}; }
    }

    function offlineKuyrukKaydet(q) {
        localStorage.setItem(OFFLINE_QUEUE_KEY, JSON.stringify(q));
        networkDurumunuGuncelle();
    }

    function puaniKuyrugaEkle(item) {
        const q = offlineKuyrukGetir();
        const key = `${item.kategori}__${item.kayitId}`;
        q[key] = { ...item, queuedAt: Date.now(), queueStatus: 'bekliyor' };
        offlineKuyrukKaydet(q);
    }

    async function offlineKuyruguGonder() {
        if (!navigator.onLine || !firebaseBagli) return;
        const q = offlineKuyrukGetir();
        const keys = Object.keys(q);
        if (!keys.length) return;
        let degisti = false;
        for (const key of keys) {
            const item = q[key];
            try {
                const mSnap = await db.ref(`maclar/${item.kategori}/${item.macId}`).once('value');
                const m = mSnap.val();
                if (m && ['kapali','iptal'].includes(m.durum)) {
                    q[key].queueStatus = m.durum==='iptal'?'mac_iptal':'mac_kapali';
                    degisti = true;
                    continue;
                }
                const rec = { ...item.kayit, serverSyncedAt: firebase.database.ServerValue.TIMESTAMP, offlineSynced: true };
                await db.ref(`puanlar/${item.kategori}/${item.kayitId}`).set(rec);
                if(item.taslakYolu)await db.ref(item.taslakYolu).transaction(cur=>{
                    if(!cur)return cur;
                    if(cur.durum==='gonderildi')return cur;
                    const now=Date.now();
                    return {...cur,durum:'gonderildi',tamamlandiAt:now,
                        tamamlananLocalUpdatedAt:Number(cur.localUpdatedAt||0),offlineSenkron:true};
                },undefined,false).catch(e=>console.warn('Senkronize taslak kapatılamadı:',e));
                if(item.taslakYerelAnahtari)try{localStorage.removeItem(item.taslakYerelAnahtari);}catch(_){}
                // Puan kuyruğunu senkronize etmek ortak konuşma sayacını KAPATMAZ.
                delete q[key];
                degisti = true;
            } catch (err) {
                console.warn('Offline kuyruk gönderilemedi:', err);
                const code = String(err?.code || '').toLowerCase();
                if (code.includes('permission')) q[key].queueStatus = 'yetki_hatasi';
                else q[key].queueStatus = 'bekliyor';
                degisti = true;
                break;
            }
        }
        if (degisti) offlineKuyrukKaydet(q);
    }

    function networkDurumunuGuncelle() {
        let el = document.getElementById('systemStatusBadge');
        if (!el) {
            el = document.createElement('div');
            el.id = 'systemStatusBadge';
            el.className = 'system-status';
            document.body.appendChild(el);
        }
        const q = offlineKuyrukGetir();
        const n = Object.keys(q).length;
        const online = navigator.onLine && firebaseBagli;
        el.innerHTML = `<span class="status-dot ${online?'online':'offline'}"></span>${online?'Çevrimiçi':'Çevrimdışı'}${n?` · Kuyruk: ${n}`:''}`;
        el.title = n ? 'Gönderilmeyi bekleyen yerel puan kaydı var.' : 'Tüm puanlar senkron.';
    }

    async function ensureMatchExists(kategori, hukOkul, muhOkul) {
        if (!hukOkul || !muhOkul) return null;
        const id = macKimligiOlustur(kategori, hukOkul, muhOkul);
        const ref = db.ref(`maclar/${kategori}/${id}`);
        await ref.transaction(cur => {
            if (cur) return cur; // Mevcut maç ve kesinleşmiş sonuç asla üzerine yazılmaz.
            return { id, kategori, hukOkul, muhOkul, etiket: macEtiketi(hukOkul, muhOkul), durum: 'acik', createdAt: Date.now(), updatedAt: Date.now(), version: 1 };
        });
        return id;
    }

    async function veriYedekleriniHazirla(kategori){
        const [pSnap,mSnap,pBakSnap,tBakSnap,sBakSnap]=await Promise.all([
            db.ref('puanlar/'+kategori).once('value'),
            db.ref('maclar/'+kategori).once('value'),
            db.ref('arsiv/juriPuanYedekleri/'+kategori).once('value'),
            db.ref('arsiv/konusmaSureYedekleri/'+kategori).once('value'),
            db.ref('arsiv/macSureYedekleri/'+kategori).once('value')
        ]);
        const pBak=pBakSnap.val()||{},tBak=tBakSnap.val()||{},sBak=sBakSnap.val()||{};
        const liveScores={},liveMatches={};
        pSnap.forEach(c=>{
            const v=c.val();if(!v?.secim||!v?.puanlar)return;
            const mid=kayitMacId(v),natural=puanKayitKimligi(v.secim,mid);
            if(!liveScores[mid])liveScores[mid]={};
            liveScores[mid][natural]=v;
        });
        mSnap.forEach(c=>liveMatches[c.key]=c.val());
        const updates={};let seedScore=0,seedTimer=0,seedSummary=0;
        for(const [mid,rows] of Object.entries(liveScores)){
            for(const [natural,v] of Object.entries(rows)){
                if(pBak[mid]?.[natural]?.sonDurum)continue;
                const base=`arsiv/juriPuanYedekleri/${kategori}/${mid}/${natural}`;
                const y={...v,macId:mid,yedekClientAt:Date.now(),yedekOlayi:'mevcut_kayit_koruma'};
                updates[base+'/sonDurum']=y;
                updates[base+'/gecmis/'+String(Date.now()+seedScore)]=y;seedScore++;
            }
        }
        for(const [mid,m] of Object.entries(liveMatches)){
            for(const [timerId,v] of Object.entries(m?.konusmaSayaclari||{})){
                if(tBak[mid]?.[timerId]?.sonDurum)continue;
                const base=`arsiv/konusmaSureYedekleri/${kategori}/${mid}/${timerId}`;
                const y={...v,macMeta:{id:mid,kategori,hukOkul:m.hukOkul||'',muhOkul:m.muhOkul||'',
                    etiket:m.etiket||'',durum:m.durum||'acik',fiksturNo:m.fiksturNo||null,
                    ogrenciKaynaklari:m.ogrenciKaynaklari||null},
                    yedekClientAt:Date.now(),yedekOlayi:'mevcut_sayac_koruma'};
                updates[base+'/sonDurum']=y;
                updates[base+'/gecmis/'+String(Date.now()+seedTimer)]=y;seedTimer++;
            }
            if(m?.sureEsitlik&&!sBak[mid]?.sonDurum){
                const base=`arsiv/macSureYedekleri/${kategori}/${mid}`;
                const y={...m.sureEsitlik,yedekClientAt:Date.now(),yedekOlayi:'mevcut_mac_suresi_koruma'};
                updates[base+'/sonDurum']=y;
                updates[base+'/gecmis/'+String(Date.now()+seedSummary)]=y;seedSummary++;
            }
        }
        if(Object.keys(updates).length)await db.ref().update(updates);
        const scoreArchive={...pBak},timerArchive={...tBak},summaryArchive={...sBak};
        for(const [path,value] of Object.entries(updates)){
            const parts=path.split('/');
            if(parts[1]==='juriPuanYedekleri'){
                const mid=parts[3],natural=parts[4];
                if(parts[5]==='sonDurum'){
                    scoreArchive[mid]=scoreArchive[mid]||{};scoreArchive[mid][natural]=scoreArchive[mid][natural]||{};
                    scoreArchive[mid][natural].sonDurum=value;
                }
            }else if(parts[1]==='konusmaSureYedekleri'){
                const mid=parts[3],id=parts[4];
                if(parts[5]==='sonDurum'){
                    timerArchive[mid]=timerArchive[mid]||{};timerArchive[mid][id]=timerArchive[mid][id]||{};
                    timerArchive[mid][id].sonDurum=value;
                }
            }else if(parts[1]==='macSureYedekleri'&&parts[4]==='sonDurum'){
                const mid=parts[3];summaryArchive[mid]=summaryArchive[mid]||{};summaryArchive[mid].sonDurum=value;
            }
        }
        const macIds=new Set([...Object.keys(liveScores),...Object.keys(liveMatches),
            ...Object.keys(scoreArchive),...Object.keys(timerArchive),...Object.keys(summaryArchive)]);
        const rows=[];
        for(const mid of macIds){
            const scores=Object.entries(scoreArchive[mid]||{}).filter(([_,x])=>x?.sonDurum?.secim&&x?.sonDurum?.puanlar);
            const live=liveScores[mid]||{};
            const missingScores=scores.filter(([id])=>!live[id]).length;
            const timers=Object.entries(timerArchive[mid]||{}).filter(([_,x])=>x?.sonDurum?.baslangicAt);
            const currentTimers=liveMatches[mid]?.konusmaSayaclari||{};
            const missingTimers=timers.filter(([id])=>!currentTimers[id]).length;
            const summary=summaryArchive[mid]?.sonDurum||null;
            const missingSummary=!!(summary&&!liveMatches[mid]?.sureEsitlik);
            const sample=scores[0]?.[1]?.sonDurum?.secim||{};
            const meta=timers[0]?.[1]?.sonDurum?.macMeta||{};
            rows.push({kategori,macId:mid,etiket:liveMatches[mid]?.etiket||meta.etiket||
                (sample.hukOkul&&sample.muhOkul?macEtiketi(sample.hukOkul,sample.muhOkul):mid),
                scoreCount:scores.length,missingScores,timerCount:timers.length,missingTimers,
                missingSummary,hasBackups:scores.length+timers.length+(summary?1:0)>0});
        }
        rows.sort((a,b)=>a.etiket.localeCompare(b.etiket,'tr'));
        return {kategori,rows,seedScore,seedTimer,seedSummary};
    }

            const total=results.reduce((n,x)=>n+x.rows.length,0);
            const backed=results.reduce((n,x)=>n+x.rows.filter(r=>r.hasBackups).length,0);
            const missing=results.reduce((n,x)=>n+x.rows.reduce((a,r)=>a+r.missingScores+r.missingTimers+(r.missingSummary?1:0),0),0);
            const seeded=results.reduce((n,x)=>n+x.seedScore+x.seedTimer+x.seedSummary,0);
            durum.innerHTML=`Tarama tamamlandı. ${backed}/${total} maç için yedek bulundu · ${missing} eksik kayıt · ${seeded} mevcut kayıt için ilk yedek oluşturuldu.`;
            let html='';
            for(const group of results){
                html+=`<h3>${group.kategori}</h3><div style="overflow-x:auto"><table class="tutanak-table"><tr><th>Maç</th><th>Yedek Puan</th><th>Eksik Puan</th><th>Yedek Süre</th><th>Eksik Süre</th><th>İşlem</th></tr>`;
                for(const r of group.rows){
                    const missing=r.missingScores+r.missingTimers+(r.missingSummary?1:0);
                    html+=`<tr><td>${htmlEscape(r.etiket)}</td><td>${r.scoreCount}</td><td class="${r.missingScores?'jury-missing':'jury-ok'}">${r.missingScores}</td><td>${r.timerCount+(r.missingSummary?1:0)}</td><td class="${missing?'jury-missing':'jury-ok'}">${r.missingTimers+(r.missingSummary?1:0)}</td><td>${missing?`<button class="btn" style="padding:7px;margin:0;background:#0f766e" onclick="veriYedegindenKurtar('${group.kategori}','${r.macId}')">Eksikleri kurtar</button>`:'—'}</td></tr>`;
                }
                html+='</table></div>';
            }
            host.innerHTML=html||'<div class="puanlama-bilgi">Henüz puan veya süre yedeği bulunmuyor.</div>';
        }catch(err){
            if(durum)durum.textContent='Yedek taraması başarısız: '+String(err?.message||err);
        }
    }

    async function veriYedegindenKurtar(kategori,macId){
        if(!adminYetkiliMi())return alert('Yönetici yetkisi gerekiyor.');
        if(!navigator.onLine||!firebaseBagli)return alert('Yedekten kurtarma için Firebase bağlantısı gerekir.');
        if(!confirm('Eksik kayıtlar yedekten geri yüklenecek. Mevcut puanlar, süreler ve sonuçlar değiştirilmeyecek. Devam edilsin mi?'))return;
        let puan=0,sayac=0,toplamSure=0;
        try{
            const base=`arsiv/juriPuanYedekleri/${kategori}/${macId}`;
            const tBase=`arsiv/konusmaSureYedekleri/${kategori}/${macId}`;
            const [pSnap,tSnap,sSnap,mSnap]=await Promise.all([
                db.ref(base).once('value'),db.ref(tBase).once('value'),
                db.ref(macSureYedekYolu(kategori,macId)+'/sonDurum').once('value'),
                db.ref(`maclar/${kategori}/${macId}`).once('value')
            ]);
            const pItems=pSnap.val()||{},tItems=tSnap.val()||{},summary=sSnap.val()||null;
            const scoreEntries=Object.entries(pItems).filter(([_,x])=>x?.sonDurum?.secim&&x?.sonDurum?.puanlar);
            const timerEntries=Object.entries(tItems).filter(([_,x])=>x?.sonDurum?.baslangicAt);
            const scoreSample=scoreEntries[0]?.[1]?.sonDurum;
            const timerSample=timerEntries[0]?.[1]?.sonDurum;
            const seed=timerSample?.macMeta|| (scoreSample?.secim?.hukOkul&&scoreSample?.secim?.muhOkul?{
                id:macId,kategori,hukOkul:scoreSample.secim.hukOkul,muhOkul:scoreSample.secim.muhOkul,
                etiket:macEtiketi(scoreSample.secim.hukOkul,scoreSample.secim.muhOkul),durum:'acik'}:null);
            let liveMac=mSnap.val();
            if(!liveMac&&seed){
                const restored=await db.ref(`maclar/${kategori}/${macId}`).transaction(cur=>cur||{
                    ...seed,id:macId,kategori,durum:['acik','kapali','iptal'].includes(seed.durum)?seed.durum:'acik',
                    createdAt:Date.now(),updatedAt:Date.now(),restoredFromArchive:true,restoredAt:Date.now()
                },undefined,false);
                liveMac=restored.snapshot?.val()||null;
            }
            for(const [natural,x] of scoreEntries){
                const target=db.ref(`puanlar/${kategori}/${natural}`);
                const result=await target.transaction(cur=>cur||{...x.sonDurum,restoredFromArchive:true,restoredAt:Date.now()},undefined,false);
                if(result.committed)puan++;
            }
            for(const [timerId,x] of timerEntries){
                const target=db.ref(`maclar/${kategori}/${macId}/konusmaSayaclari/${timerId}`);
                const result=await target.transaction(cur=>cur||{...x.sonDurum,restoredFromArchive:true,restoredAt:Date.now()},undefined,false);
                if(result.committed)sayac++;
            }
            if(summary?.ogrenciler){
                const result=await db.ref(`maclar/${kategori}/${macId}`).transaction(cur=>{
                    if(!cur||cur.sureEsitlik)return cur;
                    cur.sureEsitlik={...summary,restoredFromArchive:true,restoredAt:Date.now()};
                    return cur;
                },undefined,false);
                if(result.committed)toplamSure++;
            }
            alert(`Kurtarma tamamlandı. Geri yüklenen: ${puan} jüri puanı, ${sayac} öğrenci sayacı, ${toplamSure} maç süre toplamı. Var olan kayıtlar değiştirilmedi.`);
            await renderVeriKurtarma();
        }catch(err){alert('Yedekten kurtarma tamamlanamadı: '+String(err?.message||err));}
    }

    // --- PUANLAMA MODÜLÜ ---
    // Fikstür ve öğrenci kayıtları ayrı Firebase dallarındadır. Maçlar her zaman
    // sabit resmî fikstürden OKUNUR; bu işlem fikstürü veya jüri dağılımını yazmaz.
    let puanlamaYuklemeSurumu = 0;
    let puanlamaKayitliOkullar = {};
    let puanlamaMaclar = new Map();
    let puanlamaFiksturMaclar = [];
    let puanlamaOkulHatasi = '';

    function puanlamaOkulAdlari() {
        return Object.keys(puanlamaKayitliOkullar).sort((a,b)=>a.localeCompare(b,'tr'));
    }

    // Okul adlarındaki biçim ve noktalama farklarına karşı tekil, güvenli eşleme.
    // İsim kökü/benzerlik/fuzzy eşleştirme YOK: birden çok aday varsa işlem durur.
    function guvenliOkulAnahtari(ad){
        return puanMetniNormalize(ad).toLocaleLowerCase('tr-TR')
            .replace(/ı/g,'i').replace(/i\u0307/g,'i')
            .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
            .replace(/[^a-z0-9]/g,'');
    }
    function guvenliKadroKaynagiBul(okullar,mac,taraf,puanlanan=[]){
        const hedef=taraf==='huk'?mac.hukOkul:mac.muhOkul;
        const secili=mac.ogrenciKaynaklari?.[taraf]||'';
        const keys=Object.keys(okullar).filter(k=>Array.isArray(okullar[k])&&okullar[k].length);
        const kapsiyor=k=>(puanlanan||[]).every(ad=>
            okullar[k].some(ogr=>skorEslesmeAnahtari(ogr)===skorEslesmeAnahtari(ad)));
        const adaylar=keys.filter(k=>
            guvenliOkulAnahtari(k)===guvenliOkulAnahtari(hedef) && kapsiyor(k));
        if(secili && keys.includes(secili) && kapsiyor(secili))return secili;
        if(adaylar.length===1)return adaylar[0];
        // Farklı isimli kadroyu sadece BU MAÇTA puanlanan öğrencilerin TAMAMINI
        // kapsayan TEK kayıt olduğunda öner. Çakışmada kendiliğinden seçme.
        if((puanlanan||[]).length>=2){
            const puanUyumlu=keys.filter(k=>kapsiyor(k));
            if(puanUyumlu.length===1)return puanUyumlu[0];
        }
        return '';
    }
    function puanlamaTamOkulEslesmesi(fiksturAdi) {
        const k=guvenliOkulAnahtari(fiksturAdi);
        const aday=puanlamaOkulAdlari().filter(n=>guvenliOkulAnahtari(n)===k);
        return aday.length===1?aday[0]:'';
    }

    function puanlamaRosteriGetir(snap) {
        const map={};
        snap.forEach(o=>{
            const vals=o.val();
            const students=(vals && typeof vals==='object' ? Object.values(vals) : [])
                .filter(x=>typeof x==='string' && x.trim()).map(x=>String(x).trim());
            map[o.key]=students;
        });
        return map;
    }

    function puanlamaGecerliFiksturMaci(m) {
        if(!m || m.isBay || m.isEmpty || m.isPending || !m.team1 || !m.team2 ||
           [m.team1,m.team2].some(x=>fiksturIstisnaNorm(x)==='boş'||fiksturIstisnaNorm(x)==='bay') ||
           !Number.isInteger(Number(m.no)))return false;
        const x=(m.team1+' '+m.team2).toLocaleLowerCase('tr-TR');
        return !/maç galibi|tur galibi|kura beklen|belirlenecek|canlı kura|protokol/.test(x);
    }

    function puanlamaFiksturMacKaydi(m, mevcut={}) {
        const kategori=m.cat==='lise'?'LİSE':'ORTAOKUL';
        const id=macKimligiOlustur(kategori,m.team1,m.team2);
        return {
            ...mevcut,id,kategori,hukOkul:m.team1,muhOkul:m.team2,
            etiket:macEtiketi(m.team1,m.team2),fiksturNo:Number(m.no),
            fiksturTarih:m.dateStr||'',fiksturSaat:m.time||'',
            ogrenciKaynaklari:mevcut.ogrenciKaynaklari||{},
            isPending:!!m.isPending,
            durum:mevcut.durum||'acik'
        };
    }

    // Cihazın yerel tarih/saatine göre mevcut veya sıradaki açık resmî maçı bulur.
    // Tek salon fikstüründe aynı anda iki maç seçmek riskli olduğundan eşit/çakışan
    // başlangıçlarda rastgele seçim yapmaz; ilgili alanı jüriye manuel seçtirir.
    function puanlamaMacSaatAraliginiCoz(m) {
        const tarihKey = raporFiksturTarihAnahtari(m?.fiksturTarih || m?.tarih || '');
        const saatMetni = String(m?.fiksturSaat || m?.time || '');
        const saat = saatMetni.match(/(\d{1,2}):(\d{2})\s*[-–]\s*(\d{1,2}):(\d{2})/);
        if (!tarihKey || !saat) return null;
        const [y, mo, d] = tarihKey.split('-').map(Number);
        const baslangic = new Date(y, mo - 1, d, Number(saat[1]), Number(saat[2]), 0, 0).getTime();
        const bitis = new Date(y, mo - 1, d, Number(saat[3]), Number(saat[4]), 0, 0).getTime();
        if (!Number.isFinite(baslangic) || !Number.isFinite(bitis) || bitis <= baslangic) return null;
        return { tarihKey, baslangic, bitis };
    }

    function puanlamaYerelBugunKeyi(zamanDamgasi=Date.now()) {
        const n = new Date(zamanDamgasi);
        return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`;
    }

    async function puanlamaSunucuSaatiniGetir() {
        // Cihaz saati hatalıysa Firebase'in saat farkını kullan; bağlantı yoksa yerel saate dön.
        try {
            const snap = await db.ref('.info/serverTimeOffset').once('value');
            const fark = Number(snap.val());
            if (Number.isFinite(fark)) return Date.now() + fark;
        } catch (err) {
            console.warn('Sunucu saat farkı okunamadı; cihaz saati kullanılacak:', err);
        }
        return Date.now();
    }

    function puanlamaSaatineGoreOtomatikMacBul(simdi=Date.now()) {
        const bugun = puanlamaYerelBugunKeyi(simdi);
        const adaylar = [...puanlamaMaclar.values()]
            .filter(m => m?.fiksturNo && m.kategori === secimler.kategori && !['kapali','iptal'].includes(m.durum))
            .map(m => {
                const aralik = puanlamaMacSaatAraliginiCoz(m);
                return aralik ? { id: m.id || macKimligiOlustur(m.kategori,m.hukOkul,m.muhOkul), m, ...aralik } : null;
            })
            .filter(Boolean);
        if (!adaylar.length) return '';

        const benzersizIlk = liste => {
            if (!liste.length) return '';
            liste.sort((a,b)=>a.baslangic-b.baslangic || a.bitis-b.bitis);
            // Aynı zaman diliminde birden çok aday varsa yanlış maçı otomatik seçme.
            if (liste.length > 1 && liste[0].baslangic === liste[1].baslangic) return '';
            return liste[0].id;
        };
        const aktif = adaylar.filter(a => a.baslangic <= simdi && simdi <= a.bitis);
        if (aktif.length) return benzersizIlk(aktif);

        const bugununSiradaki = adaylar.filter(a => a.tarihKey === bugun && a.baslangic > simdi);
        const siradakiBugunId = benzersizIlk(bugununSiradaki);
        if (siradakiBugunId) return siradakiBugunId;

        // Bugünkü açık maçların saati geçmişse önce bugünün son açık maçını seç.
        const bugununGecmisi = adaylar.filter(a => a.tarihKey === bugun && a.bitis < simdi)
            .sort((a,b)=>b.baslangic-a.baslangic);
        if (bugununGecmisi.length) {
            if (bugununGecmisi.length > 1 && bugununGecmisi[0].baslangic === bugununGecmisi[1].baslangic) return '';
            return bugununGecmisi[0].id;
        }

        const gelecektekiler = adaylar.filter(a => a.baslangic > simdi).sort((a,b)=>a.baslangic-b.baslangic);
        const siradakiGenelId = benzersizIlk(gelecektekiler);
        if (siradakiGenelId) return siradakiGenelId;

        // Takvimde geriye dönük açık kayıt kaldıysa en sonuncuyu seç; kapalı maçlar aday değildir.
        const gecmis = adaylar.filter(a => a.bitis < simdi).sort((a,b)=>b.baslangic-a.baslangic);
        if (!gecmis.length) return '';
        if (gecmis.length > 1 && gecmis[0].baslangic === gecmis[1].baslangic) return '';
        return gecmis[0].id;
    }

    async function puanlamaVerileriniYukle(korunacakMacId = '') {
        const surum=puanlamaYuklemeSurumu,kat=secimler.kategori;
        const [oRes,mRes]=await Promise.allSettled([
            db.ref('okullar/'+kat).once('value'),
            db.ref('maclar/'+kat).once('value')
        ]);
        if(surum!==puanlamaYuklemeSurumu || !document.getElementById('aktifMac'))return;
        puanlamaOkulHatasi='';
        puanlamaKayitliOkullar={};
        if(oRes.status==='fulfilled')puanlamaKayitliOkullar=puanlamaRosteriGetir(oRes.value);
        else puanlamaOkulHatasi=String(oRes.reason?.message||oRes.reason||'Öğrenci kayıtları okunamadı.');
        const varOlanMaclar={};
        if(mRes.status==='fulfilled')mRes.value.forEach(c=>{varOlanMaclar[c.key]=c.val();});
        puanlamaDurumYaz(puanlamaOkulHatasi
            ? 'Öğrenci kayıtları okunamadı: '+puanlamaOkulHatasi+' · Fikstür yükleniyor…'
            : `Öğrenci kayıtları: ${puanlamaOkulAdlari().length} okul, ${Object.values(puanlamaKayitliOkullar).reduce((n,a)=>n+a.length,0)} öğrenci. Sabit fikstür yükleniyor…`,!!puanlamaOkulHatasi);
        let fixture=[];let fixtureErr='';
        try{fixture=await puanlamaFiksturMaclariniOku();}catch(err){fixtureErr=String(err?.message||err);}
        if(surum!==puanlamaYuklemeSurumu || !document.getElementById('aktifMac'))return;
        const cat=kat==='LİSE'?'lise':'ortaokul';
        puanlamaFiksturMaclar=fixture.filter(m=>m.cat===cat && puanlamaGecerliFiksturMaci(m));
        puanlamaMaclar=new Map();
        for(const m of puanlamaFiksturMaclar){
            const id=macKimligiOlustur(kat,m.team1,m.team2);
            const entry=puanlamaFiksturMacKaydi(m,varOlanMaclar[id]||{});
            puanlamaMaclar.set(id,entry);
        }
        // Eskiden puan girilmiş ama henüz eşleşmeye taşınmamış maçları sakla.
        for(const [key,m] of Object.entries(varOlanMaclar)){
            if(!m?.hukOkul||!m?.muhOkul||puanlamaMaclar.has(key))continue;
            puanlamaMaclar.set(key,{...m,id:key});
        }
        puanlamaManuelOkulSecenekleri();
        const select=document.getElementById('aktifMac');
        if(!select)return;
        const donenler=puanlamaFiksturMaclar.length;
        const ekMaclar=[...puanlamaMaclar.values()].filter(m=>!m.fiksturNo);
        select.innerHTML='<option value="">Maç seçiniz — sabit fikstürden yüklenir</option>'+
            puanlamaFiksturMaclar.map(m=>{
                const id=macKimligiOlustur(kat,m.team1,m.team2);
                const md=puanlamaMaclar.get(id)?.durum;
                const durum=md==='kapali'?' [TAMAMLANDI]':md==='iptal'?' [İPTAL]':'';
                const disabled=md==='iptal'?' disabled':'';
                return `<option value="${htmlEscape(id)}"${disabled}>#${m.no} · ${htmlEscape(m.dateStr||'Tarih belirlenecek')} · ${htmlEscape(m.time||'')} · ${htmlEscape(m.team1)} — ${htmlEscape(m.team2)}${durum}</option>`;
            }).join('')+
            (ekMaclar.length?'<optgroup label="Eski / manuel puanlama kayıtları">'+ekMaclar.map(m=>`<option value="${htmlEscape(m.id)}">${htmlEscape(m.etiket||macEtiketi(m.hukOkul,m.muhOkul))}</option>`).join('')+'</optgroup>':'');
        const oncekiMac=secimler.macId;
        const otomatikSimdi=await puanlamaSunucuSaatiniGetir();
        if(surum!==puanlamaYuklemeSurumu || document.getElementById('aktifMac')!==select)return;
        const otomatikMacId=puanlamaSaatineGoreOtomatikMacBul(otomatikSimdi);
        const otomatikMacSecenegi=otomatikMacId ? [...select.options].find(x=>x.value===otomatikMacId && !x.disabled) : null;
        const korunacakMacSecenegi=korunacakMacId ? [...select.options].find(x=>x.value===korunacakMacId && !x.disabled) : null;
        const oncekiMacSecenegi=oncekiMac ? [...select.options].find(x=>x.value===oncekiMac && !x.disabled) : null;
        if(korunacakMacSecenegi){
            // Puan gönderiminden dönüşte aynı maçta kal; yalnızca öğrenci seçimi yeniden yapılır.
            select.value=korunacakMacId;
            await merkeziMacSecildi(true);
        }else if(otomatikMacSecenegi){
            // Yeni girişlerde mevcut davranış: cihaz/sunucu saatine uygun maçı otomatik seç.
            select.value=otomatikMacId;
            await merkeziMacSecildi(true);
        }else if(oncekiMacSecenegi){
            const oncekiKayit=puanlamaMaclar.get(oncekiMac);
            const oncekiZaman=puanlamaMacSaatAraliginiCoz(oncekiKayit);
            // Otomatik eşleşme çözülemezse yalnızca manuel kayıtları veya bugüne ait
            // açık bir maçı koru; önceki günün maçını fark ettirmeden seçili bırakma.
            if(!oncekiKayit?.fiksturNo || (oncekiZaman?.tarihKey===puanlamaYerelBugunKeyi() && !['kapali','iptal'].includes(oncekiKayit?.durum))){
                select.value=oncekiMac;
                await merkeziMacSecildi(true);
            }else{
                secimler.macId='';secimler.ogr='';secimler.okul='';
                secimler.hukOkul='';secimler.muhOkul='';secimleriKaydet();
                puanlamaManuelOkulSecenekleri();
                puanlamaKaynakPaneliniGuncelle();
                void juriPaneliniGuncelle(null);
            }
        }else{
            secimler.macId='';secimler.ogr='';secimler.okul='';
            secimler.hukOkul='';secimler.muhOkul='';secimleriKaydet();
            puanlamaManuelOkulSecenekleri();
            puanlamaKaynakPaneliniGuncelle();
            void juriPaneliniGuncelle(null);
        }
        const stuCount=Object.values(puanlamaKayitliOkullar).reduce((n,a)=>n+a.length,0);
        const durum=`Sabit fikstür: ${donenler} gerçek ${kat.toLocaleLowerCase('tr-TR')} maçı · Öğrenci listesi: ${puanlamaOkulAdlari().length} okul / ${stuCount} öğrenci.`;
        let ek='';
        if(puanlamaOkulHatasi)ek+=' Öğrenci kayıtları okunamadı: '+puanlamaOkulHatasi+'.';
        else if(!stuCount)ek+=' Öğrenci kayıtları bu kategoride bulunamadı; Okullar ve Öğrenciler modülünden kontrol edin.';
        if(fixtureErr)ek+=' Fikstür hatası: '+fixtureErr;
        if(mRes.status==='rejected')ek+=' Eski maç kayıtları okunamadı: '+String(mRes.reason?.message||mRes.reason);
        puanlamaDurumYaz(durum+ek,!!(puanlamaOkulHatasi||fixtureErr));
        if(secimler.taraf)ogrencileriYukle();
        canliJuriTakibiBaslat();
    }

    }

    function puanlamaKaynakAdi(m,taraf) {
        const v=taraf==='HÜKÜMET'?'huk':'muh';
        const raw=v==='huk'?m?.hukOkul:m?.muhOkul;
        const kayit=m?.ogrenciKaynaklari?.[v];
        if(kayit && Object.hasOwn(puanlamaKayitliOkullar,kayit))return kayit;
        return puanlamaTamOkulEslesmesi(raw);
    }

    function puanlamaKaynakPaneliniGuncelle() {
        const container=document.getElementById('puanlamaKaynakPanel');
        const bilgi=document.getElementById('seciliMacBilgisi');
        if(!container)return;
        const m=puanlamaMaclar.get(secimler.macId);
        if(!m){container.innerHTML='';if(bilgi)bilgi.textContent='Maç seçildiğinde okullar otomatik belirlenecek.';return;}
        if(bilgi)bilgi.textContent=`${m.fiksturNo?'#'+m.fiksturNo+' · ':''}${m.fiksturTarih||''} ${m.fiksturSaat||''} · HÜKÜMET: ${m.hukOkul} / MUHALEFET: ${m.muhOkul}`;
        const huk=puanlamaKaynakAdi(m,'HÜKÜMET');
        const muh=puanlamaKaynakAdi(m,'MUHALEFET');
        if(!puanlamaOkulAdlari().length){
            container.innerHTML='<div class="puanlama-bilgi hata">Bu kategori için kayıtlı öğrenci listesi bulunamadı veya okunamadı. Okullar ve Öğrenciler bölümündeki kayıtları kontrol edin. Maçlar ve fikstür silinmedi.</div>';
            return;
        }
        // Eşleşme doğru ve her iki okulun listesi doluysa hiçbir onay veya düzeltme isteme.
        if(huk && muh && puanlamaKayitliOkullar[huk]?.length && puanlamaKayitliOkullar[muh]?.length){
            container.innerHTML=`<div class="puanlama-bilgi">Öğrenci listeleri bulundu: <b>${htmlEscape(m.hukOkul)}</b> (${puanlamaKayitliOkullar[huk].length} öğrenci) · <b>${htmlEscape(m.muhOkul)}</b> (${puanlamaKayitliOkullar[muh].length} öğrenci).</div>`;
            return;
        }
        // Jüri, resmî maçın taraflarını değiştirmez. Eşleştirme yalnızca yönetici alanındadır.
        const missing=[];
        if(!huk || !(puanlamaKayitliOkullar[huk]||[]).length)missing.push('Hükümet: '+m.hukOkul);
        if(!muh || !(puanlamaKayitliOkullar[muh]||[]).length)missing.push('Muhalefet: '+m.muhOkul);
        container.innerHTML=`<div class="puanlama-bilgi hata">
            <b>Öğrenci listesi kontrolü gerekli.</b> Resmî maç eşleşmesi değiştirilmemiştir.
            <div style="margin-top:7px">Öğrenci listesi bulunamayan taraf(lar): ${htmlEscape(missing.join(' · '))}.</div>
            <div style="margin-top:7px">Eksik öğrencileri Yönetici Modülü → Okullar ve Öğrenciler'den kaydedin. Okulun fikstürdeki adı ile kayıtlı öğrenci listesi adı farklıysa Yönetici Modülü'ndeki <b>Öğrenci Listesi Eşleştirmeleri</b> alanını kullanın.</div>
        </div>`;
    }

    async function puanlamaKaynaklariniKaydet() {
        const m=puanlamaMaclar.get(secimler.macId);
        if(!m)return alert('Önce sabit fikstürden maç seçin.');
        if(!adminYetkiliMi() && !adminSifreDogrula('Öğrenci listesi eşleştirmek için yönetici şifresini giriniz:'))return;
        const huk=document.getElementById('puanlamaKaynak_huk')?.value||'';
        const muh=document.getElementById('puanlamaKaynak_muh')?.value||'';
        if(!huk||!muh || !puanlamaKayitliOkullar[huk]?.length || !puanlamaKayitliOkullar[muh]?.length)
            return alert('Her iki takım için de öğrenci içeren kayıtlı okul seçilmelidir.');
        if(huk===muh)return alert('İki farklı takım aynı öğrenci listesine bağlanamaz.');
        const current=m.ogrenciKaynaklari||{};
        try{
            const snap=await db.ref(`puanlar/${secimler.kategori}`).once('value');
            let hasScore=false;
            snap.forEach(c=>{if(kayitMacId(c.val())===m.id)hasScore=true;});
            if(hasScore && (current.huk!==huk || current.muh!==muh))
                return alert('Bu maçta puan kaydı bulunduğundan öğrenci kaynağı değiştirilemez. Yetkili olarak önce puanları kontrol edin.');
            const result=await db.ref(`maclar/${secimler.kategori}/${m.id}`).transaction(cur=>{
                if (['kapali','iptal'].includes(cur?.durum))return;
                if(cur?.hukOkul && (cur.hukOkul!==m.hukOkul || cur.muhOkul!==m.muhOkul))return;
                // Başka cihazda eşzamanlı değiştirildiyse değişikliği sessizce ezme.
                if((cur?.ogrenciKaynaklari?.huk||'')!==(current.huk||'') ||
                   (cur?.ogrenciKaynaklari?.muh||'')!==(current.muh||''))return;
                return {...cur,id:m.id,kategori:secimler.kategori,hukOkul:m.hukOkul,muhOkul:m.muhOkul,
                    etiket:m.etiket,durum:cur?.durum||'acik',fiksturNo:m.fiksturNo||null,
                    ogrenciKaynaklari:{huk,muh},createdAt:cur?.createdAt||Date.now(),updatedAt:Date.now()};
            },undefined,false);
            if(!result.committed)return alert('Maç kapanmış veya bilgiler değişmiş. Eşleştirme kaydedilemedi.');
            m.ogrenciKaynaklari={huk,muh};
            secimler.ogr='';secimler.okul='';secimleriKaydet();
            puanlamaKaynakPaneliniGuncelle();
            ogrencileriYukle();
            alert('Öğrenci listeleri eşleştirildi. Fikstür ve öğretmen görevleri değişmedi.');
        }catch(err){alert('Öğrenci eşleştirmesi kaydedilemedi: '+String(err?.message||err));}
    }

    // Jüri seçimi, seçili maçın günü ve kategorisindeki üç asıl jüri üzerinden yapılır.
    // Cihaz kilidi başka güne aitse rolü yeni güne otomatik taşımayız; jüri kilidi kaldırıp
    // o günün listesinden kendi adını seçmelidir. Yedek jüri puanlama listesine eklenmez.
    let juriPanelYuklemeSurumu = 0;
    function juriSecimBaglami(mac) {
        if (!mac) return null;
        const tarih = mac.fiksturTarih || mac.tarih || '';
        const gunKey = raporFiksturTarihAnahtari(tarih);
        if (!gunKey) return null;
        return { gunKey, gunLabel: tarih || gunKey, kategori: secimler.kategori === 'LİSE' ? 'lise' : 'ortaokul' };
    }
    function juriOturumuSeciliMacaUygun(oturum, mac) {
        const b = juriSecimBaglami(mac);
        return !!(oturum && b && oturum.gunKey === b.gunKey && oturum.kategori === b.kategori &&
            ['1. Jüri','2. Jüri','3. Jüri'].includes(oturum.juri));
    }
    function juriPanelMetin(panel, metin, hata=false) {
        const d = document.createElement('div');
        d.style.cssText = `font-size:13px;line-height:1.55;color:${hata?'#fed7aa':'#cbd5e1'};`;
        d.textContent = metin;
        panel.appendChild(d);
    }
    async function juriPaneliniGuncelle(mac=null) {
        const panel = document.getElementById('juriOturumPanel');
        if (!panel) return;
        const yuklemeSurumu = ++juriPanelYuklemeSurumu;
        const aktifMac = mac || puanlamaMaclar.get(secimler.macId) || null;
        const baglam = juriSecimBaglami(aktifMac);
        const oturum = juriOturumuGetir();
        panel.replaceChildren();

        if (oturum) {
            const ust = document.createElement('div');
            ust.style.cssText = 'display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;';
            const metin = document.createElement('div');
            const label = document.createElement('div');
            label.style.cssText = 'font-size:11px;color:var(--text-muted);text-transform:uppercase;';
            label.textContent = 'Bu cihazın jüri kilidi';
            const ad = document.createElement('b');
            ad.style.color = '#34d399';
            ad.textContent = oturum.yedekMi
                ? `Yedek jüri · ${oturum.juri} yerine · ${oturum.ad}`
                : `${oturum.juri} · ${oturum.ad}`;
            metin.append(label, ad);
            const kontroller = document.createElement('div');
            kontroller.style.cssText = 'display:flex;gap:7px;flex-wrap:wrap;align-items:center;';
            const yedekBtn = document.createElement('button');
            yedekBtn.className = 'btn';
            yedekBtn.style.cssText = 'width:auto;padding:8px 12px;margin:0;background:#92400e;border-color:#b45309;';
            yedekBtn.textContent = oturum.yedekMi ? 'Yedek jüri atamasını değiştir' : 'Yedek jüriyle değiştir';
            yedekBtn.onclick = () => { void yedekJuriDegisimPaneliniAc(); };
            const kilit = document.createElement('button');
            kilit.className = 'btn';
            kilit.style.cssText = 'width:auto;padding:8px 12px;margin:0;background:#475569;';
            kilit.textContent = 'Jüri Kilidini Kaldır 🔒';
            kilit.onclick = juriOturumunuSifirla;
            kontroller.append(yedekBtn, kilit);
            ust.append(metin, kontroller);
            panel.appendChild(ust);
            const uyumlu = juriOturumuSeciliMacaUygun(oturum, aktifMac);
            if (baglam && !uyumlu) {
                juriPanelMetin(panel, `Bu kilit ${oturum.gunLabel || oturum.gunKey || 'önceki bir oturum'} için kayıtlı. Seçili maç ${baglam.gunLabel} · ${baglam.kategori === 'lise' ? 'Lise' : 'Ortaokul'}. Bugünün jüri listesine geçmek için kilidi kaldırıp kendi adınızı seçin. Puanlama bu kilitle açılamaz.`, true);
            } else if (uyumlu) {
                juriPanelMetin(panel, `${baglam.gunLabel} · ${baglam.kategori === 'lise' ? 'Lise' : 'Ortaokul'} oturumu. Yedek jüri yalnızca değişim düğmesiyle, seçilen jüri koltuğunun yerine atanır.`);
            } else {
                juriPanelMetin(panel, 'Maç seçildiğinde bu kilidin o gün ve kategoriye uygunluğu kontrol edilir. Farklı bir jüri kullanacaksa kilidi kaldırın.');
            }
            return;
        }
        if (!baglam) {
            juriPanelMetin(panel, 'Önce tarihi belli bir maç seçin. Ardından yalnızca o günün 3 asıl jüri adı görüntülenir; yedek jüri listelenmez.');
            return;
        }
        const baslik = document.createElement('div');
        baslik.style.cssText = 'font-size:13px;font-weight:750;margin-bottom:8px;color:#f8fafc;';
        baslik.textContent = `${baglam.gunLabel} · ${baglam.kategori === 'lise' ? 'Lise' : 'Ortaokul'} — kendi adınızı seçin`;
        panel.appendChild(baslik);
        const aciklama = document.createElement('div');
        aciklama.style.cssText = 'font-size:11px;color:var(--text-muted);margin-bottom:10px;';
        aciklama.textContent = 'İlk ekranda yalnızca 1., 2. ve 3. asıl jüri listelenir. Yedek jüri görünmez; gerekirse aşağıdaki düğmeyle açılır.';
        panel.appendChild(aciklama);
        try {
            const snap = await db.ref(`fikstur/tekSalon_2026_2027/juries/${baglam.gunKey}/${baglam.kategori}`).once('value');
            if (yuklemeSurumu !== juriPanelYuklemeSurumu || !document.getElementById('juriOturumPanel')) return;
            const roster = snap.val() || {};
            const roller = [
                ['1. Jüri','asil1','1. Asıl jüri'],
                ['2. Jüri','asil2','2. Asıl jüri'],
                ['3. Jüri','asil3','3. Asıl jüri']
            ];
            const grid = document.createElement('div');
            grid.className = 'btn-grid';
            grid.style.cssText = 'grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0;';
            let sayi = 0;
            for (const [rol, anahtar, rolAd] of roller) {
                const kisi = roster[anahtar] || {};
                const isim = puanMetniNormalize(kisi.name || '');
                if (!isim || /^(protokol|belirlenecek|[-—]+)$/i.test(isim)) continue;
                const btn = document.createElement('button');
                btn.className = 'btn';
                btn.style.cssText = 'margin:0;min-width:0;white-space:normal;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:82px;';
                const rolSpan = document.createElement('span');
                rolSpan.style.cssText = 'font-size:11px;color:#93c5fd;';
                rolSpan.textContent = rolAd;
                const isimSpan = document.createElement('strong');
                isimSpan.style.cssText = 'font-size:13px;overflow-wrap:anywhere;';
                isimSpan.textContent = isim;
                btn.append(rolSpan, isimSpan);
                if (kisi.school && kisi.school !== '-') {
                    const okul = document.createElement('span');
                    okul.style.cssText = 'font-size:10px;color:var(--text-muted);';
                    okul.textContent = kisi.school;
                    btn.appendChild(okul);
                }
                btn.onclick = () => { void juriOturumuKilitle(rol, isim); };
                grid.appendChild(btn);
                sayi++;
            }
            if (!sayi) {
                juriPanelMetin(panel, 'Bu gün ve kategori için üç asıl jüri adı okunamadı veya görevlendirmeler henüz kesinleşmemiş. Yedek jüri otomatik olarak kullanılmadı.', true);
            } else {
                panel.appendChild(grid);
            }
            const yedekBtn = document.createElement('button');
            yedekBtn.className = 'btn';
            yedekBtn.style.cssText = 'margin:12px 0 0;background:#92400e;border-color:#b45309;';
            yedekBtn.textContent = '↔ Yedek jüriyle değiştir';

    async function ogrencileriYukle() {
        const alan=document.getElementById('ogrenciButonAlani');
        if(!alan)return;
        if(!secimler.taraf){alan.textContent='Önce maç ve taraf seçiniz.';return;}
        const okul=secimler.taraf==='HÜKÜMET'?secimler.hukOkul:secimler.muhOkul;
        const m=puanlamaMaclar.get(secimler.macId);
        const kaynak=m ? puanlamaKaynakAdi(m,secimler.taraf) : puanlamaTamOkulEslesmesi(okul);
        secimler.okul=okul||'';
        if(!okul)secimler.ogr='';
        secimleriKaydet();
        if(!okul){alan.textContent='Maç ve takım seçilmedi.';return;}
        if(puanlamaOkulHatasi){alan.textContent='Öğrenci kayıtları okunamadı: '+puanlamaOkulHatasi;return;}
        const liste=puanlamaKayitliOkullar[kaynak]||[];
        if(!liste.length){
            alan.innerHTML=`<div class="puanlama-bilgi hata" style="grid-column:span 2;">${htmlEscape(okul)} için kayıtlı öğrenci bulunamadı. Kayıtlı resmî ad farklıysa yukarıdaki eşleştirmeyi kullanın; hiç öğrenci yüklenmemişse Okullar ve Öğrenciler modülünü açın.</div>`;
            secimler.ogr='';secimleriKaydet();canliJuriTakibiBaslat();return;
        }
        alan.innerHTML='';
        liste.forEach((ad,i)=>{
            const rol=i<3?`${i+1}. Konuşmacı`:'Grup Sözcüsü';
            const btnText=`${ad} (${rol})`;
            const btn=document.createElement('button');
            btn.className='btn ogr-btn'+(secimler.ogr===btnText?' btn-active':'');
            btn.textContent=btnText;
            btn.onclick=()=>tekSecim(btn,'ogr','ogr-btn');
            alan.appendChild(btn);
        });
        if(!liste.some((ad,i)=>`${ad} (${i<3?i+1+'. Konuşmacı':'Grup Sözcüsü'})`===secimler.ogr)){
            secimler.ogr='';secimleriKaydet();
        }
        canliJuriTakibiBaslat();
    }

    function tekSecim(element, tip, sinif) {
        document.querySelectorAll('.' + sinif).forEach(b => b.classList.remove('btn-active'));
        element.classList.add('btn-active');
        secimler[tip] = element.innerText;
        if(tip === 'taraf') {
            secimler.ogr = '';
            ogrencileriYukle();

        secimleriKaydet();
        canliJuriTakibiBaslat();
