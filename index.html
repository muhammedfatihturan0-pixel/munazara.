<script>
    const APP_VERSION = '3.3 · Fikstür / Puan / Süre Entegrasyonu';
    const krit = [
        {t:"Argüman Mantıklı ve Tutarlı mı?", m:5}, {t:"Argümanlar Örneklerle Destekleniyor mu?", m:5}, {t:"Argümanın Güncel ve Bilimsel Verilere Dayanıyor mu?", m:5},
        {t:"Ses Tonu ve Vurgu", m:10}, {t:"Jest ve Mimiklerin Etkin Kullanımı", m:10}, {t:"Göz Teması ve Konuşma Hızı", m:5},
        {t:"Materyal Kullanımı", m:5}, {t:"Karşıt Görüşe Cevap Verebilme", m:10}, {t:"Saygılı ve Etkin Üslup Kullanımı", m:10},
        {t:"Tartışmanın Farklı ve Derin Bir Biçimde Ele Alınması", m:10}, {t:"Konuşma Süresini Etkin Kullanabiliyor mu?", m:10},
        {t:"Konuşma İyi Planlanmış mı?", m:10}, {t:"Konuşma Esnasında Konu Bütünlüğü Sağlanıyor mu?", m:5}
    ];

    const BEKLENEN_JURILER = ['1. Jüri', '2. Jüri', '3. Jüri'];
    const kSifre = "MTk5Mg==";
    const JURI_OTURUM_KEY = 'munazaraJuriOturumuV3';
    const OFFLINE_QUEUE_KEY = 'munazaraOfflineQueueV3';
    const CLIENT_ID_KEY = 'munazaraClientIdV1';
    const TURN_CACHE_PREFIX = 'turnuvaCacheV3_';

    let aktifMacSecimleri = JSON.parse(localStorage.getItem('aktifMacSecimleri')) || {
        kategori: 'ORTAOKUL', hukOkul: '', muhOkul: '', taraf: '', juri: '', juriAd: '', ogr: '', okul: '', macId: ''
    };
    let secimler = { ...aktifMacSecimleri };
    let verilenPuanlar = {};
    let puanGonderiliyor = false;
    let sonRaporVerisi = null;
    let firebaseBagli = false;
    let aktifJuriListenerRef = null;
    let aktifJuriMacListenerRef = null;
    let aktifCanliPanelRefs = [];
    let aktifTurnuvaRef = null;

    function puanMetniNormalize(v) {
        return String(v ?? '').normalize('NFC').trim();
    }

    function htmlEscape(v) {
        return String(v ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    }

    function hash32(str, seed=2166136261) {
        let h = seed >>> 0;
        for (let i = 0; i < str.length; i++) {
            h ^= str.charCodeAt(i);
            h = Math.imul(h, 16777619);
        }
        return (h >>> 0).toString(16).padStart(8, '0');
    }

    function getClientId() {
        let id = localStorage.getItem(CLIENT_ID_KEY);
        if (!id) {
            id = 'c_' + hash32(String(Date.now()) + '|' + Math.random(), 2166136261) + hash32(navigator.userAgent || '', 3339675911);
            localStorage.setItem(CLIENT_ID_KEY, id);
        }
        return id;
    }

    function macEtiketi(hukOkul, muhOkul) {
        return `${puanMetniNormalize(hukOkul)} VS ${puanMetniNormalize(muhOkul)}`;
    }

    function macKimligiOlustur(kategori, hukOkul, muhOkul) {
        const temel = [kategori, hukOkul, muhOkul].map(puanMetniNormalize).join('|').toLocaleLowerCase('tr-TR');
        return 'm_' + hash32(temel, 2166136261) + hash32(temel, 3339675911);
    }

    function macEskiEtiketi(hukOkul, muhOkul) {
        return `${hukOkul}-vs-${muhOkul}`;
    }

    function kayitMacId(v) {
        if (v?.macId) return v.macId;
        const s = v?.secim || {};
        if (s.hukOkul && s.muhOkul) return macKimligiOlustur(s.kategori || v.kategori || '', s.hukOkul, s.muhOkul);
        if (v?.mac) return 'legacy_' + hash32(String(v.mac).toLocaleLowerCase('tr-TR'));
        return 'legacy_genel';
    }

    function kayitMacEtiketi(v) {
        if (v?.macEtiketi) return v.macEtiketi;
        const s = v?.secim || {};
        if (s.hukOkul && s.muhOkul) return macEtiketi(s.hukOkul, s.muhOkul);
        return String(v?.mac || 'Genel').replace('-vs-', ' VS ');
    }

    function puanKayitKimligi(secimObj, macId) {
        const s = secimObj || {};
        const temel = [
            s.kategori, macId, s.okul, s.ogr, s.juri, s.taraf
        ].map(puanMetniNormalize).join('|').toLocaleLowerCase('tr-TR');
        return 'p_' + hash32(temel, 2166136261) + hash32(temel, 3339675911);
    }

    function puanToplami(v) {
        const p = (v && v.puanlar) || {};
        return krit.reduce((toplam, _k, i) => toplam + Number(p[i] ?? p[String(i)] ?? 0), 0);
    }

    function snapshotKayitlariniTekillestir(snapshot) {
        const map = new Map();
        if (!snapshot) return [];
        snapshot.forEach(c => {
            const v = c.val();
            if (!v || !v.secim || !v.puanlar) return;
            const mid = kayitMacId(v);
            const dogalId = puanKayitKimligi(v.secim, mid);
            map.set(dogalId, { ...v, macId: mid, macEtiketi: kayitMacEtiketi(v), _firebaseKey: c.key, _dogalId: dogalId });
        });
        return Array.from(map.values());
    }

    function ogrenciGrupKimligi(v) {
        const s = v.secim || {};
        return [kayitMacId(v), s.okul || '', (s.ogr || '').split(' (')[0]].map(puanMetniNormalize).join('|');
    }

    function secimleriKaydet() {
        localStorage.setItem('aktifMacSecimleri', JSON.stringify(secimler));
    }

    function LogSifre(metin) {
        return btoa(metin);
    }

    function adminSifreDogrula(mesaj='Yetkili şifresini giriniz:') {
        const girdi = prompt(mesaj);
        if (girdi === null) return false;
        if (LogSifre(girdi.trim()) !== kSifre) {
            alert('Hatalı şifre! Erişim reddedildi.');
            return false;
        }
        sessionStorage.setItem('adminGiris', 'onayli');
        return true;
    }

    function adminYetkiliMi() {
        return sessionStorage.getItem('adminGiris') === 'onayli';
    }

    function juriOturumuGetir() {
        try { return JSON.parse(localStorage.getItem(JURI_OTURUM_KEY) || 'null'); } catch (_) { return null; }
    }

    function juriOturumuKilitle(juri) {
        const ad = prompt(`${juri} için jüri ad-soyadını giriniz:`);
        if (ad === null) return;
        const temizAd = puanMetniNormalize(ad);
        if (!temizAd) return alert('Jüri adı boş bırakılamaz.');
        const oturum = { juri, ad: temizAd, lockedAt: Date.now(), clientId: getClientId() };
        localStorage.setItem(JURI_OTURUM_KEY, JSON.stringify(oturum));
        secimler.juri = juri;
        secimler.juriAd = temizAd;
        secimleriKaydet();
        renderPuanlamaSecim();
    }

    function juriOturumunuSifirla() {
        if (!adminYetkiliMi() && !adminSifreDogrula('Jüri oturumunu değiştirmek için yetkili şifresini giriniz:')) return;
        if (!confirm('Bu cihazdaki jüri oturumu kilidi kaldırılacak. Devam edilsin mi?')) return;
        localStorage.removeItem(JURI_OTURUM_KEY);
        secimler.juri = '';
        secimler.juriAd = '';
        secimleriKaydet();
        renderPuanlamaSecim();
    }

    function offlineKuyrukGetir() {
        try { return JSON.parse(localStorage.getItem(OFFLINE_QUEUE_KEY) || '{}') || {}; } catch (_) { return {}; }
    }

    function offlineKuyrukKaydet(q) {
        localStorage.setItem(OFFLINE_QUEUE_KEY, JSON.stringify(q));
        networkDurumunuGuncelle();
    }

    function puaniKuyrugaEkle(item) {
        const q = offlineKuyrukGetir();
        const key = `${item.kategori}__${item.kayitId}`;
        q[key] = { ...item, queuedAt: Date.now(), queueStatus: 'bekliyor' };
        offlineKuyrukKaydet(q);
    }

    async function offlineKuyruguGonder() {
        if (!navigator.onLine || !firebaseBagli) return;
        const q = offlineKuyrukGetir();
        const keys = Object.keys(q);
        if (!keys.length) return;
        let degisti = false;
        for (const key of keys) {
            const item = q[key];
            try {
                const mSnap = await db.ref(`maclar/${item.kategori}/${item.macId}`).once('value');
                const m = mSnap.val();
                if (m && m.durum === 'kapali') {
                    q[key].queueStatus = 'mac_kapali';
                    degisti = true;
                    continue;
                }
                const rec = { ...item.kayit, serverSyncedAt: firebase.database.ServerValue.TIMESTAMP, offlineSynced: true };
                await db.ref(`puanlar/${item.kategori}/${item.kayitId}`).set(rec);
                delete q[key];
                degisti = true;
            } catch (err) {
                console.warn('Offline kuyruk gönderilemedi:', err);
                const code = String(err?.code || '').toLowerCase();
                if (code.includes('permission')) q[key].queueStatus = 'yetki_hatasi';
                else q[key].queueStatus = 'bekliyor';
                degisti = true;
                break;
            }
        }
        if (degisti) offlineKuyrukKaydet(q);
    }

    function networkDurumunuGuncelle() {
        let el = document.getElementById('systemStatusBadge');
        if (!el) {
            el = document.createElement('div');
            el.id = 'systemStatusBadge';
            el.className = 'system-status';
            document.body.appendChild(el);
        }
        const q = offlineKuyrukGetir();
        const n = Object.keys(q).length;
        const online = navigator.onLine && firebaseBagli;
        el.innerHTML = `<span class="status-dot ${online?'online':'offline'}"></span>${online?'Çevrimiçi':'Çevrimdışı'}${n?` · Kuyruk: ${n}`:''}`;
        el.title = n ? 'Gönderilmeyi bekleyen yerel puan kaydı var.' : 'Tüm puanlar senkron.';
    }

    async function ensureMatchExists(kategori, hukOkul, muhOkul) {
        if (!hukOkul || !muhOkul) return null;
        const id = macKimligiOlustur(kategori, hukOkul, muhOkul);
        const ref = db.ref(`maclar/${kategori}/${id}`);
        await ref.transaction(cur => {
            if (cur) return { ...cur, id, kategori, hukOkul, muhOkul, etiket: macEtiketi(hukOkul, muhOkul), updatedAt: Date.now() };
            return { id, kategori, hukOkul, muhOkul, etiket: macEtiketi(hukOkul, muhOkul), durum: 'acik', createdAt: Date.now(), updatedAt: Date.now(), version: 1 };
        });
        return id;
    }

    async function macDurumuGetir(kategori, macId) {
        if (!macId) return { durum:'acik' };
        const s = await db.ref(`maclar/${kategori}/${macId}`).once('value');
        return s.val() || { durum:'acik' };
    }

    function dinleyicileriTemizle() {
        if (aktifJuriListenerRef) { aktifJuriListenerRef.off(); aktifJuriListenerRef = null; }
        if (aktifJuriMacListenerRef) { aktifJuriMacListenerRef.off(); aktifJuriMacListenerRef = null; }
        aktifCanliPanelRefs.forEach(r => { try { r.off(); } catch (_) {} });
        aktifCanliPanelRefs = [];
        if (aktifTurnuvaRef) { try { aktifTurnuvaRef.off(); } catch (_) {} aktifTurnuvaRef = null; }
    }

    function anaMenu() {
        dinleyicileriTemizle();
        document.getElementById('app').innerHTML = `
            <div class="card" style="text-align:center;">
                <h2 style="border:none; margin-bottom:30px; font-size:28px; letter-spacing:0.5px;">MÜNAZARA KONTROL PANELİ</h2>
                <button class="btn" style="padding:18px; background:var(--primary); border:none;" onclick="renderPuanlamaSecim()">Puanlama Modülü</button>
                <button class="btn" style="padding:18px;" onclick="sifreliModulKontrol('ogrenci')">Öğrenci Yönetimi 🔒</button>
                <button class="btn" style="padding:18px;" onclick="sifreliModulKontrol('turnuva')">Turnuva Ağacı 🔒</button>
                <button class="btn" style="padding:18px;" onclick="sifreliModulKontrol('canli')">Yönetici Canlı Paneli 🔒</button>
                <button class="btn" style="padding:12px; background:transparent; border-color:var(--border-color); margin-top:30px; font-size:14px; color:var(--text-muted);" onclick="renderHakkinda()">ℹ️ Uygulama Hakkında</button>
            </div>`;
    }

    function renderHakkinda() {
        dinleyicileriTemizle();
        document.getElementById('app').innerHTML = `
            <div class="card" style="text-align:center;">
                <h2>Uygulama Hakkında</h2>
                <div style="font-size:15px; color:var(--text-muted); margin-bottom:20px; line-height:1.6;">
                    Bu yazılım, münazara turnuvalarının jüri değerlendirmelerini, puan tutanaklarını ve eleme ağaçlarını dijital, güvenli ve gerçek zamanlı olarak yönetmek amacıyla geliştirilmiştir.

    // --- PUANLAMA MODÜLÜ ---
    function renderPuanlamaSecim() {
        dinleyicileriTemizle();
        verilenPuanlar = {};
        const oturum = juriOturumuGetir();
        if (oturum) {
            secimler.juri = oturum.juri;
            secimler.juriAd = oturum.ad;
            secimleriKaydet();
        }

        const juriHtml = oturum ? `
            <div class="kriter-card" style="border-color:var(--success);">
                <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;">
                    <div><div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;">Bu cihazın jüri oturumu</div><b style="color:#34d399;">${htmlEscape(oturum.juri)} · ${htmlEscape(oturum.ad)}</b></div>
                    <button class="btn" style="width:auto;padding:8px 12px;margin:0;background:#475569;" onclick="juriOturumunuSifirla()">Jüriyi Değiştir 🔒</button>
                </div>
            </div>` : `
            <div class="kriter-card" style="border-color:#f59e0b;">
                <div style="font-size:13px;color:#fbbf24;margin-bottom:8px;"><b>Önce bu tableti bir jüriye kilitleyin.</b> Kilit, yanlış jüri numarasıyla puan gönderilmesini önler.</div>
                <div class="btn-grid" style="grid-template-columns:1fr 1fr 1fr;">
                    ${BEKLENEN_JURILER.map(j=>`<button class="btn" onclick="juriOturumuKilitle('${j}')">${j} Olarak Kilitle</button>`).join('')}
                </div>
            </div>`;

        document.getElementById('app').innerHTML = `
            <div class="card">
                <h2>Puanlama Modülü</h2>
                ${juriHtml}
                <div class="btn-grid" style="grid-template-columns: 1fr 1fr; margin-bottom:20px;">
                    <button class="btn kat-btn ${secimler.kategori==='ORTAOKUL'?'btn-active':''}" onclick="katSec(this, 'ORTAOKUL', 'puanlama')">ORTAOKUL MÜNAZARASI</button>
                    <button class="btn kat-btn ${secimler.kategori==='LİSE'?'btn-active':''}" onclick="katSec(this, 'LİSE', 'puanlama')">LİSE MÜNAZARASI</button>
                </div>

                <select id="aktifMac" onchange="merkeziMacSecildi()"><option value="">Aktif Maç Seçiniz (veya aşağıdan manuel seçin)</option></select>
                <div style="font-size:11px;color:var(--text-muted);margin:-3px 0 8px;">Turnuva ağacındaki maçlar burada merkezi kimlikle görünür. Manuel seçim de kullanılabilir.</div>

                <select id="hukOkul" onchange="macOkulDegisti('hukOkul')"><option value="">Hükümet Okul Seçiniz</option></select>
                <select id="muhOkul" onchange="macOkulDegisti('muhOkul')"><option value="">Muhalefet Okul Seçiniz</option></select>

                <div class="btn-grid" style="grid-template-columns: 1fr 1fr; margin-top:15px;">
                    <button class="btn taraf-btn ${secimler.taraf==='HÜKÜMET'?'btn-active':''}" style="border-left: 4px solid var(--hukumet);" onclick="tekSecim(this, 'taraf', 'taraf-btn')">HÜKÜMET</button>
                    <button class="btn taraf-btn ${secimler.taraf==='MUHALEFET'?'btn-active':''}" style="border-left: 4px solid var(--muhalefet);" onclick="tekSecim(this, 'taraf', 'taraf-btn')">MUHALEFET</button>
                </div>

                <div class="btn-grid" style="grid-template-columns: 1fr 1fr;" id="ogrenciButonAlani">
                    <div style="grid-column: span 2; text-align:center; padding:20px; color:var(--text-muted); font-style:italic;">Önce okulları belirleyip Taraf butonuna basınız.</div>
                </div>

                <div id="canliJuriDurumu" class="kriter-card" style="margin-top:15px;">Canlı jüri durumu için maç ve öğrenci seçiniz.</div>

                <button class="btn" style="background:var(--primary); border:none; margin-top:25px; font-size:16px; padding:16px;" onclick="puanlamaSayfasinaGec()" ${oturum?'':'disabled'}>Kriterleri Puanla →</button>
                <button class="btn" style="background:var(--success); border:none;" onclick="sifreliRaporKontrol()">📊 Sonuçları Gör</button>
                <button class="btn" style="background:#475569" onclick="anaMenu()">← Ana Menü</button>
            </div>`;

        Promise.all([
            db.ref('okullar/' + secimler.kategori).once('value'),
            db.ref('maclar/' + secimler.kategori).once('value')
        ]).then(([s, mSnap]) => {
            const hSelect = document.getElementById('hukOkul');
            const mSelect = document.getElementById('muhOkul');
            if (!hSelect || !mSelect) return;
            s.forEach(o => {
                const ad = htmlEscape(o.key);
                hSelect.innerHTML += `<option value="${ad}">${ad}</option>`;
                mSelect.innerHTML += `<option value="${ad}">${ad}</option>`;
            });
            if (secimler.hukOkul) hSelect.value = secimler.hukOkul;
            if (secimler.muhOkul) mSelect.value = secimler.muhOkul;

            const macSelect = document.getElementById('aktifMac');
            if (macSelect) {
                const maclar = [];
                mSnap.forEach(c => { const v=c.val(); if(v?.hukOkul && v?.muhOkul) maclar.push({ ...v, id: v.id || c.key }); });
                maclar.sort((a,b)=>(a.etiket||'').localeCompare(b.etiket||'','tr'));
                maclar.forEach(m => {
                    const kapali = m.durum === 'kapali';
                    macSelect.innerHTML += `<option value="${htmlEscape(m.id || '')}">${htmlEscape(m.etiket || macEtiketi(m.hukOkul,m.muhOkul))}${kapali?' [KAPALI]':''}</option>`;

                if (secimler.macId && [...macSelect.options].some(o=>o.value===secimler.macId)) macSelect.value = secimler.macId;
            }
            if (secimler.taraf) ogrencileriYukle();
            canliJuriTakibiBaslat();
        }).catch(err => console.error('Puanlama seçimleri yüklenemedi:', err));

    async function merkeziMacSecildi() {
        const sel = document.getElementById('aktifMac');
        const id = sel?.value || '';
        if (!id) {
            secimler.macId = '';
            secimleriKaydet();
            canliJuriTakibiBaslat();
            return;
        }
        const snap = await db.ref(`maclar/${secimler.kategori}/${id}`).once('value');
        const m = snap.val();
        if (!m) return alert('Maç bilgisi bulunamadı.');
        secimler.macId = id;
        secimler.hukOkul = m.hukOkul;
        secimler.muhOkul = m.muhOkul;
        secimler.ogr = '';
        secimler.okul = '';
        secimleriKaydet();
        const h = document.getElementById('hukOkul'), mu = document.getElementById('muhOkul');
        if (h) h.value = m.hukOkul;
        if (mu) mu.value = m.muhOkul;
        if (secimler.taraf) ogrencileriYukle();
        canliJuriTakibiBaslat();
    }

    function macOkulDegisti(tip) {
        secimler[tip] = document.getElementById(tip).value;
        secimler.macId = '';
        secimler.ogr = '';
        secimler.okul = '';
        const ms = document.getElementById('aktifMac'); if (ms) ms.value = '';
        secimleriKaydet();
        if(secimler.taraf) ogrencileriYukle();
        canliJuriTakibiBaslat();
    }

    function katSec(btn, kategori, modul) {
        secimler.kategori = kategori;
        secimler.hukOkul = '';
        secimler.muhOkul = '';
        secimler.taraf = '';
        secimler.ogr = '';
        secimler.okul = '';
        secimler.macId = '';
        const oturum = juriOturumuGetir();
        if (oturum) { secimler.juri = oturum.juri; secimler.juriAd = oturum.ad; }
        secimleriKaydet();
        if(modul === 'puanlama') renderPuanlamaSecim();
        if(modul === 'ogrenci') renderOgrenci();
        if(modul === 'turnuva') renderTurnuva();
        if(modul === 'canli') renderYoneticiCanliPanel();
    }

    function ogrencileriYukle() {
        const hVal = document.getElementById('hukOkul')?.value || secimler.hukOkul;
        const mVal = document.getElementById('muhOkul')?.value || secimler.muhOkul;
        if(!secimler.taraf) return;
        const seciliOkulAd = secimler.taraf === 'HÜKÜMET' ? hVal : mVal;
        secimler.hukOkul = hVal;
        secimler.muhOkul = mVal;
        secimler.okul = seciliOkulAd;
        secimleriKaydet();
        const alan = document.getElementById('ogrenciButonAlani');
        if(!alan) return;
        if(!seciliOkulAd) {
            alan.innerHTML = '<div style="grid-column: span 2; text-align:center; color:var(--text-muted); font-style:italic;">Seçilen tarafa ait okul belirlenmemiş!</div>';
            return;
        }
        alan.innerHTML = '<div style="grid-column: span 2; text-align:center;">Öğrenciler getiriliyor...</div>';
        db.ref('okullar/' + secimler.kategori + '/' + seciliOkulAd).once('value', (s) => {
            alan.innerHTML = '';
            let sayac = 1;
            s.forEach(o => {
                const rRol = sayac <= 3 ? sayac + '. Konuşmacı' : 'Grup Sözcüsü';
                const btnText = `${o.val()} (${rRol})`;
                const activeClass = secimler.ogr === btnText ? 'btn-active' : '';
                const b = document.createElement('button');
                b.className = `btn ogr-btn ${activeClass}`;
                b.textContent = btnText;
                b.onclick = () => tekSecim(b, 'ogr', 'ogr-btn');
                alan.appendChild(b);
                sayac++;
            });
            canliJuriTakibiBaslat();
        });
    }

    function tekSecim(element, tip, sinif) {
        document.querySelectorAll('.' + sinif).forEach(b => b.classList.remove('btn-active'));
        element.classList.add('btn-active');
        secimler[tip] = element.innerText;
        if(tip === 'taraf') {
            secimler.ogr = '';
            ogrencileriYukle();
        }
        secimleriKaydet();
        canliJuriTakibiBaslat();
    }

    function mevcutMacBilgisi() {
        const huk = document.getElementById('hukOkul')?.value || secimler.hukOkul;
        const muh = document.getElementById('muhOkul')?.value || secimler.muhOkul;
        if (!huk || !muh) return null;
        const id = secimler.macId || macKimligiOlustur(secimler.kategori, huk, muh);
        return { id, hukOkul:huk, muhOkul:muh, etiket:macEtiketi(huk,muh) };
    }

    function canliJuriTakibiBaslat() {
        if (aktifJuriListenerRef) { aktifJuriListenerRef.off(); aktifJuriListenerRef = null; }
        if (aktifJuriMacListenerRef) { aktifJuriMacListenerRef.off(); aktifJuriMacListenerRef = null; }
        const box = document.getElementById('canliJuriDurumu');
        if (!box) return;
        const mac = mevcutMacBilgisi();
        if (!mac) { box.innerHTML = 'Canlı jüri durumu için iki okulu seçiniz.'; return; }
        let sonKayitlar = [];
        let sonMac = {durum:'acik'};
        const render = () => {
            const macKayitlari = sonKayitlar.filter(v => kayitMacId(v) === mac.id);
            const gruplar = new Map();
            macKayitlari.forEach(v => {
                const k = ogrenciGrupKimligi(v);
                if (!gruplar.has(k)) gruplar.set(k, new Set());
                if (v.secim?.juri) gruplar.get(k).add(v.secim.juri);
            });
            const tam = [...gruplar.values()].filter(s=>BEKLENEN_JURILER.every(j=>s.has(j))).length;
            let ogrHtml = '<span style="color:var(--text-muted);">Öğrenci seçilmedi.</span>';
            if (secimler.ogr && secimler.okul) {
                const ogrKisa = secimler.ogr.split(' (')[0];
                const key = [mac.id, secimler.okul, ogrKisa].map(puanMetniNormalize).join('|');
                const juriler = gruplar.get(key) || new Set();
                const eksik = BEKLENEN_JURILER.filter(j=>!juriler.has(j));
                ogrHtml = `<b>${htmlEscape(ogrKisa)}</b>: <span class="${eksik.length?'jury-missing':'jury-ok'}">${juriler.size}/3 jüri</span>${eksik.length?` · Eksik: ${htmlEscape(eksik.join(', '))}`:' · Tamamlandı'}`;
            }
            box.innerHTML = `<div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;"><b>${htmlEscape(mac.etiket)}</b><span class="${sonMac.durum==='kapali'?'jury-missing':'jury-ok'}">${sonMac.durum==='kapali'?'MAÇ KAPALI':'MAÇ AÇIK'}</span></div><div style="margin-top:8px;">${ogrHtml}</div><div style="margin-top:6px;font-size:12px;color:var(--text-muted);">Puan girilmiş öğrenci/maç: ${gruplar.size} · 3/3 tamamlanan: ${tam}</div>`;
        };
        aktifJuriListenerRef = db.ref('puanlar/' + secimler.kategori);
        aktifJuriListenerRef.on('value', s => { sonKayitlar = snapshotKayitlariniTekillestir(s); render(); });
        aktifJuriMacListenerRef = db.ref(`maclar/${secimler.kategori}/${mac.id}`);
        aktifJuriMacListenerRef.on('value', s => { sonMac = s.val() || {durum:'acik'}; render(); });
    }

    async function puanlamaSayfasinaGec() {
        const oturum = juriOturumuGetir();
        if (!oturum) return alert('Önce bu cihazı 1., 2. veya 3. jüriye kilitleyin.');
        secimler.juri = oturum.juri;
        secimler.juriAd = oturum.ad;
        if(!secimler.taraf || !secimler.juri || !secimler.ogr || !secimler.okul || !secimler.hukOkul || !secimler.muhOkul) return alert('Lütfen seçimleri eksiksiz yapın!');
        const mac = mevcutMacBilgisi();
        if (!mac) return alert('Maç bilgisi eksik.');
        if (navigator.onLine && firebaseBagli) {
            const durum = await macDurumuGetir(secimler.kategori, mac.id);
            if (durum?.durum === 'kapali') return alert('Bu maç yönetici tarafından kapatılmış. Yeni puan gönderilemez.');
        }
        verilenPuanlar = {};
        const html = `<div class="card"><h2>Puanlama Tablosu: ${htmlEscape(secimler.ogr)}</h2>
                    <div style="font-size:14px; color:var(--text-muted); margin-bottom:20px;">Kategori: <b>${htmlEscape(secimler.kategori)}</b> | Maç: <b>${htmlEscape(mac.etiket)}</b> | Okul: <b>${htmlEscape(secimler.okul)}</b> | Değerlendiren: <b>${htmlEscape(oturum.juri)} · ${htmlEscape(oturum.ad)}</b></div>
                    <div id="kriterListesi"></div>
                    <button id="btnPuanGonder" class="btn" style="background:var(--success); border:none; margin-top:25px; padding:16px; font-size:16px;" onclick="puanlariGonder()">Puanları Gönder ✓</button>
                    <button class="btn" style="background:#475569" onclick="renderPuanlamaSecim()">← Geri Dön</button></div>`;
        document.getElementById('app').innerHTML = html;
        const list = document.getElementById('kriterListesi');
        krit.forEach((k, i) => {
            const d = document.createElement('div'); d.className = 'kriter-card';
            let kutular = '';
            for(let n=1; n<=k.m; n++) kutular += `<div class="puan-btn" onclick="puanSec(this, ${i}, ${n})">${n}</div>`;
            d.innerHTML = `<span class="kriter-label">${i+1}. ${k.t} <span style="color:var(--text-muted); font-weight:normal;">(Maks: ${k.m})</span></span><div class="puan-row">${kutular}</div>`;
            list.appendChild(d);
        });
    }

    function puanSec(element, kriterIndex, puan) {
        element.parentElement.querySelectorAll('.puan-btn').forEach(x => x.classList.remove('selected'));
        element.classList.add('selected');
        verilenPuanlar[kriterIndex] = puan;
    }

    async function puanlariGonder() {
        if (puanGonderiliyor) return;
        if(Object.keys(verilenPuanlar).length < 13) return alert('Lütfen tüm 13 kriteri puanlayın!');
        const oturum = juriOturumuGetir();
        if (!oturum) return alert('Jüri oturumu kilidi bulunamadı.');
        secimler.juri = oturum.juri;
        secimler.juriAd = oturum.ad;
        const mac = mevcutMacBilgisi();
        if (!mac) return alert('Maç bilgisi eksik.');
        secimler.macId = mac.id;
        secimleriKaydet();
        const kayitId = puanKayitKimligi(secimler, mac.id);
        const btn = document.getElementById('btnPuanGonder');
        puanGonderiliyor = true;
        if (btn) { btn.disabled = true; btn.innerText = 'Gönderiliyor...'; }

        const yerelZaman = Date.now();
        const kayitTemel = {
            secim: { ...secimler, juri: oturum.juri, juriAd: oturum.ad },
            puanlar: { ...verilenPuanlar },
            macId: mac.id,
            mac: macEskiEtiketi(mac.hukOkul, mac.muhOkul),
            macEtiketi: mac.etiket,
            clientId: getClientId(),
            localUpdatedAt: yerelZaman,
            version: 3
        };

        try {
            if (!navigator.onLine || !firebaseBagli) {
                puaniKuyrugaEkle({ kategori:secimler.kategori, macId:mac.id, kayitId, kayit:{...kayitTemel, createdAt:yerelZaman, updatedAt:yerelZaman, queuedOffline:true} });
                alert('İnternet bağlantısı yok. Puan bu cihazda güvenli kuyruğa alındı; bağlantı gelince otomatik gönderilecek.');
                secimler.ogr = '';
                secimleriKaydet();
                return renderPuanlamaSecim();
            }

            await ensureMatchExists(secimler.kategori, mac.hukOkul, mac.muhOkul);
            const m = await macDurumuGetir(secimler.kategori, mac.id);
            if (m?.durum === 'kapali') return alert('Bu maç yönetici tarafından kapatılmış. Puan gönderilmedi.');

            const kategoriRef = db.ref('puanlar/' + secimler.kategori);
            const tumKayitlar = await kategoriRef.once('value');
            const eskiAyniKayitlar = [];
            tumKayitlar.forEach(c => {
                const v = c.val();
                if (!v || !v.secim || !v.puanlar) return;
                if (puanKayitKimligi(v.secim, kayitMacId(v)) === kayitId) eskiAyniKayitlar.push({ key:c.key, value:v });
            });

            if (eskiAyniKayitlar.length) {
                const ogrAd = (secimler.ogr || '').split(' (')[0];
                const onay = confirm(`${oturum.juri} tarafından ${ogrAd} için daha önce puan gönderilmiş.\n\nYeni puan önceki kaydın yerine geçecek; çift kayıt oluşturulmayacak. Devam edilsin mi?`);
                if (!onay) return;
            }

            const onceki = eskiAyniKayitlar.length ? eskiAyniKayitlar[eskiAyniKayitlar.length - 1].value : null;
            const kayit = {
                ...kayitTemel,
                createdAt: onceki?.createdAt || firebase.database.ServerValue.TIMESTAMP,
                updatedAt: firebase.database.ServerValue.TIMESTAMP,
                queuedOffline: false
            };
            const updates = {};
            updates[kayitId] = kayit;
            eskiAyniKayitlar.forEach(x => { if (x.key !== kayitId) updates[x.key] = null; });
            await kategoriRef.update(updates);
            alert(eskiAyniKayitlar.length ? 'Puan güncellendi. Önceki mükerrer kayıtlar tek kayıtta birleştirildi.' : 'Puanlar başarıyla buluta gönderildi!');
            await turnuvaAgacinaPuanYansit(secimler.kategori, mac.hukOkul, mac.muhOkul);
            secimler.ogr = '';
            secimleriKaydet();
            renderPuanlamaSecim();
        } catch (err) {
            console.error('Puan gönderme hatası:', err);
            const code = String(err?.code || '').toLowerCase();
            if (!code.includes('permission')) {
                puaniKuyrugaEkle({ kategori:secimler.kategori, macId:mac.id, kayitId, kayit:{...kayitTemel, createdAt:yerelZaman, updatedAt:yerelZaman, queuedOffline:true} });
                alert('Bağlantı sorunu nedeniyle puan yerel kuyruğa alındı. İnternet geldiğinde otomatik gönderilecek.');
                secimler.ogr = '';
                secimleriKaydet();
                renderPuanlamaSecim();
            } else {
                alert('Puan gönderilemedi: Firebase erişim yetkisi reddedildi.');
            }
        } finally {
            puanGonderiliyor = false;
            const yeniBtn = document.getElementById('btnPuanGonder');
            if (yeniBtn) { yeniBtn.disabled = false; yeniBtn.innerText = 'Puanları Gönder ✓'; }
        }
    }

    function raporVerisiniIsle(kayitlar, maclarMap) {
        const filtre = document.getElementById('macFiltre');
        const mSet = new Map();
        const ogrenciPuanlari = {};
        const okulPuanlari = {};
        const juriGruplari = {};
        kayitlar.forEach(v => {
            const mid = kayitMacId(v), ml = kayitMacEtiketi(v);
            mSet.set(mid, ml);
            const toplamPuan = puanToplami(v);
            const secim = v.secim || {};
            const ogrKisa = (secim.ogr || '').split(' (')[0];
            if(secim.ogr) {
                const temizIsim = ogrKisa + ' (' + (secim.okul || '-') + ')';
                if(!ogrenciPuanlari[temizIsim]) ogrenciPuanlari[temizIsim] = { skor:0, sayac:0 };
                ogrenciPuanlari[temizIsim].skor += toplamPuan;
                ogrenciPuanlari[temizIsim].sayac += 1;
                const gk = ogrenciGrupKimligi(v);
                if(!juriGruplari[gk]) juriGruplari[gk] = { macId:mid, mac:ml, okul:secim.okul||'-', ogrenci:ogrKisa, juriler:new Set(), toplam:0, sayac:0 };
                if(secim.juri) juriGruplari[gk].juriler.add(secim.juri);
                juriGruplari[gk].toplam += toplamPuan;
                juriGruplari[gk].sayac += 1;
            }
            if(secim.okul) {
                if(!okulPuanlari[secim.okul]) okulPuanlari[secim.okul]=0;
                okulPuanlari[secim.okul] += toplamPuan;
            }
        });
        if(filtre) {
            [...mSet.entries()].sort((a,b)=>a[1].localeCompare(b[1],'tr')).forEach(([id,lbl])=>filtre.innerHTML += `<option value="${htmlEscape(id)}">${htmlEscape(lbl)}</option>`);
        }
        const siraliList = Object.keys(ogrenciPuanlari).map(isim=>({isim,ortalama:Number((ogrenciPuanlari[isim].skor/ogrenciPuanlari[isim].sayac).toFixed(1)),juriSayisi:ogrenciPuanlari[isim].sayac})).sort((a,b)=>b.ortalama-a.ortalama);
        const podium=document.getElementById('mvp-podium');
        if(siraliList.length){podium.innerHTML=''; for(let i=0;i<Math.min(3,siraliList.length);i++) podium.innerHTML += `<div class="summary-row"><span class="summary-name">${htmlEscape(siraliList[i].isim.split(' (')[0])}</span><span class="summary-score">${siraliList[i].ortalama.toFixed(1)} Ort.</span></div>`;} else podium.innerHTML='Veri yok.';
        const siraliOkullar=Object.keys(okulPuanlari).map(oAd=>({isim:oAd,toplam:okulPuanlari[oAd]})).sort((a,b)=>b.toplam-a.toplam);
        const schoolBoard=document.getElementById('school-leaderboard');
        if(siraliOkullar.length){schoolBoard.innerHTML=''; siraliOkullar.forEach((x,i)=>schoolBoard.innerHTML += `<div class="summary-row"><span class="summary-name">${i+1}. ${htmlEscape(x.isim)}</span><span class="summary-score">${x.toplam} Puan</span></div>`);} else schoolBoard.innerHTML='Veri yok.';
        const juriRows=Object.values(juriGruplari).sort((a,b)=>(a.mac+a.okul+a.ogrenci).localeCompare(b.mac+b.okul+b.ogrenci,'tr'));
        const tamSayisi=juriRows.filter(x=>BEKLENEN_JURILER.every(j=>x.juriler.has(j))).length;
        const eksikSayisi=juriRows.length-tamSayisi;
        const metrics=document.getElementById('adminMetrics');
        if(metrics) metrics.innerHTML=`<div class="admin-metric"><span>Tekil Puan Kaydı</span><strong>${kayitlar.length}</strong></div><div class="admin-metric"><span>Puanlanan Öğrenci/Maç</span><strong>${juriRows.length}</strong></div><div class="admin-metric"><span>3/3 Jüri Tamam</span><strong>${tamSayisi}</strong></div><div class="admin-metric"><span>Jürisi Eksik</span><strong>${eksikSayisi}</strong></div>`;
        const coverage=document.getElementById('juryCoverage');
        if(coverage){let html='<table class="tutanak-table"><tr><th>Maç</th><th>Okul</th><th>Öğrenci</th><th>Jüri Durumu</th><th>Eksik Jüri</th><th>Ortalama</th></tr>'; juriRows.forEach(x=>{const eksikler=BEKLENEN_JURILER.filter(j=>!x.juriler.has(j)); const tam=!eksikler.length; const ort=x.sayac?(x.toplam/x.sayac).toFixed(1):'-'; html += `<tr><td>${htmlEscape(x.mac)}</td><td>${htmlEscape(x.okul)}</td><td>${htmlEscape(x.ogrenci)}</td><td class="${tam?'jury-ok':'jury-missing'}">${x.juriler.size}/3</td><td>${tam?'—':htmlEscape(eksikler.join(', '))}</td><td>${ort}</td></tr>`;}); coverage.innerHTML=html+'</table>';}
        sonRaporVerisi={kategori:secimler.kategori,kayitlar,juriRows,siraliList,siraliOkullar,maclarMap};
        tutanakTablosuDoldur();
    }

        const juriRows=sonRaporVerisi.juriRows.map(x=>{const eksikler=BEKLENEN_JURILER.filter(j=>!x.juriler.has(j)); return {'Maç ID':x.macId,'Maç':x.mac,'Okul':x.okul,'Öğrenci':x.ogrenci,'Jüri Sayısı':x.juriler.size,'Tamamlayan Jüriler':[...x.juriler].join(', '),'Eksik Jüriler':eksikler.join(', '),'Ortalama':x.sayac?Number((x.toplam/x.sayac).toFixed(1)):''};});
        const okulRows=sonRaporVerisi.siraliOkullar.map((x,i)=>({'Sıra':i+1,'Okul':x.isim,'Toplam Puan':x.toplam}));
        const mvpRows=sonRaporVerisi.siraliList.map((x,i)=>({'Sıra':i+1,'Öğrenci':x.isim.split(' (')[0],'Okul':(x.isim.match(/\((.*)\)$/)||[])[1]||'','Ortalama':x.ortalama,'Jüri Kaydı':x.juriSayisi}));

        const tarih=new Date().toISOString().slice(0,10); XLSX.writeFile(wb,`Munazara_Sonuclari_${sonRaporVerisi.kategori}_${tarih}.xlsx`);
    }

    function skorEslesmeAnahtari(ad) {
        return puanMetniNormalize(ad).replace(/\s+/g, ' ').toLocaleLowerCase('tr-TR');
    }

    function okulCiftiEslesiyor(a,b,c,d) {
        const aa=skorEslesmeAnahtari(a), bb=skorEslesmeAnahtari(b);
        const cc=skorEslesmeAnahtari(c), dd=skorEslesmeAnahtari(d);
        return !!aa && !!bb && ((aa===cc && bb===dd) || (aa===dd && bb===cc));
    }

    function sureyiMetneDonustur(saniye) {
        if (!Number.isFinite(Number(saniye)) || saniye === null || saniye === undefined) return '—';
        const n=Math.max(0,Math.floor(Number(saniye)));
        return `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`;
    }

    function sureMetniniCoz(metin) {
        const s=String(metin || '').trim();
        if (!/^\d{1,3}:[0-5]\d$/.test(s)) return null;
        const [dakika,saniye]=s.split(':').map(Number);
        const toplam=dakika*60+saniye;
        return Number.isSafeInteger(toplam) && toplam>0 && toplam<=359999 ? toplam : null;
    }

    let aktifSureModal=null;
    let sureTickTimer=null;
    let sureTiklayanTaraf=0;
    let sureBaslangicAni=0;
    let sureTabanSaniye=0;

    function sureAktifSayaciDurdur() {
        if (!sureTiklayanTaraf) return;
        const saniye=sureTabanSaniye+Math.floor((performance.now()-sureBaslangicAni)/1000);
        const input=document.getElementById(`sureTakim${sureTiklayanTaraf}`);
        if (input) input.value=sureyiMetneDonustur(saniye);
        sureTiklayanTaraf=0;
        if (sureTickTimer) clearInterval(sureTickTimer);
        sureTickTimer=null;
        const a=document.getElementById('sureBaslat1'),b=document.getElementById('sureBaslat2');
        if(a)a.textContent='▶ Başlat'; if(b)b.textContent='▶ Başlat';
    }

    function sureSayaçGuncelle() {
        if (!sureTiklayanTaraf) return;
        const saniye=sureTabanSaniye+Math.floor((performance.now()-sureBaslangicAni)/1000);
        const input=document.getElementById(`sureTakim${sureTiklayanTaraf}`);
        if (input) input.value=sureyiMetneDonustur(saniye);
    }

    function sureSayaciniDegistir(taraf) {
        if (!aktifSureModal) return;
        if (sureTiklayanTaraf===taraf) return sureAktifSayaciDurdur();
        if (sureTiklayanTaraf) return alert('Önce diğer takımın sayacını duraklatın.');
        const input=document.getElementById(`sureTakim${taraf}`);
        const eski=sureMetniniCoz(input?.value);
        if (eski === null && input?.value !== '00:00') return alert('Süre biçimi DD:SS olmalı. Örnek: 14:35');
        sureTabanSaniye=eski || 0;
        sureBaslangicAni=performance.now();
        sureTiklayanTaraf=taraf;
        const btn=document.getElementById(`sureBaslat${taraf}`);
        if(btn)btn.textContent='⏸ Duraklat';
        sureTickTimer=setInterval(sureSayaçGuncelle,250);
    }

    function sureModalKapat() {
        sureAktifSayaciDurdur();
        aktifSureModal=null;
        const host=document.getElementById('sureModalHost');
        if(host) host.innerHTML='';
    }

    async function sureModalAc(kategori, macId) {
        if (!adminYetkiliMi()) return alert('Yönetici yetkisi gerekiyor.');
        if (!navigator.onLine || !firebaseBagli) return alert('Süre kaydı için Firebase bağlantısı gerekli.');

        sureModalKapat();
        aktifSureModal={kategori,macId,mac:m,oncekiGuncelleme:m.sureEsitlik?.updatedAt || 0};

        const host=document.getElementById('sureModalHost');
        if(!host)return;
        host.innerHTML=`<div class="sure-modal-bg" role="dialog" aria-modal="true" aria-label="Konuşma süresi kaydı">

              <div class="sure-team"><strong>${htmlEscape(m.muhOkul)} (Muhalefet)</strong><input id="sureTakim2" inputmode="numeric" aria-label="Muhalefet süresi" value="${sureyiMetneDonustur(b)}" placeholder="00:00"><button id="sureBaslat2" class="btn" style="margin:0" onclick="sureSayaciniDegistir(2)">▶ Başlat</button></div>

    async function sureFirebaseKaydet() {
        if (!aktifSureModal || !adminYetkiliMi() || !navigator.onLine || !firebaseBagli) return alert('Süreler ancak çevrimiçi yönetici tarafından kaydedilebilir.');
        sureAktifSayaciDurdur();
        const huk=sureMetniniCoz(document.getElementById('sureTakim1')?.value);
        const muh=sureMetniniCoz(document.getElementById('sureTakim2')?.value);
        if (huk===null || muh===null) return alert('Her iki takımın süresini DD:SS biçiminde ve sıfırdan büyük girin.');
        const {kategori,macId,mac,oncekiGuncelleme}=aktifSureModal;
        try {
            const r=await db.ref(`maclar/${kategori}/${macId}`).transaction(cur=>{
                if (!cur || cur.durum==='kapali' || skorEslesmeAnahtari(cur.hukOkul)!==skorEslesmeAnahtari(mac.hukOkul) || skorEslesmeAnahtari(cur.muhOkul)!==skorEslesmeAnahtari(mac.muhOkul)) return;
                if ((cur.sureEsitlik?.updatedAt || 0)!==oncekiGuncelleme) return;
                cur.sureEsitlik={hukOkul:cur.hukOkul,muhOkul:cur.muhOkul,hukSaniye:huk,muhSaniye:muh,updatedAt:Date.now()};
                cur.updatedAt=Date.now();
                return cur;
            },undefined,false);
            if (!r.committed) return alert('Süre kaydı başka cihazda değişti veya maç kapatıldı. Son veriyi açarak kontrol edin.');
            sureModalKapat();
            alert('Toplam konuşma süreleri Firebase’e kaydedildi.');
        } catch(err) { alert('Süreler kaydedilemedi: '+(err?.message||err)); }
    }

    function macTamamlamaOzeti(kayitlar, macId, m, okullar) {
        const secimlerMac=kayitlar.filter(v=>kayitMacId(v)===macId);
        const key=(okul,ogr)=>`${skorEslesmeAnahtari(okul)}|${skorEslesmeAnahtari(ogr)}`;
        const gruplar=new Map();
        for (const v of secimlerMac) {
            const s=v.secim||{};
            const k=key(s.okul,(s.ogr||'').split(' (')[0]);
            if(!gruplar.has(k)) gruplar.set(k,new Map());
            gruplar.get(k).set(s.juri,v);
        }
        const beklenen=[];
        for (const okul of [m.hukOkul,m.muhOkul]) {
            for (const ogr of (okullar[okul]||[])) beklenen.push({okul,ogr,key:key(okul,ogr)});
        }
        const sorunlar=[];
        if (!m.hukOkul || !m.muhOkul) sorunlar.push('İki okul tanımlı değil.');
        if (!(okullar[m.hukOkul]||[]).length || !(okullar[m.muhOkul]||[]).length) sorunlar.push('Her iki okulun öğrenci listesi de kayıtlı olmalı.');
        const expectedKeys=new Set();
        for(const e of beklenen) {
            if(expectedKeys.has(e.key)) sorunlar.push(`Öğrenci ismi aynı okulda yineleniyor: ${e.ogr}`);
            expectedKeys.add(e.key);
        }
        const eksikler=new Set();
        let tam=0;
        const toplamlar={[m.hukOkul]:0,[m.muhOkul]:0};
        for (const e of beklenen) {
            const j=gruplar.get(e.key) || new Map();
            const fehl=BEKLENEN_JURILER.filter(role=>!j.has(role));
            fehl.forEach(role=>eksikler.add(role));
            if(fehl.length) { sorunlar.push(`${e.okul} / ${e.ogr}: eksik ${fehl.join(', ')}`);continue; }
            let good=true;
            for(const role of BEKLENEN_JURILER) {
                const v=j.get(role);
                if(!krit.every((k,i)=>{const p=Number(v?.puanlar?.[i]??v?.puanlar?.[String(i)]);return Number.isInteger(p)&&p>=1&&p<=k.m;})) {
                    good=false; sorunlar.push(`${e.okul} / ${e.ogr}: ${role} puanları eksik veya geçersiz.`);
                } else toplamlar[e.okul] += puanToplami(v);
            }
            if(good)tam++;
        }
        for(const [k,j] of gruplar) {
            if(!expectedKeys.has(k)) sorunlar.push(`Kayıtlı öğrenci listesinde olmayan puan kaydı: ${k}`);
            for(const role of j.keys()) if(!BEKLENEN_JURILER.includes(role)) sorunlar.push(`Geçersiz jüri numarası: ${role}`);
        }
        const ready=beklenen.length>0 && sorunlar.length===0;
        return {ready,toplamlar,tam,eksik:beklenen.length-tam,total:beklenen.length,eksikRoller:[...eksikler],sorunlar};
    }

    function canliPaneliCiz(skorlar, maclar, okullar) {
        const inferred={...maclar};
        skorlar.forEach(v=>{const id=kayitMacId(v);if(!inferred[id])inferred[id]={id,etiket:kayitMacEtiketi(v),hukOkul:v.secim?.hukOkul||'',muhOkul:v.secim?.muhOkul||'',durum:'acik'};});
        const rows=[];
        Object.entries(inferred).forEach(([id,m])=>{

            if(m.sonuc?.kazanan && m.durum==='kapali') durumText=`Galip: ${m.sonuc.kazanan}`;
            else if(g.ready) durumText=huk!==muh?'Puanla galip belirlenebilir': (sure?.hukSaniye>0 && sure?.muhSaniye>0 ? (sure.hukSaniye!==sure.muhSaniye?'Süre üstünlüğü hazır':'Son savunma gerekli') : 'BERABERLİK — süre girin');
            rows.push({id,m,...g,huk,muh,durumText});
        });
        rows.sort((a,b)=>(a.m.etiket||'').localeCompare(b.m.etiket||'','tr'));
        const metrics=document.getElementById('liveMetrics');
        if(metrics){const acik=rows.filter(r=>r.m.durum!=='kapali').length;const kapali=rows.length-acik;const tamMac=rows.filter(r=>r.ready).length;const q=Object.keys(offlineKuyrukGetir()).length;metrics.innerHTML=`<div class="admin-metric"><span>Maç</span><strong>${rows.length}</strong></div><div class="admin-metric"><span>Açık / Kapalı</span><strong>${acik}/${kapali}</strong></div><div class="admin-metric"><span>Jürisi Tam Maç</span><strong>${tamMac}</strong></div><div class="admin-metric"><span>Bu Cihaz Kuyruğu</span><strong>${q}</strong></div>`;}
        const div=document.getElementById('liveMatches');if(!div)return;
        let html='<table class="tutanak-table"><tr><th>Maç</th><th>Durum</th><th>3/3 Tam</th><th>Puan (H / M)</th><th>Süre (H / M)</th><th>Sonuç</th><th>İşlem</th></tr>';
        rows.forEach(r=>{
            const kap=r.m.durum==='kapali',sure=r.m.sureEsitlik;
            const state=r.m.sonuc?.senkronDurum==='tamam'?'Eşitlendi':(kap?'Senkron bekliyor':'Açık');
            html += `<tr><td>${htmlEscape(r.m.etiket||macEtiketi(r.m.hukOkul,r.m.muhOkul))}</td><td class="${kap?'jury-missing':'jury-ok'}">${kap?'KAPALI':'AÇIK'}<div style="font-size:10px">${state}</div></td><td class="${r.ready?'jury-ok':'jury-missing'}">${r.tam}/${r.total}${r.eksik?`<div style="font-size:10px">${htmlEscape(r.eksikRoller.join(', '))}</div>`:''}</td><td class="sure-skor">${r.huk} / ${r.muh}</td><td class="sure-skor">${sure?.hukSaniye!=null?sureyiMetneDonustur(sure.hukSaniye):'—'} / ${sure?.muhSaniye!=null?sureyiMetneDonustur(sure.muhSaniye):'—'}</td><td style="font-size:11px">${htmlEscape(r.durumText)}</td><td><button class="btn" style="padding:7px;margin:3px 0;background:#0369a1" ${kap?'disabled':''} onclick="sureModalAc('${secimler.kategori}','${r.id}')">⏱ Süreler</button><button class="btn" style="padding:7px;margin:3px 0;background:${kap?'#0f766e':'#b91c1c'}" onclick="macDurumuDegistir('${secimler.kategori}','${r.id}','${kap?'acik':'kapali'}')">${kap?'Maçı Yeniden Aç':'Sonucu Kesinleştir / Kapat'}</button>${kap&&r.m.sonuc?.senkronDurum!=='tamam'?`<button class="btn" style="padding:7px;margin:3px 0;background:#a16207" onclick="macEsitlemeyiTekrarDene('${secimler.kategori}','${r.id}')">☁ Senkronu Onar</button>`:''}</td></tr>`;
        });
        div.innerHTML=html+'</table>';
    }

    // Yönetici paneli başka bilgisayarda açıkken de takımların dinamik olarak
    // çözümlenebilmesi için fikstürün aynı-origin iframe hesaplayıcısını kullanır.
    let gizliFiksturFrame=null;
    let sonFiksturMacListesi=[];
    async function fiksturEslesmesiniBul(kategori,hukOkul,muhOkul) {
        const tumFrame=document.getElementById('turnuvaFiksturFrame');
        let frame=tumFrame || gizliFiksturFrame;
        if(!frame) {
            frame=document.createElement('iframe');
            frame.id='fiksturGizliEslesme';
            frame.title='Fikstür eşleşme doğrulaması';
            frame.style.cssText='display:none;';
            document.body.appendChild(frame);
            gizliFiksturFrame=frame;
            frame.srcdoc=base64Utf8Coz(TURNUVA_FIKSTUR_B64);
        }
        let liste=null;
        for(let i=0;i<80;i++) {
            try { liste=frame.contentWindow?.fiksturTumMaclariGetir?.(); } catch(_) {}
            if(liste) break;
            await new Promise(resolve=>setTimeout(resolve,150));
        }
        if(!liste) throw new Error('Firebase fikstürü henüz açılamadı. Turnuva Ağacı ekranını bir kez açıp internet bağlantısını kontrol edin.');
        sonFiksturMacListesi=liste;
        const cat=kategori==='LİSE'?'lise':'ortaokul';
        const found=liste.filter(m=>!m.isBay && m.cat===cat && okulCiftiEslesiyor(m.team1,m.team2,hukOkul,muhOkul));
        if(found.length!==1) throw new Error(found.length?'Fikstürde bu iki okulun birden çok eşleşmesi var. Otomatik sonuç güvenli şekilde eşlenemedi.':'Fikstürde bu iki okulun geçerli eşleşmesi bulunamadı. Okul adlarının fikstürdekiyle aynı olduğundan ve önceki tur galiplerinin seçildiğinden emin olun.');
        return found[0];
    }

    async function macSonucunuHesapla(kategori,macId,m,fixture) {
        const [pSnap,oSnap,fSnap]=await Promise.all([
            db.ref('puanlar/'+kategori).once('value'),
            db.ref('okullar/'+kategori).once('value'),
            db.ref('fikstur/tekSalon_2026_2027').once('value')
        ]);
        const okullar={};oSnap.forEach(c=>{okullar[c.key]=[];c.forEach(x=>okullar[c.key].push(String(x.val())));});
        const data=macTamamlamaOzeti(snapshotKayitlariniTekillestir(pSnap),macId,m,okullar);
        if(!data.ready) throw new Error(`3/3 jüri ve öğrenci listesi tamamlanmadan maç kapatılamaz.\n${data.sorunlar.slice(0,6).join('\n')}${data.sorunlar.length>6?'\n...':''}`);
        const huk=Number(data.toplamlar[m.hukOkul]||0),muh=Number(data.toplamlar[m.muhOkul]||0);
        let kazanan='',yontem='puan';
        if(huk>muh)kazanan=m.hukOkul;
        else if(muh>huk)kazanan=m.muhOkul;
        else {
            const s=m.sureEsitlik||{};
            if(skorEslesmeAnahtari(s.hukOkul)!==skorEslesmeAnahtari(m.hukOkul) || skorEslesmeAnahtari(s.muhOkul)!==skorEslesmeAnahtari(m.muhOkul) || !Number.isInteger(s.hukSaniye) || !Number.isInteger(s.muhSaniye) || s.hukSaniye<=0 || s.muhSaniye<=0)
                throw new Error('Jüri puanları eşit. Önce iki takımın toplam konuşma süresini ⏱ Süreler modülünden Firebase’e kaydedin.');
            if(s.hukSaniye<s.muhSaniye){kazanan=m.hukOkul;yontem='sure';}
            else if(s.muhSaniye<s.hukSaniye){kazanan=m.muhOkul;yontem='sure';}
            else {
                const f=fSnap.val();
                const manuel=f?.winnerSources?.[fixture.no];
                const manuelGalip=f?.winners?.[fixture.no];
                if(manuel?.source!=='manuel' || ![m.hukOkul,m.muhOkul].some(n=>skorEslesmeAnahtari(n)===skorEslesmeAnahtari(manuelGalip)))
                    throw new Error('Hem puan hem konuşma süreleri eşit. Son savunmanın ardından Turnuva Ağacı → Fikstür Yönetimi ekranında bu maçın galibini manuel seçin; ardından Maçı Kapat işlemini tekrarlayın.');
                kazanan=[m.hukOkul,m.muhOkul].find(n=>skorEslesmeAnahtari(n)===skorEslesmeAnahtari(manuelGalip));
                yontem='son_savunma';
            }
        }
        const oncekiSecim=fSnap.val()?.winners?.[fixture.no];
        if (oncekiSecim && skorEslesmeAnahtari(oncekiSecim)!==skorEslesmeAnahtari(kazanan))
            throw new Error('Fikstürde daha önce ters yönde manuel galip seçilmiş. Önce Turnuva Ağacı ekranından bu seçimi temizleyin; yanlış galip otomatik ezilmeyecek.');
        return {kazanan,yontem,puanHuk:huk,puanMuh:muh,maglup:kazanan===m.hukOkul?m.muhOkul:m.hukOkul,sureHuk:m.sureEsitlik?.hukSaniye ?? null,sureMuh:m.sureEsitlik?.muhSaniye ?? null,macNo:fixture.no,kategori,macId,createdAt:Date.now(),senkronDurum:'bekliyor'};
    }

    async function fiksturSonucunuEsitle(kategori,macId,m,sonuc,fixture) {
        const ref=db.ref('fikstur/tekSalon_2026_2027');
        const applied=await ref.transaction(cur=>{
            if(!cur || !cur.juries || !cur.topics) return;
            const onceki=cur.finalizedMatches?.[fixture.no];
            if(onceki && onceki.macId!==macId) return;
            const secili=cur.winners?.[fixture.no] || null;
            if (secili && skorEslesmeAnahtari(secili)!==skorEslesmeAnahtari(sonuc.kazanan)) return;
            if(sonuc.yontem==='son_savunma' && cur.winnerSources?.[fixture.no]?.source!=='manuel' && !onceki) return;
            cur.winners=cur.winners||{};
            cur.winnerSources=cur.winnerSources||{};
            cur.finalizedMatches=cur.finalizedMatches||{};
            cur.winners[fixture.no]=sonuc.kazanan;
            cur.winnerSources[fixture.no]={source:sonuc.yontem,updatedAt:Date.now(),macId};
            cur.finalizedMatches[fixture.no]={macId,kategori,kazanan:sonuc.kazanan,yontem:sonuc.yontem,puanHuk:sonuc.puanHuk,puanMuh:sonuc.puanMuh,sureHuk:sonuc.sureHuk,sureMuh:sonuc.sureMuh,closedAt:Date.now()};
            cur.updatedAt=Date.now();cur.sonIslem='juriSonucuKesinlestir';
            return cur;
        },undefined,false);
        if(!applied.committed) throw new Error('Fikstürde farklı bir galip veya kesinleşmiş sonuç var. Otomatik üzerine yazılmadı; yönetici kontrolü gerekli.');
    }

    async function merkeziAgacaKesinSonucuYaz(kategori,macId,m,sonuc) {
        let eslesti=false;
        const r=await turnuvaRef(kategori).transaction(state=>{
            state=state || {};
            state.fiksturSonuclari=state.fiksturSonuclari || {};
            state.fiksturSonuclari[sonuc.macNo]={macNo:sonuc.macNo,macId,galip:sonuc.kazanan,okul1:m.hukOkul,okul2:m.muhOkul,puan1:sonuc.puanHuk,puan2:sonuc.puanMuh,yontem:sonuc.yontem,updatedAt:Date.now()};
            for(const round of Object.values(state.rounds||{})) {
                for(const entry of Object.values(round.matches||{})) {
                    if(entry.team2==='BYE' || !okulCiftiEslesiyor(entry.team1,entry.team2,m.hukOkul,m.muhOkul)) continue;
                    eslesti=true;
                    entry.score1=skorEslesmeAnahtari(entry.team1)===skorEslesmeAnahtari(m.hukOkul)?sonuc.puanHuk:sonuc.puanMuh;
                    entry.score2=skorEslesmeAnahtari(entry.team2)===skorEslesmeAnahtari(m.muhOkul)?sonuc.puanMuh:sonuc.puanHuk;
                    entry.provisionalWinner=sonuc.kazanan;
                    entry.winner=sonuc.kazanan;
                    entry.sonucYontemi=sonuc.yontem;
                    entry.updatedAt=Date.now();
                }
            }
            state.revision=(state.revision||0)+1;
            state.updatedAt=Date.now();
            return state;
        },undefined,false);
        if(!r.committed) throw new Error('Merkezî sonuç kaydı yazılamadı.');
        return eslesti?'eslestirilen_agaca_islendi':'resmi_fikstur_sonuc_listesine_islendi';
    }

    async function macSonucunuIkiAgacaYansit(kategori,macId,m,sonuc,fixture) {
        await fiksturSonucunuEsitle(kategori,macId,m,sonuc,fixture);
        const merkezDurum=await merkeziAgacaKesinSonucuYaz(kategori,macId,m,sonuc);
        await db.ref(`maclar/${kategori}/${macId}/sonuc`).update({senkronDurum:'tamam',merkeziAgac:merkezDurum,syncedAt:Date.now()});
    }

    const aktifSonucIslemleri=new Set();
    async function macEsitlemeyiTekrarDene(kategori,macId) {
        if(aktifSonucIslemleri.has(macId))return;
        if(!navigator.onLine||!firebaseBagli)return alert('Firebase bağlantısı yok.');
        aktifSonucIslemleri.add(macId);
        try {
            const s=await db.ref(`maclar/${kategori}/${macId}`).once('value');
            const m=s.val();
            if(m?.durum!=='kapali' || !m.sonuc?.kazanan)throw new Error('Kesinleştirilmiş maç sonucu bulunamadı.');
            const fixture=await fiksturEslesmesiniBul(kategori,m.hukOkul,m.muhOkul);
            if(fixture.no!==m.sonuc.macNo)throw new Error('Fikstür maç numarası değişmiş. Manuel kontrol gerekli.');
            await macSonucunuIkiAgacaYansit(kategori,macId,m,m.sonuc,fixture);
            alert('Sonuç fikstür ve merkezî ağaçla eşitlendi.');
        }catch(err){alert('Senkron onarılamadı: '+(err?.message||err));}
        finally{aktifSonucIslemleri.delete(macId);}
    }

    async function macDurumuDegistir(kategori,macId,yeniDurum) {
        if(!adminYetkiliMi())return alert('Yönetici yetkisi gerekli.');
        if(!navigator.onLine||!firebaseBagli)return alert('Maç sonuçlarını kesinleştirmek için Firebase çevrimiçi olmalıdır.');
        const lock=kategori+'|'+macId;
        if(aktifSonucIslemleri.has(lock))return;
        aktifSonucIslemleri.add(lock);
        try {
            const ref=db.ref(`maclar/${kategori}/${macId}`);
            const snap=await ref.once('value');const m=snap.val();
            if(!m?.hukOkul||!m?.muhOkul)throw new Error('Maç için iki okul bulunamadı.');
            if(yeniDurum==='kapali') {
                if(m.durum==='kapali')throw new Error('Bu maç zaten kapalı.');
                const fixture=await fiksturEslesmesiniBul(kategori,m.hukOkul,m.muhOkul);
                const sonuc=await macSonucunuHesapla(kategori,macId,m,fixture);
                if(!confirm(`${m.hukOkul}: ${sonuc.puanHuk} puan\n${m.muhOkul}: ${sonuc.puanMuh} puan\n\nGALİP: ${sonuc.kazanan}\nYÖNTEM: ${sonuc.yontem==='puan'?'Jüri puanı':sonuc.yontem==='sure'?'Daha kısa toplam konuşma süresi':'Son savunma (manuel)'}\n\nMaçı kapatıp iki turnuva ağacına kaydetmek istiyor musunuz?`))return;
                const trans=await ref.transaction(cur=>{
                    if(!cur || cur.durum==='kapali' || cur.updatedAt!==m.updatedAt || (cur.sureEsitlik?.updatedAt||0)!==(m.sureEsitlik?.updatedAt||0))return;
                    cur.durum='kapali';cur.closedAt=Date.now();cur.updatedAt=Date.now();cur.version=(cur.version||0)+1;
                    cur.sonuc=sonuc;return cur;
                },undefined,false);
                if(!trans.committed)throw new Error('Maç başka cihazda değişti. Güncel puan ve süreleri kontrol ederek tekrar deneyin.');
                try {
                    await macSonucunuIkiAgacaYansit(kategori,macId,trans.snapshot.val(),sonuc,fixture);
                    alert('Maç kapatıldı. Galip, puan/süre kuralına göre iki ağaçla eşitlendi.');
                }catch(err){alert('Maç KAPATILDI fakat ağaç senkronizasyonu tamamlanamadı: '+(err?.message||err)+'\nYönetici Canlı Panelindeki “Senkronu Onar” düğmesini kullanın.');}
            } else if(yeniDurum==='acik') {
                if(m.durum!=='kapali')return;
                const fixture=await fiksturEslesmesiniBul(kategori,m.hukOkul,m.muhOkul);
                const f=await db.ref('fikstur/tekSalon_2026_2027').once('value');
                const fikstur=f.val()||{};
                const eskiGalip=m.sonuc?.kazanan;
                const sonrakiOyunlar=sonFiksturMacListesi.filter(item=>
                    item.cat===(kategori==='LİSE'?'lise':'ortaokul') && Number(item.no)>fixture.no &&
                    [item.team1,item.team2].some(ad=>skorEslesmeAnahtari(ad)===skorEslesmeAnahtari(eskiGalip)));
                const bagimliMacVar=sonrakiOyunlar.some(item=>fikstur.winners?.[item.no] || fikstur.finalizedMatches?.[item.no]);
                const bagimliBayVar=Object.values(fikstur.bayDraws||{}).some(ad=>skorEslesmeAnahtari(ad)===skorEslesmeAnahtari(eskiGalip));
                if(bagimliMacVar || bagimliBayVar)
                    throw new Error('Bu galip üzerinden sonraki tur sonucu veya BAY kurası kaydedilmiş. Zincirleme sonuç bozulmasın diye maç otomatik açılamaz.');
                if(!confirm('Maç yeniden açılacak. Kesinleşmiş galip ve bu maça ait ağaç sonuçları temizlenecek. Devam edilsin mi?'))return;
                const fr=await db.ref('fikstur/tekSalon_2026_2027').transaction(cur=>{
                    if(!cur || cur.finalizedMatches?.[fixture.no]?.macId!==macId)return;
                    delete cur.finalizedMatches[fixture.no];
                    delete cur.winners[fixture.no];
                    if(cur.winnerSources)delete cur.winnerSources[fixture.no];
                    cur.updatedAt=Date.now();return cur;
                },undefined,false);
                if(!fr.committed)throw new Error('Fikstürde maç sonucu değişti. Otomatik yeniden açma durduruldu.');
                await turnuvaRef(kategori).transaction(state=>{
                    if(!state?.rounds)return;
                    let changed=false;
                    for(const rr of Object.values(state.rounds))for(const entry of Object.values(rr.matches||{})){
                        if(entry.team2!=='BYE' && okulCiftiEslesiyor(entry.team1,entry.team2,m.hukOkul,m.muhOkul)){
                            entry.winner='';entry.provisionalWinner='';entry.score1=null;entry.score2=null;changed=true;
                        }
                    }
                    if(!changed)return;
                    state.revision=(state.revision||0)+1;state.updatedAt=Date.now();return state;
                },undefined,false);
                await turnuvaRef(kategori).child('fiksturSonuclari/'+String(fixture.no)).remove();
                await ref.update({durum:'acik',closedAt:null,sonuc:null,updatedAt:Date.now()});
                alert('Maç yeniden açıldı; ilgili fikstür sonucu silindi.');
            }
        }catch(err){alert('İşlem tamamlanamadı: '+(err?.message||err));}
        finally{aktifSonucIslemleri.delete(lock);}
    }

    function turkceMetinDuzelt(deger) {
        let s=String(deger??'').replace(/^\uFEFF/,'').replace(/\u00A0/g,' ').normalize('NFC').trim();
        const bozukKarakterler={'Ã§':'ç','Ã‡':'Ç','ÄŸ':'ğ','Äž':'Ğ','Ä±':'ı','Ä°':'İ','Ã¶':'ö','Ã–':'Ö','ÅŸ':'ş','Åž':'Ş','Ã¼':'ü','Ãœ':'Ü','â€™':'’','â€œ':'“','â€':'”','â€“':'–','â€”':'—','Â':'','ï»¿':''};
        for(const [bozuk,dogru] of Object.entries(bozukKarakterler)) s=s.split(bozuk).join(dogru);
        return s.normalize('NFC').trim();
    }

    function csvBufferCoz(buffer) {
        const bytes=new Uint8Array(buffer);
        if(bytes.length>=3&&bytes[0]===0xEF&&bytes[1]===0xBB&&bytes[2]===0xBF)return{text:new TextDecoder('utf-8').decode(bytes),encoding:'UTF-8 BOM'};
        if(bytes.length>=2&&bytes[0]===0xFF&&bytes[1]===0xFE)return{text:new TextDecoder('utf-16le').decode(bytes),encoding:'UTF-16 LE'};
        if(bytes.length>=2&&bytes[0]===0xFE&&bytes[1]===0xFF)return{text:new TextDecoder('utf-16be').decode(bytes),encoding:'UTF-16 BE'};
        try{return{text:new TextDecoder('utf-8',{fatal:true}).decode(bytes),encoding:'UTF-8'};}catch(_){try{return{text:new TextDecoder('windows-1254').decode(bytes),encoding:'Windows-1254'};}catch(_){return{text:new TextDecoder('iso-8859-9').decode(bytes),encoding:'ISO-8859-9'};}}
    }

    function firebaseKeyTemizle(isim) { return turkceMetinDuzelt(isim).replace(/[\.\#\$\/\[\]]/g,'').trim(); }

    async function excelTopluYukle() {
        const fileInput=document.getElementById('excelDosya'); if(!fileInput.files.length)return alert('Lütfen bir Excel (.xlsx) veya CSV dosyası seçin!');
        const file=fileInput.files[0]; const reader=new FileReader();
        reader.onload=async function(e){try{const buffer=e.target.result;const ad=(file.name||'').toLocaleLowerCase('tr-TR');let workbook,algilananKodlama='';if(ad.endsWith('.csv')){const sonuc=csvBufferCoz(buffer);algilananKodlama=sonuc.encoding;workbook=XLSX.read(sonuc.text,{type:'string',raw:false});}else workbook=XLSX.read(buffer,{type:'array',cellText:true,cellDates:true});if(!workbook.SheetNames?.length)throw new Error('Dosyada çalışma sayfası bulunamadı.');const rows=XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]],{header:1,raw:false,defval:''});const yazmaIslemleri=[];let yuklemeSayisi=0,atlananSayisi=0;for(let i=1;i<rows.length;i++){const row=rows[i];if(!row||!row.length)continue;const schoolRaw=turkceMetinDuzelt(row[0]),student=turkceMetinDuzelt(row[1]),schoolName=firebaseKeyTemizle(schoolRaw);if(schoolName&&student&&schoolName.toLocaleLowerCase('tr-TR')!=='okul adı'){yazmaIslemleri.push(db.ref('okullar/'+secimler.kategori+'/'+schoolName).push(student));yuklemeSayisi++;}else if(schoolRaw||student)atlananSayisi++;}if(yuklemeSayisi){await Promise.all(yazmaIslemleri);let ekBilgi=algilananKodlama?`\nCSV kodlaması: ${algilananKodlama}`:'';if(atlananSayisi)ekBilgi+=`\nAtlanan satır: ${atlananSayisi}`;alert(`${yuklemeSayisi} adet öğrenci (${secimler.kategori}) listesine başarıyla aktarıldı!${ekBilgi}`);fileInput.value='';okulListesiniYenile();}else alert("Yüklenecek kayıt bulunamadı. Sütunların 'Okul Adı' ve 'Öğrenci Ad Soyad' sırasıyla geldiğini kontrol edin.");}catch(err){console.error('Excel/CSV aktarım hatası:',err);alert('Dosya okunurken bir hata oluştu: '+(err?.message||err));}};
        reader.onerror=()=>alert('Dosya tarayıcı tarafından okunamadı.'); reader.readAsArrayBuffer(file);
    }

    function okulListesiniYenile() {
        db.ref('okullar/'+secimler.kategori).once('value',s=>{const l=document.getElementById('okulListesi');if(!l)return;l.innerHTML='';s.forEach(o=>{const wrap=document.createElement('div');wrap.style.marginBottom='10px';const btn=document.createElement('button');btn.className='btn';btn.style='background:#1e293b;text-align:left;border-left:4px solid var(--primary);margin:0;';btn.textContent='🏫 '+o.key;const inner=document.createElement('div');inner.id='list-'+hash32(o.key);inner.style='display:none;padding:12px;background:#111827;border:1px solid var(--border-color);border-radius:0 0 10px 10px;';btn.onclick=()=>togg(o.key,inner);wrap.append(btn,inner);l.appendChild(wrap);});});
    }

    function ogrenciKaydet() { const school=turkceMetinDuzelt(document.getElementById('okulAd').value),student=turkceMetinDuzelt(document.getElementById('ogrAd').value);if(!school||!student)return alert('Lütfen alanları boş bırakmayın!');const temizOkul=firebaseKeyTemizle(school);db.ref(`okullar/${secimler.kategori}/${temizOkul}`).push(student).then(()=>{alert('Öğrenci başarıyla veritabanına kaydedildi!');document.getElementById('ogrAd').value='';okulListesiniYenile();}).catch(err=>alert('Öğrenci kaydedilemedi: '+(err?.message||err))); }
    function togg(o,d) { const durum=d.style.display;document.querySelectorAll('[id^="list-"]').forEach(el=>el.style.display='none');if(durum==='none'){d.style.display='block';ogrenciListesiniDoldur(o,d);} }
    function ogrenciListesiniDoldur(o,divElement){db.ref('okullar/'+secimler.kategori+'/'+o).once('value',s=>{divElement.innerHTML='';s.forEach(ogr=>{const row=document.createElement('div');row.style='padding:6px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1f2937;';const span=document.createElement('span');span.textContent='👤 '+ogr.val();const b=document.createElement('button');b.style='background:#ef4444;color:white;border:none;border-radius:6px;padding:4px 12px;cursor:pointer;font-weight:bold;';b.textContent='Sil';b.onclick=()=>ogrenciSil(o,ogr.key,divElement);row.append(span,b);divElement.appendChild(row);});const del=document.createElement('button');del.className='btn';del.style='background:#b91c1c;border:none;margin-top:12px;font-size:13px;padding:8px;';del.textContent='❌ Okulu ve Tüm Öğrencileri Sil';del.onclick=()=>okulKompleSil(o);divElement.appendChild(del);});}
    function ogrenciSil(okulAd,ogrKey,divElement){if(confirm('Bu öğrenciyi silmek istediğinize emin misiniz?'))db.ref(`okullar/${secimler.kategori}/${okulAd}/${ogrKey}`).remove().then(()=>ogrenciListesiniDoldur(okulAd,divElement));}
    function okulKompleSil(okulAd){if(confirm(`${okulAd} okulunu ve tüm öğrencilerini listeden tamamen silmek istediğinize emin misiniz?`))db.ref(`okullar/${secimler.kategori}/${okulAd}`).remove().then(()=>{alert('Okul tamamen temizlendi.');okulListesiniYenile();});}

    function base64Utf8Coz(b64) {
        const raw = atob(b64);
        const bytes = new Uint8Array(raw.length);
        for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
        return new TextDecoder('utf-8').decode(bytes);
    }

        dinleyicileriTemizle();

                        </div>
                        <div style="display:flex;gap:7px;flex-wrap:wrap;">
                            <button class="btn" style="width:auto;margin:0;background:var(--primary);border:none;" onclick="renderTurnuva()">📅 Fikstür Yönetimi</button>

        document.getElementById('app').innerHTML=`
            <div class="card" style="max-width:1050px;">
                <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;">

        }
        const rev=document.getElementById('turnuvaRevision'),act=document.getElementById('aktif-tur-container'),old=document.getElementById('gecmis-turlar'),champ=document.getElementById('sampiyonAlani'),next=document.getElementById('nextTurBtn');if(!act||!old||!champ||!next)return;if(!state?.rounds){act.innerHTML='<div class="kriter-card" style="text-align:center;color:var(--text-muted);">Ayrı Canlı Puan Ağacı kurulmamış. Resmî fikstürden kesinleşen sonuçlar yukarıda gösteriliyor.</div>';old.innerHTML='';champ.innerHTML='';next.style.display='none';if(rev)rev.textContent='';return;}if(rev)rev.textContent=`Revizyon: ${state.revision||0} · Son güncelleme: ${state.updatedAt?new Date(state.updatedAt).toLocaleString('tr-TR'):'-'}`;const cr=Number(state.currentRound||1);const r=state.rounds?.['r'+cr];act.innerHTML=`<h3 style="color:var(--text-main);font-size:20px;border-left:4px solid var(--accent);padding-left:8px;">Aktif Tur: ${cr}. Eleme Eşleşmeleri</h3>`;const winners=[];Object.entries(r?.matches||{}).forEach(([mk,m])=>{if(m.winner)winners.push(m.winner);if(m.team2==='BYE'){act.innerHTML += `<div class="match-box" style="border-color:var(--success);"><b style="color:var(--success);">${htmlEscape(m.team1)}</b><br><span style="color:var(--text-muted);font-size:12px;">vs</span><br><b>BYE</b><div class="win-tag">Otomatik Tur Atladı</div></div>`;return;}const status=m.winner?`<div class="win-tag">Kazanan: ${htmlEscape(m.winner)}</div>`:(m.provisionalWinner?`<div class="win-tag" style="background:#78350f;color:#fde68a;border-color:#92400e;">Geçici üstün: ${htmlEscape(m.provisionalWinner)} · Maçı kapatınca kesinleşir</div>`:'');act.innerHTML += `<div class="match-box"><div style="font-size:10px;color:var(--text-muted);margin-bottom:6px;">${htmlEscape(m.macId)}</div><div class="match-team" style="border-bottom:1px solid #1f2937;padding-bottom:6px;"><span><b>${htmlEscape(m.team1)}</b></span><input type="number" class="skor-input" id="ts-${cr}-${mk}-1" value="${m.score1??''}" onchange="turnuvaManuelSkorKaydet('${'r'+cr}','${mk}')"></div><div style="text-align:center;margin:4px 0;font-size:11px;color:var(--text-muted);font-weight:bold;letter-spacing:1px;">VS</div><div class="match-team" style="border-top:1px solid #1f2937;padding-top:6px;"><span><b>${htmlEscape(m.team2)}</b></span><input type="number" class="skor-input" id="ts-${cr}-${mk}-2" value="${m.score2??''}" onchange="turnuvaManuelSkorKaydet('${'r'+cr}','${mk}')"></div>${status}</div>`;});
        const matchCount=Object.keys(r?.matches||{}).length;const tamam=matchCount>0&&Object.values(r.matches).every(m=>!!m.winner);if(state.champion){champ.innerHTML=`<div class="champ-card">🏆 ${htmlEscape(secimler.kategori)} ŞAMPİYONU: ${htmlEscape(state.champion)} 🏆</div>`;next.style.display='none';}else{champ.innerHTML='';next.style.display=tamam?'block':'none';}
        old.innerHTML='';for(let n=cr-1;n>=1;n--){const rr=state.rounds?.['r'+n];if(!rr)continue;let h=`<div class="old-tur"><h4 style="color:var(--text-muted);margin-bottom:10px;">${n}. Tur Sonuç Arşivi</h4>`;Object.values(rr.matches||{}).forEach(m=>{h += `<div class="match-box" style="opacity:.75;"><div>${htmlEscape(m.team1)} <span style="color:var(--accent);">(${m.score1??'-'})</span></div><div>${htmlEscape(m.team2)} <span style="color:var(--accent);">(${m.score2??'-'})</span></div><div style="font-size:11px;color:var(--success);margin-top:5px;font-weight:bold;">→ ${htmlEscape(m.winner||'Sonuç yok')}</div></div>`;});old.innerHTML += h+'</div>';}
    }

    async function ilkTuruKur(){const ta=document.getElementById('takimlar');let t=(ta?.value||'').split('\n').map(x=>x.trim()).filter(Boolean);if(t.length<2)return alert('Turnuvayı başlatmak için en az 2 okul bulunmalıdır!');const current=await turnuvaRef().once('value');if(current.exists()&&!confirm('Mevcut merkezi turnuva ağacı var. Yeni turnuva kurarsanız mevcut ağaç arşivlenip yenisi oluşturulacak. Devam edilsin mi?'))return;if(current.exists())await db.ref(`arsiv/turnuva/${secimler.kategori}/${Date.now()}`).set(current.val());t=t.map(x=>({x,r:Math.random()})).sort((a,b)=>a.r-b.r).map(o=>o.x);const round=roundOlustur(secimler.kategori,1,t);const state={version:3,revision:(current.val()?.revision||0)+1,status:'active',currentRound:1,rounds:{r1:round},champion:'',teams:t,fiksturSonuclari:current.val()?.fiksturSonuclari||{},createdAt:Date.now(),updatedAt:Date.now()};await turnuvaRef().set(state);await roundMaclariniKaydet(secimler.kategori,round);firebaseArsivYedegiAl(true,'turnuva_baslangic');}

    async function turnuvaManuelSkorKaydet(roundKey,matchKey){const stateSnap=await turnuvaRef().once('value');const cur=stateSnap.val();const turNo=Number(roundKey.replace('r',''));const s1=parseFloat(document.getElementById(`ts-${turNo}-${matchKey}-1`)?.value),s2=parseFloat(document.getElementById(`ts-${turNo}-${matchKey}-2`)?.value);await turnuvaRef().transaction(state=>{if(!state?.rounds?.[roundKey]?.matches?.[matchKey])return state;const m=state.rounds[roundKey].matches[matchKey];m.score1=Number.isFinite(s1)?s1:null;m.score2=Number.isFinite(s2)?s2:null;m.provisionalWinner='';m.winner='';if(Number.isFinite(s1)&&Number.isFinite(s2)){if(s1>s2)m.winner=m.team1;else if(s2>s1)m.winner=m.team2;}m.updatedAt=Date.now();state.revision=(state.revision||0)+1;state.updatedAt=Date.now();return state;});}

    async function turnuvaAgacinaPuanYansit(kat,hukOkul,muhOkul,forceFinalize=false) {
        if(!hukOkul||!muhOkul)return;
        const id=macKimligiOlustur(kat,hukOkul,muhOkul);
        const [s,mSnap]=await Promise.all([db.ref('puanlar/'+kat).once('value'),db.ref(`maclar/${kat}/${id}`).once('value')]);
        const mc=mSnap.val() || {};
        let tHuk=0,tMuh=0;
        snapshotKayitlariniTekillestir(s).forEach(v=>{
            if(kayitMacId(v)!==id)return;
            const t=puanToplami(v);
            if(v.secim?.okul===hukOkul)tHuk+=t;
            if(v.secim?.okul===muhOkul)tMuh+=t;
        });
        const finalized=mc.durum==='kapali' && mc.sonuc?.kazanan && mc.sonuc?.senkronDurum==='tamam';
        await turnuvaRef(kat).transaction(state=>{
            if(!state?.rounds)return;
            let changed=false;
            for(const rr of Object.values(state.rounds))for(const m of Object.values(rr.matches||{})){
                if(m.team2==='BYE' || !okulCiftiEslesiyor(m.team1,m.team2,hukOkul,muhOkul))continue;
                m.score1=skorEslesmeAnahtari(m.team1)===skorEslesmeAnahtari(hukOkul)?tHuk:tMuh;
                m.score2=skorEslesmeAnahtari(m.team2)===skorEslesmeAnahtari(muhOkul)?tMuh:tHuk;
                m.provisionalWinner=tHuk>tMuh?hukOkul:(tMuh>tHuk?muhOkul:'');
                if(finalized)m.winner=mc.sonuc.kazanan;
                m.updatedAt=Date.now();changed=true;
            }
            if(!changed)return;
            state.revision=(state.revision||0)+1;state.updatedAt=Date.now();return state;
        },undefined,false);
    }

    async function yeniTur(){let olusanRound=null;await turnuvaRef().transaction(state=>{if(!state?.rounds)return state;const cr=Number(state.currentRound||1),r=state.rounds['r'+cr];if(!r)return state;const matches=Object.values(r.matches||{});if(!matches.length||!matches.every(m=>!!m.winner))return state;const winners=matches.map(m=>m.winner);if(winners.length===1){state.champion=winners[0];state.status='completed';state.revision=(state.revision||0)+1;state.updatedAt=Date.now();return state;}const nextNo=cr+1;if(state.rounds['r'+nextNo])return state;olusanRound=roundOlustur(secimler.kategori,nextNo,winners);state.rounds['r'+nextNo]=olusanRound;state.currentRound=nextNo;state.revision=(state.revision||0)+1;state.updatedAt=Date.now();return state;});if(olusanRound)await roundMaclariniKaydet(secimler.kategori,olusanRound);await firebaseArsivYedegiAl(true,'tur_gecisi');}

    async function turnuvayiSifirla(){const cevap=prompt(`${secimler.kategori} turnuvasını merkezi veritabanından sıfırlamak için SIFIRLA yazınız:`);if(cevap!=='SIFIRLA')return;const snap=await turnuvaRef().once('value');if(snap.exists())await db.ref(`arsiv/turnuva/${secimler.kategori}/${Date.now()}`).set(snap.val());await turnuvaRef().remove();localStorage.removeItem(TURN_CACHE_PREFIX+secimler.kategori);alert('Turnuva ağacı arşivlendi ve sıfırlandı. Puan kayıtları silinmedi.');}
