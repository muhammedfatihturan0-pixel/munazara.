    async function yoneticiManuelSonucKaydet(kategori,macId){
        if(manuelSonucCalisiyor)return;
        if(!adminYetkiliMi()||!navigator.onLine||!firebaseBagli)return alert('Çevrimiçi yönetici girişi gerekir.');
        const hs=document.getElementById('manuelPuanHuk')?.value?.trim()??'';
        const ms=document.getElementById('manuelPuanMuh')?.value?.trim()??'';
        const taraf=document.getElementById('manuelKazanan')?.value;
        const gerekce=puanMetniNormalize(document.getElementById('manuelSonucGerekce')?.value||'');
        const kabul=document.getElementById('manuelSonucOnay')?.checked;
        if(!taraf||!['huk','muh'].includes(taraf))return alert('Galip okul seçilmelidir.');
        
        if(!kabul)return alert('Sonuç doğrulama kutusunu işaretlemeniz gerekir.');
        if((hs==='')!==(ms===''))return alert('İki toplamı da yazın veya ikisini de boş bırakın.');
        const sayisal=hs!=='';
        if(sayisal&&(!/^\d+$/.test(hs)||!/^\d+$/.test(ms)||!Number.isSafeInteger(Number(hs))||!Number.isSafeInteger(Number(ms))||Number(hs)>100000||Number(ms)>100000))
            return alert('Puanlar 0–100000 aralığında tam sayı olmalıdır.');
        const ph=sayisal?Number(hs):null,pm=sayisal?Number(ms):null;
        if(sayisal&&ph!==pm&&taraf!==(ph>pm?'huk':'muh'))return alert('Galip, yüksek puanlı okul olmalıdır. Puanları veya seçimi kontrol edin.');
        manuelSonucCalisiyor=true;
        const btn=document.getElementById('manuelSonucKaydetBtn');if(btn){btn.disabled=true;btn.textContent='Kaydediliyor…';}
        const lock=kategori+'|'+macId;
        if(aktifSonucIslemleri.has(lock)){manuelSonucCalisiyor=false;if(btn){btn.disabled=false;btn.textContent='✓ Onaylı Sonucu Firebase\'e Kaydet';}return alert('Bu maçta başka bir sonuç işlemi sürüyor.');}
        aktifSonucIslemleri.add(lock);
        try{
            const m=await yoneticiMaciniHazirla(kategori,macId);
            if(m.durum!=='acik')throw new Error('Maç başka bir cihazda kapatılmış veya iptal edilmiş.');
            const kazanan=taraf==='huk'?m.hukOkul:m.muhOkul;
            const maglup=taraf==='huk'?m.muhOkul:m.hukOkul;
            // Eşleşme adlarla bulunmak zorunda değil. Yöneticinin bu ekranda
            // seçtiği resmî maç numarası ve takım yönü esas alınır.
            const {fixture,baglanti}=yoneticiFiksturFormDegeriniOku(kategori,m);
            const fiksturKazanan=fixture?yoneticiFiksturKazanan(m,{kazanan,kategori,fiksturBaglantisi:baglanti},fixture):null;
            if(fixture)await yoneticiFiksturCakismaKontrol(kategori,macId,fixture,fiksturKazanan);
            const eslesmeHata=fixture?'':'Resmî maç numarası seçilmedi. Sonuç merkezî olarak kaydedilecek; fikstür eşitlemesi bekleyecek.';
            const warn=fixture?'Resmî fikstür ve merkezî turnuva ağacına da aktarılacak.':
                'DİKKAT: Fikstürde eşleşme bulunamadı. Maç sonucu merkezi Firebase maç kaydında KAPALI olarak tutulacak, ancak resmi turnuva ağacına aktarılmayacak.\n'+eslesmeHata;
            if(!confirm(`YÖNETİCİ SONUÇ ONAYI\n\n${m.hukOkul}: ${sayisal?ph:'Belirtilmedi'}\n${m.muhOkul}: ${sayisal?pm:'Belirtilmedi'}\nGALİP: ${kazanan}\nNOT: ${gerekce||"Yönetici onayı"}\n\n${warn}\n\nMevcut jüri kayıtları silinmeyecek. Sonucu kesinleştirelim mi?`))return;
            // Her iki takımın önceki durumları ve tüm bu maça ait ham jüri kayıtları
            // sunucuya arşivlenmeden kapatma yapılmaz.
            const pSnap=await db.ref('puanlar/'+kategori).once('value');
            const raw=yoneticiMacaAitHamPuanlar(pSnap,macId);
            const sonuc={kazanan,maglup,yontem:sayisal?'yonetici_onayli_puan':'yonetici_karari',
                gerekce:gerekce||"Yönetici onayı",puanHuk:ph,puanMuh:pm,macNo:fixture?.no||null,kategori,macId,
                sureHuk:m.sureEsitlik?.hukSaniye??null,sureMuh:m.sureEsitlik?.muhSaniye??null,
                createdAt:Date.now(),senkronDurum:fixture?'bekliyor':'fikstur_eslesme_gerekli',
                fiksturBaglantisi:baglanti,fiksturKazanan,
                yoneticiIstisnasi:true,puanKayitSayisi:Object.keys(raw).length,
                kaynak:'yonetici_onayli_sonuc'};
            const auditPath=`arsiv/yoneticiKararlari/${kategori}/${Date.now()}_${macId}_resmi_sonuc`;
            await db.ref(auditPath).set({kategori,macId,mac:{...m},sonuc,
                oncekiPuanKayitlari:raw,fiksturEslesmeHatasi:eslesmeHata,
                islemDurumu:'hazirlandi',createdAt:firebase.database.ServerValue.TIMESTAMP});
            const ref=db.ref(`maclar/${kategori}/${macId}`);
            const applied=await ref.transaction(cur=>{
                if(!cur || cur.durum!=='acik'||cur.updatedAt!==m.updatedAt||
                    skorEslesmeAnahtari(cur.hukOkul)!==skorEslesmeAnahtari(m.hukOkul)||
                    skorEslesmeAnahtari(cur.muhOkul)!==skorEslesmeAnahtari(m.muhOkul))return;
                cur.durum='kapali';cur.closedAt=Date.now();cur.updatedAt=Date.now();
                cur.version=(cur.version||0)+1;cur.sonuc=sonuc;
                if(baglanti){cur.fiksturBaglantisi=baglanti;cur.fiksturNo=Number(fixture.no);}
                return cur;
            },undefined,false);
            if(!applied.committed)throw new Error('Maç başka cihazda değişti; sonuç işlenmedi. Lütfen yeniden açıp kontrol edin.');
            try{await db.ref(auditPath).update({islemDurumu:'mac_kapatildi',closedAt:firebase.database.ServerValue.TIMESTAMP});}
            catch(e){console.warn('Denetim kapanış durum bilgisi yazılamadı:',e);}
            let synced=false;
            if(fixture){
                try{await macSonucunuIkiAgacaYansit(kategori,macId,applied.snapshot.val(),sonuc,fixture);synced=true;}
                catch(e){console.error('Onaylı sonuç ağaca eşitlenemedi:',e);eslesmeHata=String(e?.message||e);}
            }
            yoneticiManuelPencereKapat();
            alert(synced?'✅ Maçın onaylı sonucu ve galibi resmî fikstüre kaydedildi. Jüri puanları korundu.':
                '✅ Maç sonucu merkezi Firebase kaydına KESİNLEŞTİRİLDİ. Ancak resmî fikstüre aktarım henüz tamamlanmadı. Yönetici panelinde Senkronu Onar seçeneğini kontrol edin.\nAyrıntı: '+(eslesmeHata||'Fikstürde eşleşme yok.'));
            if(document.getElementById('acilMacDenetim'))void acilMacDenetle();
        }catch(err){alert('Resmî sonuç kaydedilemedi: '+String(err?.message||err));}
        finally{aktifSonucIslemleri.delete(lock);manuelSonucCalisiyor=false;if(btn&&btn.isConnected){btn.disabled=false;btn.textContent='✓ Onaylı Sonucu Firebase\'e Kaydet';}}
    }

    async function yoneticiKapaliMacFikstureBagla(kategori,macId){
        if(!adminYetkiliMi()||!firebaseBagli)return alert('Yönetici ve Firebase bağlantısı gerekli.');
        const lock=kategori+'|'+macId;
        if(aktifSonucIslemleri.has(lock))return;
        aktifSonucIslemleri.add(lock);

            const m=await yoneticiMaciniHazirla(kategori,macId);
            if(m.durum!=='kapali'||!m.sonuc?.kazanan)throw new Error('Maç kapalı ve galibi kayıtlı olmalıdır.');
            const {fixture,baglanti}=yoneticiFiksturFormDegeriniOku(kategori,m);
            if(!fixture)throw new Error('Resmî fikstür maç numarasını seçin.');
            const gerekce=puanMetniNormalize(document.getElementById('manuelBaglantiGerekce')?.value||'');
            if(gerekce.length<12)throw new Error('Eşleştirme gerekçesi en az 12 karakter olmalı.');
            if(m.sonuc.macNo!=null&&Number(m.sonuc.macNo)!==Number(fixture.no))
                throw new Error('Sonuç zaten farklı bir maç numarasıyla kayıtlı. Önce çelişkiyi inceleyin; otomatik taşımaya izin verilmez.');

    function turkceMetinDuzelt(deger) {
        let s=String(deger??'').replace(/^\uFEFF/,'').replace(/\u00A0/g,' ').normalize('NFC').trim();
        const bozukKarakterler={'Ã§':'ç','Ã‡':'Ç','ÄŸ':'ğ','Äž':'Ğ','Ä±':'ı','Ä°':'İ','Ã¶':'ö','Ã–':'Ö','ÅŸ':'ş','Åž':'Ş','Ã¼':'ü','Ãœ':'Ü','â€™':'’','â€œ':'“','â€':'”','â€“':'–','â€”':'—','Â':'','ï»¿':''};
        for(const [bozuk,dogru] of Object.entries(bozukKarakterler)) s=s.split(bozuk).join(dogru);
        return s.normalize('NFC').trim();
    }

    function csvBufferCoz(buffer) {
        const bytes=new Uint8Array(buffer);
        if(bytes.length>=3&&bytes[0]===0xEF&&bytes[1]===0xBB&&bytes[2]===0xBF)return{text:new TextDecoder('utf-8').decode(bytes),encoding:'UTF-8 BOM'};
        if(bytes.length>=2&&bytes[0]===0xFF&&bytes[1]===0xFE)return{text:new TextDecoder('utf-16le').decode(bytes),encoding:'UTF-16 LE'};
        if(bytes.length>=2&&bytes[0]===0xFE&&bytes[1]===0xFF)return{text:new TextDecoder('utf-16be').decode(bytes),encoding:'UTF-16 BE'};
        try{return{text:new TextDecoder('utf-8',{fatal:true}).decode(bytes),encoding:'UTF-8'};}catch(_){try{return{text:new TextDecoder('windows-1254').decode(bytes),encoding:'Windows-1254'};}catch(_){return{text:new TextDecoder('iso-8859-9').decode(bytes),encoding:'ISO-8859-9'};}}
    }

    function firebaseKeyTemizle(isim) { return turkceMetinDuzelt(isim).replace(/[\.\#\$\/\[\]]/g,'').trim(); }


    async function excelTopluYukle() {
        const fileInput=document.getElementById('excelDosya');
        if(!fileInput?.files.length)return alert('Önce Excel veya CSV dosyası seçin.');
        const file=fileInput.files[0],kategori=secimler.kategori;
        try{
            const buffer=await file.arrayBuffer(),ext=(file.name||'').toLocaleLowerCase('tr-TR');
            let workbook,encoding='';
            if(ext.endsWith('.csv')){const parsed=csvBufferCoz(buffer);encoding=parsed.encoding;workbook=XLSX.read(parsed.text,{type:'string',raw:false});}
            else workbook=XLSX.read(buffer,{type:'array',cellText:true,cellDates:true});
            if(!workbook.SheetNames?.length)throw new Error('Çalışma sayfası bulunamadı.');
            const rows=XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]],{header:1,raw:false,defval:''});
            const prepared=[],seen=new Set();let inFileDuplicates=0,invalid=0;
            const norm=x=>turkceMetinDuzelt(x).replace(/\s+/g,' ').toLocaleLowerCase('tr-TR');
            for(let i=1;i<rows.length;i++){
                const row=rows[i];if(!row?.length)continue;
                const raw=turkceMetinDuzelt(row[0]),student=turkceMetinDuzelt(row[1]),school=firebaseKeyTemizle(raw);
                if(!school||!student||norm(raw)==='okul adı'){if(raw||student)invalid++;continue;}
                const key=norm(school)+'|'+norm(student);
                if(seen.has(key)){inFileDuplicates++;continue;}
                seen.add(key);prepared.push({school,student});
            }
            if(!prepared.length)return alert('Eklenecek geçerli yeni öğrenci bulunamadı.');
            let inserted=0,already=0;
            const dbRef=db.ref('okullar/'+kategori);
            // Bütün dosya tek transaction ile kaydedilir: eşzamanlı iki aktarım mükerrer oluşturamaz.
            const res=await dbRef.transaction(cur=>{
                const data=cur||{};
                let insertedLocal=0,alreadyLocal=0;
                const bySchool={};
                for(const school of Object.keys(data))bySchool[norm(school)]=school;
                for(const row of prepared){
                    const existingKey=bySchool[norm(row.school)]||row.school;
                    bySchool[norm(row.school)]=existingKey;
                    data[existingKey]=data[existingKey]||{};
                    const found=Object.values(data[existingKey]).some(x=>typeof x==='string'&&norm(x)===norm(row.student));
                    if(found){alreadyLocal++;continue;}
                    const childKey=db.ref().push().key;
                    data[existingKey][childKey]=row.student;
                    insertedLocal++;
                }
                inserted=insertedLocal;already=alreadyLocal;
                return insertedLocal?data:undefined;
            },undefined,false);
            if(!res.committed&&inserted)throw new Error('Okul listesi aynı anda güncellendi. Tekrar deneyin.');
            if(!res.committed)inserted=0;
            alert(`Excel/CSV tamamlandı.\nYeni öğrenci: ${inserted}\nÖnceden kayıtlı: ${already}\nDosyada tekrar eden: ${inFileDuplicates}\nEksik/geçersiz satır: ${invalid}${encoding?'\nKodlama: '+encoding:''}\n\nVar olan öğrenciler ve sıraları korunmuştur.`);
            fileInput.value='';okulListesiniYenile();
        }catch(err){console.error('Excel öğrenci aktarımı:',err);alert('Aktarım yapılamadı: '+(err?.message||err));}
    }

    async function okulListesiniYenile() {
        const kategori=secimler.kategori;
        const l=document.getElementById('okulListesi');if(!l)return;
        l.textContent='Firebase öğrenci kayıtları kontrol ediliyor…';
        try{
            const s=await db.ref('okullar/'+kategori).once('value');
            if(!document.getElementById('okulListesi') || secimler.kategori!==kategori)return;
            l.innerHTML='';let okulSayisi=0,ogrenciSayisi=0;
            s.forEach(o=>{
                okulSayisi++;ogrenciSayisi+=o.numChildren?.()??Object.keys(o.val()||{}).length;
                const wrap=document.createElement('div');wrap.style.marginBottom='10px';
                const btn=document.createElement('button');btn.className='btn';btn.style='background:#1e293b;text-align:left;border-left:4px solid var(--primary);margin:0;';btn.textContent='🏫 '+o.key;
                const inner=document.createElement('div');inner.id='list-'+hash32(o.key);inner.style='display:none;padding:12px;background:#111827;border:1px solid var(--border-color);border-radius:0 0 10px 10px;';
                btn.onclick=()=>togg(o.key,inner);wrap.append(btn,inner);l.appendChild(wrap);
            });
            const durum=document.createElement('div');durum.className='puanlama-bilgi';
            durum.textContent=okulSayisi?`${kategori}: Firebase’de ${okulSayisi} okul, ${ogrenciSayisi} öğrenci kaydı bulundu.`:
                `${kategori} kategorisinde Firebase üzerinde şu anda okul/öğrenci kaydı bulunamadı. Diğer kategoriyi de kontrol edin; önceki yedeği incelemeden yeniden toplu yükleme yapmayın.`;
            l.prepend(durum);
        }catch(err){l.innerHTML='<div class="puanlama-bilgi hata">Firebase öğrenci listesi okunamadı: '+htmlEscape(err?.message||err)+'. Bu hata kayıtların silindiği anlamına gelmez.</div>';}
    }

    function ogrenciKaydet() { const school=turkceMetinDuzelt(document.getElementById('okulAd').value),student=turkceMetinDuzelt(document.getElementById('ogrAd').value);if(!school||!student)return alert('Lütfen alanları boş bırakmayın!');const temizOkul=firebaseKeyTemizle(school);db.ref(`okullar/${secimler.kategori}/${temizOkul}`).push(student).then(()=>{alert('Öğrenci başarıyla veritabanına kaydedildi!');document.getElementById('ogrAd').value='';okulListesiniYenile();}).catch(err=>alert('Öğrenci kaydedilemedi: '+(err?.message||err))); }
    function togg(o,d) { const durum=d.style.display;document.querySelectorAll('[id^="list-"]').forEach(el=>el.style.display='none');if(durum==='none'){d.style.display='block';ogrenciListesiniDoldur(o,d);} }

        divElement.innerHTML='';
        const schoolBtn=document.createElement('button');schoolBtn.className='btn';

        divElement.appendChild(schoolBtn);
        s.forEach(ogr=>{
            const row=document.createElement('div');row.style='padding:6px;display:flex;gap:8px;justify-content:space-between;align-items:center;border-bottom:1px solid #1f2937;';

            const edit=document.createElement('button');edit.style='background:#2563eb;color:white;border:none;border-radius:6px;padding:6px 10px;cursor:pointer;font-weight:bold;';
            edit.textContent='Düzenle';edit.onclick=()=>ogrenciAdiniDegistir(o,ogr.key,divElement);

        del.textContent='❌ Okulu ve Tüm Öğrencileri Sil';del.onclick=()=>okulKompleSil(o);divElement.appendChild(del);
    }).catch(err=>{divElement.textContent='Öğrenciler getirilemedi: '+(err?.message||err);});}

    // Bu işlemler yalnızca öğrenci kayıtlarının adını düzeltir; fikstürü/maç kimliğini değiştirmez.
    async function okulAdiniDegistir(eskiAd){
        if(!adminYetkiliMi())return alert('Yalnızca Yönetici Modülünden okul adı düzenlenebilir.');
        if(!firebaseBagli||!navigator.onLine)return alert('Okul adı değiştirmek için Firebase bağlantısı gerekli.');
        const kat=secimler.kategori;
        const girilen=prompt('Okulun yeni adını giriniz:',eskiAd);
        if(girilen===null)return;
        const yeniAd=turkceMetinDuzelt(girilen),key=firebaseKeyTemizle(yeniAd);
        if(!key||yeniAd!==key)return alert('Okul adı boş olamaz ve Firebase anahtarında geçersiz karakter içeremez (., #, $, /, [, ]).');
        if(yeniAd===eskiAd)return;
        if(!confirm(`Okul listesi adı değiştirilecek:\n${eskiAd} → ${yeniAd}\n\nÖğrenciler ve sıraları korunur. Resmî fikstür, maç sonuçları ve eski jüri puanları değiştirilmez. Devam edilsin mi?`))return;
        try{
            let hata='';
            const result=await db.ref('okullar/'+kat).transaction(cur=>{
                if(!cur||!Object.prototype.hasOwnProperty.call(cur,eskiAd)){hata='Eski okul kaydı bulunamadı.';return;}
                const ayni=Object.keys(cur).find(x=>x!==eskiAd&&skorEslesmeAnahtari(x)===skorEslesmeAnahtari(yeniAd));
                if(ayni){hata='Bu isimde bir okul zaten kayıtlı: '+ayni;return;}
                cur[yeniAd]=cur[eskiAd];delete cur[eskiAd];return cur;
            },undefined,false);
            if(!result.committed)return alert('Okul adı değiştirilemedi. '+(hata||'Liste başka cihazda güncellenmiş olabilir.'));
            // Yalnızca mevcut maçların öğrenci listesi KAYNAK bağlantılarını yeniden göster.
            // Hükümet/muhalefet tarafları, fikstür maçları ve kimlikleri aynen korunur.
            let uyari='';
            try{
                const macSnap=await db.ref('maclar/'+kat).once('value');
                const updates={};
                macSnap.forEach(s=>{
                    const m=s.val();if(!m||!m.hukOkul||!m.muhOkul)return;
                    for(const [taraf,okul] of [['huk',m.hukOkul],['muh',m.muhOkul]]){
                        const kaynak=m.ogrenciKaynaklari?.[taraf];
                        if(kaynak===eskiAd||(!kaynak&&skorEslesmeAnahtari(okul)===skorEslesmeAnahtari(eskiAd)))
                            updates[`${s.key}/ogrenciKaynaklari/${taraf}`]=yeniAd;
                    }
                });
                if(Object.keys(updates).length)await db.ref('maclar/'+kat).update(updates);
            }catch(err){uyari=' Mevcut bazı maçların öğrenci kaynağı bağlantısı güncellenemedi; Yönetici → Öğrenci Listesi Eşleştirmeleri alanından kontrol edin. Ayrıntı: '+(err?.message||err);}
            alert('Okulun kayıtlı adı değiştirildi. Fikstür ve eski puanlar korunmuştur.'+uyari);
            okulListesiniYenile();
        }catch(err){alert('Okul adı değiştirilemedi: '+(err?.message||err));}
    }

    async function ogrenciAdiniDegistir(okulAd,ogrKey,divElement){
        if(!adminYetkiliMi())return alert('Yalnızca Yönetici Modülünden öğrenci adı düzenlenebilir.');
        if(!firebaseBagli||!navigator.onLine)return alert('Öğrenci adı değiştirmek için Firebase bağlantısı gerekli.');
        const kat=secimler.kategori;
        try{
            const ogrRef=db.ref(`okullar/${kat}/${okulAd}/${ogrKey}`);
            const onceki=(await ogrRef.once('value')).val();
            if(typeof onceki!=='string')return alert('Öğrenci kaydı bulunamadı; listeyi yenileyin.');
            const girilen=prompt('Öğrencinin yeni ad ve soyadını giriniz:',onceki);
            if(girilen===null)return;
            const yeniAd=turkceMetinDuzelt(girilen);
            if(!yeniAd)return alert('Öğrenci adı boş olamaz.');
            if(yeniAd===onceki)return;
            const norm=skorEslesmeAnahtari;
            const [oSnap,pSnap,mSnap]=await Promise.all([
                db.ref(`okullar/${kat}/${okulAd}`).once('value'),
                db.ref('puanlar/'+kat).once('value'),
                db.ref('maclar/'+kat).once('value')
            ]);
            const roster=oSnap.val()||{};
            if(Object.keys(roster).some(k=>k!==ogrKey&&norm(roster[k])===norm(yeniAd)))return alert('Bu okulda aynı isimde başka bir öğrenci zaten var.');
            const maclar=mSnap.val()||{};
            let scored=false;
            pSnap.forEach(c=>{
                const v=c.val(),s=v?.secim||{};
                if(norm((s.ogr||'').split(' (')[0])!==norm(onceki))return;
                const m=maclar[kayitMacId(v)]||{};
                const taraf=s.taraf==='HÜKÜMET'?'huk':s.taraf==='MUHALEFET'?'muh':'';
                const kaynak=m.ogrenciKaynaklari?.[taraf]||(taraf==='huk'?m.hukOkul:m.muhOkul)||s.okul;
                if(norm(kaynak)===norm(okulAd)||norm(s.okul)===norm(okulAd))scored=true;
            });
            if(scored)return alert('Bu öğrenciye ait jüri puanı bulundu. Tamamlanmış puanların kimliğini ve 3/3 jüri eşleşmesini bozmamak için ad değişikliği durduruldu. Puanlanmış kayıtlar için ayrıca kontrollü veri düzeltmesi gerekir.');
            let hata='';
            const result=await db.ref(`okullar/${kat}/${okulAd}`).transaction(cur=>{
                if(!cur||cur[ogrKey]!==onceki){hata='Öğrenci başka cihazda güncellendi.';return;}
                if(Object.keys(cur).some(k=>k!==ogrKey&&norm(cur[k])===norm(yeniAd))){hata='Aynı isimde öğrenci mevcut.';return;}
                cur[ogrKey]=yeniAd;return cur;
            },undefined,false);
            if(!result.committed)return alert('Ad değiştirilemedi. '+(hata||'Lütfen yeniden deneyin.'));
            ogrenciListesiniDoldur(okulAd,divElement);
            alert('Öğrenci adı güncellendi. Öğrenci sırası, fikstür ve jüri kayıtları korunmuştur.');
        }catch(err){alert('Öğrenci adı değiştirilemedi: '+(err?.message||err));}
    }

    // Yalnızca yönetici alanında, resmî maçla öğrenci listesi kaynağını ilişkilendirir.

    let yonEslemeOkullari={};

    function yoneticiEslemePanelGuncelle(){
        const panel=document.getElementById('yonEslemePanel');if(!panel)return;
        const m=yonEslemeMaclari.get(document.getElementById('yonEslemeMac')?.value);
        if(!m){panel.innerHTML='';return;}
        const keys=Object.keys(yonEslemeOkullari).sort((a,b)=>a.localeCompare(b,'tr'));
        const find=ad=>keys.find(k=>skorEslesmeAnahtari(k)===skorEslesmeAnahtari(ad))||'';
        const kaynaklar={
            huk:yonEslemeOkullari[m.ogrenciKaynaklari?.huk]?.length?m.ogrenciKaynaklari.huk:find(m.hukOkul),
            muh:yonEslemeOkullari[m.ogrenciKaynaklari?.muh]?.length?m.ogrenciKaynaklari.muh:find(m.muhOkul)
        };
        const hazır=['huk','muh'].every(t=>kaynaklar[t]&&yonEslemeOkullari[kaynaklar[t]]?.length);
        if(hazır){
            panel.innerHTML=`<div class="puanlama-bilgi">✅ Bu maçın iki öğrenci listesi bağlı. <b>${htmlEscape(m.hukOkul)}</b>: ${htmlEscape(kaynaklar.huk)} (${yonEslemeOkullari[kaynaklar.huk].length}) · <b>${htmlEscape(m.muhOkul)}</b>: ${htmlEscape(kaynaklar.muh)} (${yonEslemeOkullari[kaynaklar.muh].length}). Değişiklik gerekmiyor.</div>
                <details><summary class="sure-hint" style="cursor:pointer;color:#93c5fd">Yönetici olarak bağlı öğrenci listesini değiştirmek</summary><div id="yonEslemeForm"></div></details>`;
            const details=panel.querySelector('details');details.addEventListener('toggle',()=>{if(details.open)yoneticiEslemeFormunuDoldur(m,kaynaklar,keys);});
            return;
        }
        panel.innerHTML='<div class="puanlama-bilgi hata">Fikstürdeki okullardan en az birinin öğrenci listesi bulunamadı. Yalnızca kayıtlı öğrenci listesi kaynağını seçin; maç tarafları değişmeyecek.</div><div id="yonEslemeForm"></div>';
        yoneticiEslemeFormunuDoldur(m,kaynaklar,keys);
    }

    function yoneticiEslemeFormunuDoldur(m,kaynaklar,keys){
        const form=document.getElementById('yonEslemeForm');if(!form)return;
        const select=(taraf,label)=>`<label class="puanlama-etiket">${label}: ${htmlEscape(taraf==='huk'?m.hukOkul:m.muhOkul)}</label>
            <select id="yonEsleme_${taraf}"><option value="">Öğrenci listesi seçiniz</option>
            ${keys.map(n=>`<option value="${htmlEscape(n)}" ${kaynaklar[taraf]===n?'selected':''}>${htmlEscape(n)} (${yonEslemeOkullari[n].length} öğrenci)</option>`).join('')}</select>`;
        form.innerHTML=select('huk','Hükümet')+select('muh','Muhalefet')+
            '<button class="btn" style="background:#1d4ed8" onclick="yoneticiOgrenciEslemeKaydet()">🔒 Öğrenci Listesi Bağlantılarını Kaydet</button>';
    }

    async function yoneticiOgrenciEslemeKaydet(){
        if(!adminYetkiliMi()||!firebaseBagli||!navigator.onLine)return alert('Çevrimiçi yönetici yetkisi gerekli.');
        const kat=secimler.kategori,m=yonEslemeMaclari.get(document.getElementById('yonEslemeMac')?.value);
        if(!m)return alert('Resmî fikstürden maç seçiniz.');
        const huk=document.getElementById('yonEsleme_huk')?.value||'',muh=document.getElementById('yonEsleme_muh')?.value||'';
        if(!huk||!muh||!yonEslemeOkullari[huk]?.length||!yonEslemeOkullari[muh]?.length)return alert('Her iki taraf için öğrencisi bulunan okul seçiniz.');
        if(huk===muh)return alert('İki taraf aynı öğrenci listesine bağlanamaz.');
        const current=m.ogrenciKaynaklari||{};
        if(current.huk===huk&&current.muh===muh)return alert('Öğrenci listesi zaten bağlı; değişiklik yapılmadı.');
        try{
            const scores=await db.ref('puanlar/'+kat).once('value');
            const puandan=surePuandanOgrenciListesi(scores,m.id);
            const hasScore=puandan.huk.length>0||puandan.muh.length>0;
            if(hasScore){
                // Maç oynanmışsa mevcut ve hâlâ geçerli bir kaynak bağlantısını değiştirme.
                const kaynakGecerli=taraf=>current[taraf]&&yonEslemeOkullari[current[taraf]]?.length;
                if((kaynakGecerli('huk')&&current.huk!==huk)||(kaynakGecerli('muh')&&current.muh!==muh))
                    return alert('Bu maçta jüri puanı varken halen geçerli bir öğrenci listesi bağlantısı değiştirilemez.');
                for(const [taraf,kaynak] of [['huk',huk],['muh',muh]]){
                    const secilen=new Set((yonEslemeOkullari[kaynak]||[]).map(skorEslesmeAnahtari));
                    const eksik=puandan[taraf].filter(ad=>!secilen.has(skorEslesmeAnahtari(ad)));
                    if(eksik.length)return alert('Bu listede daha önce puanlanan öğrenciler yok: '+eksik.join(', ')+'. Doğru okul listesini seçin.');
                }
                if(!confirm('Bu maçta jüri puanları var. Yalnızca EKSİK/KOPUK öğrenci kaynağı bağlantısı onarılacak; eski puanlar, maç sonucu ve fikstür değiştirilmeyecek. Seçilen öğrenci listelerinin doğru olduğundan emin misiniz?'))return;
            }
            const res=await db.ref(`maclar/${kat}/${m.id}`).transaction(cur=>{
                if(['kapali','iptal'].includes(cur?.durum))return;
                if(cur?.hukOkul&&(cur.hukOkul!==m.hukOkul||cur.muhOkul!==m.muhOkul))return;
                if((cur?.ogrenciKaynaklari?.huk||'')!==(current.huk||'')||(cur?.ogrenciKaynaklari?.muh||'')!==(current.muh||''))return;
                return {...cur,id:m.id,kategori:kat,hukOkul:m.hukOkul,muhOkul:m.muhOkul,
                    etiket:m.etiket,durum:cur?.durum||'acik',fiksturNo:m.fiksturNo||null,
                    ogrenciKaynaklari:{huk,muh},createdAt:cur?.createdAt||Date.now(),updatedAt:Date.now()};
            },undefined,false);
            if(!res.committed)return alert('Maç kapalı veya eşleştirme başka cihazda değişti; tekrar kontrol edin.');
            m.ogrenciKaynaklari={huk,muh};yoneticiEslemePanelGuncelle();
            alert('Yalnızca öğrenci listesi bağlantısı kaydedildi. Resmî fikstür ve maç eşleşmesi değişmedi.');
        }catch(err){alert('Öğrenci listesi bağlantısı kaydedilemedi: '+(err?.message||err));}
    }    function ogrenciSil(okulAd,ogrKey,divElement){if(confirm('Bu öğrenciyi silmek istediğinize emin misiniz?'))db.ref(`okullar/${secimler.kategori}/${okulAd}/${ogrKey}`).remove().then(()=>ogrenciListesiniDoldur(okulAd,divElement));}

    async function roundMaclariniKaydet(kategori,round){if(!round?.matches)return;for(const m of Object.values(round.matches)){if(m.team2==='BYE')continue;await ensureMatchExists(kategori,m.team1,m.team2);}}

    function base64Utf8Coz(b64) {
        const raw = atob(b64);
        const bytes = new Uint8Array(raw.length);
        for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
        return new TextDecoder('utf-8').decode(bytes);
    }

    async function renderFiksturIstisnaYonetimi(){
      if(!adminYetkiliMi())return alert('Yönetici yetkisi gerekli.');
      if(!navigator.onLine||!firebaseBagli)return alert('Fikstür değişiklikleri için Firebase bağlantısı gerekli.');
      dinleyicileriTemizle();
      fiksturIstisnaGeciciSayfa();
      window._fIstLastSource='';
      try{
        const liste=await puanlamaFiksturMaclariniOku();
        const [fSnap,lSnap,oSnap]=await Promise.all([
          db.ref(FIKSTUR_ISTISNA_YOLU).once('value'), db.ref('okullar/LİSE').once('value'),db.ref('okullar/ORTAOKUL').once('value')
        ]);
        if(!document.getElementById('fIstMac'))return;
        if(!fSnap.exists()||!fSnap.val()?.juries||!fSnap.val()?.topics)throw new Error('Ortak fikstür yüklenmedi.');
        fiksturIstisnaTumMaclar=liste;
        // Taşınan maç için oluşan eski BOŞ konum, ayrı maç gibi listelenmez.
        const latest=new Map();
        for(const m of liste.filter(m=>m.no>=1&&m.no<=35&&!m.isBay)){
          if(!latest.has(m.no)||(!m.isEmpty&&latest.get(m.no).isEmpty))latest.set(m.no,m);
        }
        fiksturIstisnaListe=[...latest.values()].sort((a,b)=>a.no-b.no);
        fiksturIstisnaState=fSnap.val();
        fiksturIstisnaOkullar={'LİSE':lSnap.val()||{},'ORTAOKUL':oSnap.val()||{}};
        document.getElementById('fIstDurum').textContent='Merkezî fikstür yüklendi. Değişiklikler işlem sonunda tüm güncel cihazlarda görünür.';
        fiksturIstisnaFormunuGuncelle();
      }catch(e){const x=document.getElementById('fIstDurum');if(x){x.className='puanlama-bilgi hata';x.textContent='Fikstür yüklenemedi: '+(e?.message||e);}}
    }
    function fiksturIstisnaFormunuGuncelle(){
      const op=document.getElementById('fIstTur')?.value,kat=document.getElementById('fIstKategori')?.value;
      const listEl=document.getElementById('fIstMac'); if(!listEl)return;
      const prev=listEl.value;
      const matches=fiksturIstisnaListe.filter(m=>op==='add'?(m.no===35 && (m.isPending||m.isEmpty)):(m.cat===(kat==='LİSE'?'lise':'ortaokul') && !m.isEmpty && m.roundTitle==='1. Eleme Turu'));
      listEl.innerHTML=matches.map(m=>`<option value="${m.no}">#${m.no} · ${htmlEscape(m.team1)} / ${htmlEscape(m.team2)}</option>`).join('');
      if(matches.some(m=>String(m.no)===prev))listEl.value=prev;
      if(op==='add')document.getElementById('fIstKategori').value='ORTAOKUL';
      const m=matches.find(m=>String(m.no)===listEl.value);
      const status=document.getElementById('fIstEski');
      if(status)status.textContent=m?`#${m.no} · ${m.dateStr} · ${m.time} · ${m.team1} / ${m.team2}`:'Bu işlem için uygun boş maç bulunamadı.';
      const schools=new Set([...Object.keys(fiksturIstisnaOkullar[document.getElementById('fIstKategori').value]||{}),...fiksturIstisnaListe.filter(m=>m.cat===(document.getElementById('fIstKategori').value==='LİSE'?'lise':'ortaokul')).flatMap(m=>[m.team1,m.team2])]);
      schools.delete('BOŞ');document.getElementById('fIstOkullar').innerHTML=[...schools].sort((a,b)=>a.localeCompare(b,'tr')).map(x=>`<option value="${htmlEscape(x)}"></option>`).join('');
      document.getElementById('fIstOkulAlanlari').style.display=op==='move'?'none':'block';
      document.getElementById('fIstZamanAlanlari').style.display=op==='replace'?'none':'block';
      const huk=document.getElementById('fIstHuk'),muh=document.getElementById('fIstMuh'),date=document.getElementById('fIstTarih'),time=document.getElementById('fIstSeans');
      // Aynı maçın tekrar seçilmesinde kullanıcı düzenlemesini ezmemek için kaynak değişince doldur.
      const key=`${op}:${m?.no||0}`;
      if(window._fIstLastSource!==key){
        if(huk)huk.value=(m?.team1==='BOŞ'||m?.isEmpty)?'':m?.team1||'';
        if(muh)muh.value=(m?.team2==='BOŞ'||m?.isEmpty)?'':m?.team2||'';
        if(date)date.value=m?.dateISO||'2026-11-02';
        if(time)time.value=FIKSTUR_ISTISNA_SEANSLAR.includes(m?.time)?m.time:FIKSTUR_ISTISNA_SEANSLAR[0];
        window._fIstLastSource=key;
      }
    }
    async function fiksturIstisnayiKaydet(){
      if(!adminYetkiliMi()||!firebaseBagli||!navigator.onLine)return alert('Çevrimiçi yönetici yetkisi gerekli.');
      const op=document.getElementById('fIstTur')?.value;
      const no=Number(document.getElementById('fIstMac')?.value);
      const m=fiksturIstisnaListe.find(x=>x.no===no);
      if(!m||m.isBay||m.roundTitle!=='1. Eleme Turu'||(op==='add'&&!m.isPending&&!m.isEmpty)||no<1||no>35)return alert('Geçerli ilk tur maçı seçin. #35 rakip beklerken doldurulabilir.');
      const kat=m.cat==='lise'?'LİSE':'ORTAOKUL';
      const team1=op==='move'?m.team1:puanMetniNormalize(document.getElementById('fIstHuk')?.value);
      const team2=op==='move'?m.team2:puanMetniNormalize(document.getElementById('fIstMuh')?.value);
      const date=op==='replace'?m.dateISO:document.getElementById('fIstTarih')?.value;
      const time=op==='replace'?m.time:document.getElementById('fIstSeans')?.value;
      const reason=puanMetniNormalize(document.getElementById('fIstGerekce')?.value);
      // Düzenlenmiş maçta tek BOŞ taraf mümkündür: bu bir BAY değildir, rakip bekleyen rezerve maçtır.
      const realSchool=x=>!!x&&!['boş','bay'].includes(fiksturIstisnaNorm(x));
      const distinct=!(realSchool(team1)&&realSchool(team2)&&fiksturIstisnaNorm(team1)===fiksturIstisnaNorm(team2));
      if(!distinct||(!realSchool(team1)&&!realSchool(team2))||[team1,team2].some(x=>fiksturIstisnaNorm(x)==='bay'))
        return alert('En az bir gerçek okul olmalı; iki okul varsa farklı olmalıdır. BOŞ taraf rakip bekleme anlamına gelir.');
      if(op==='add'&&(!realSchool(team1)||!realSchool(team2)))return alert('35. maçın rakibini tamamlamak için iki okulun da adı gereklidir.');
      const yeniTakim1=realSchool(team1)?team1:'BOŞ', yeniTakim2=realSchool(team2)?team2:'BOŞ';
      if(reason.length<12)return alert('Değişiklik gerekçesini en az 12 karakterle girin.');
      if(!/^20\d\d-\d\d-\d\d$/.test(date)||!FIKSTUR_ISTISNA_SEANSLAR.includes(time))return alert('Geçerli tarih ve seans seçin.');
      const selectedDate=new Date(date+'T12:00:00');
      if(Number.isNaN(selectedDate.getTime())||selectedDate.getDay()===0||selectedDate.getDay()===6)return alert('Maç tarihi hafta sonuna denk gelemez.');
      const dt2=selectedDate.getFullYear()+'-'+String(selectedDate.getMonth()+1).padStart(2,'0')+'-'+String(selectedDate.getDate()).padStart(2,'0');
      if(dt2!==date||date<'2026-10-19')return alert('Geçersiz tarih.');
      // Aynı salonda aynı tarih/saate iki gerçek maç planlanamaz.
      if(fiksturIstisnaTumMaclar.some(x=>x.no!==no&&!x.isEmpty&&!x.isBay&&x.dateISO===date&&x.time===time))return alert('Bu tarih/saat başka bir maç tarafından kullanılıyor. Boş seans seçin.');
      const sameTeams=fiksturIstisnaListe.filter(x=>x.no!==no&&!x.isEmpty&&x.cat===m.cat&&[x.team1,x.team2].filter(realSchool).some(n=>[yeniTakim1,yeniTakim2].filter(realSchool).some(z=>fiksturIstisnaNorm(n)===fiksturIstisnaNorm(z))));
      if(sameTeams.length)return alert('Seçtiğiniz okul başka bir ilk tur maçında görünüyor: '+sameTeams.map(x=>'#'+x.no).join(', '));
      if(op==='add'&&m.no!==35)return alert('Yalnızca resmî #35 boş maçına okul eklenebilir.');
      if(op!=='move'&&yeniTakim1===m.team1&&yeniTakim2===m.team2)return alert('Okul değişikliği yapılmadı.');
      if(op==='move'&&date===m.dateISO&&time===m.time)return alert('Yeni tarih/saat eskisiyle aynı.');
      const oldId=macKimligiOlustur(kat,m.team1,m.team2);
      const pSnap=await db.ref('puanlar/'+kat).once('value');
      let hasScore=false; pSnap.forEach(c=>{if(kayitMacId(c.val())===oldId)hasScore=true;});
      const pRef=db.ref(`maclar/${kat}/${oldId}`);
      const oldMatch=(await pRef.once('value')).val();
      const fRef=db.ref(FIKSTUR_ISTISNA_YOLU);
      const current=(await fRef.once('value')).val();
      if(hasScore||['kapali','iptal'].includes(oldMatch?.durum)||oldMatch?.sonuc?.kazanan||current?.winners?.[no]||current?.finalizedMatches?.[no])return alert('Bu maçın puanı, sonucu veya galibi var. Mevcut kayıtları korumak için değişiklik engellendi.');
      const once35Gercek=no===35&&realSchool(m.team1)&&realSchool(m.team2);
      const yeni35Gercek=no===35&&realSchool(yeniTakim1)&&realSchool(yeniTakim2);
      if(no===35 && once35Gercek!==yeni35Gercek){
        // #35 ikinci okulu eklendiğinde 24 maçtan 25 maça geçilir; sonuçlar girildiyse bu değişemez.
        const sonrakiTurKaydi=Object.keys(current?.winners||{}).some(x=>Number(x)>=41) ||
          Object.keys(current?.finalizedMatches||{}).some(x=>Number(x)>=41) ||
          ['orta_r2','orta_r3','orta_r4','orta_sf'].some(x=>!!current?.bayDraws?.[x]);
        if(sonrakiTurKaydi)return alert('İkinci tur sonuçları/BAY kuraları bulunduğundan #35 artık doldurulamaz. Eleme ağacı korunuyor.');
      }
      // Boş #35 daha önce kullanılmadıysa kaynakta puan bulunmaz.
      const display=`#${no} ${m.team1} / ${m.team2}\n→ ${yeniTakim1} / ${yeniTakim2}\n${m.dateISO} ${m.time}\n→ ${date} ${time}\nGerekçe: ${reason}`;
      if(!confirm('YÖNETİCİ FİKSTÜR DEĞİŞİKLİĞİ\n\n'+display+'\n\nİşlem Firebase üzerinde saklanacak. Onaylıyor musunuz?'))return;
      const btn=document.getElementById('fIstKaydet');if(btn)btn.disabled=true;
      try{
        await db.ref(`arsiv/fiksturDegisiklikleri/${Date.now()}_${no}`).set({before:current,oldMatch:oldMatch||null,proposal:{no,op,team1:yeniTakim1,team2:yeniTakim2,date,time,reason},createdAt:firebase.database.ServerValue.TIMESTAMP});
        const oldRevision=current?.updatedAt;
        const oldOverride=JSON.stringify(current?.adminOverrides?.[no]||null);
        const result=await fRef.transaction(cur=>{
          if(!cur||!cur.juries||!cur.topics||cur.updatedAt!==oldRevision||JSON.stringify(cur.adminOverrides?.[no]||null)!==oldOverride)return;
          if(cur.winners?.[no]||cur.finalizedMatches?.[no])return;
          cur.adminOverrides=cur.adminOverrides||{};
          cur.adminOverrides[no]={no,cat:m.cat,team1:yeniTakim1,team2:yeniTakim2,date,time,reason,operation:op,updatedAt:Date.now()};
          cur.updatedAt=Date.now();cur.sonIslem='yoneticiFiksturDegisikligi';
          return cur;
        },undefined,false);
        if(!result.committed)throw new Error('Fikstür başka bir cihazda değişti. Yenileyip tekrar deneyin.');
        // Okulu değişen, puansız ve açık eski operasyon kaydı fikstürde ikinci maç gibi kalmasın.
        const newId=macKimligiOlustur(kat,yeniTakim1,yeniTakim2);
        let eskiKayitUyarisi='';
        if(newId!==oldId && oldMatch && oldMatch.durum==='acik' && !oldMatch.sonuc?.kazanan){
          try{
            const cleanup=await pRef.transaction(cur=>{
              if(!cur || cur.durum!=='acik' || cur.updatedAt!==oldMatch.updatedAt || cur.sonuc?.kazanan)return;
              return null;
            },undefined,false);
            if(!cleanup.committed)eskiKayitUyarisi=' Eski boş maç kaydının yönetici panelinden ayrıca kontrol edilmesi gerekebilir.';
          }catch(_){eskiKayitUyarisi=' Eski operasyon kaydı otomatik temizlenemedi; yönetici panelinden kontrol edin.';}
        }
        alert('Fikstür güncellendi. Maç numarası korundu. Yeni tarih için jüri görevlendirmesini kontrol edin.'+eskiKayitUyarisi);
        await renderFiksturIstisnaYonetimi();
      }catch(err){alert('Fikstür değiştirilemedi: '+(err?.message||err));}
      finally{const b=document.getElementById('fIstKaydet');if(b)b.disabled=false;}
    }

    function renderTurnuvaState(state){
        const kutu=document.getElementById('fiksturSonucSatirlari');
        if(kutu){
            const sonuclar=Object.values(state?.fiksturSonuclari || {}).sort((a,b)=>Number(a.macNo)-Number(b.macNo));
            kutu.innerHTML=sonuclar.length ? sonuclar.map(x=>`<div style="padding:7px 0;border-bottom:1px solid #334155;"><b>#${Number(x.macNo)} · ${htmlEscape(x.okul1)} / ${htmlEscape(x.okul2)}</b> — ${Number(x.puan1)} : ${Number(x.puan2)} · <span style="color:#34d399">${htmlEscape(x.galip)}</span> (${x.yontem==='sure'?'kısa süre':x.yontem==='son_savunma'?'son savunma':'puan'})</div>`).join('') : 'Henüz kesinleşmiş resmî fikstür sonucu yok.';
        }
        const rev=document.getElementById('turnuvaRevision'),act=document.getElementById('aktif-tur-container'),old=document.getElementById('gecmis-turlar'),champ=document.getElementById('sampiyonAlani'),next=document.getElementById('nextTurBtn');if(!act||!old||!champ||!next)return;if(!state?.rounds){act.innerHTML='<div class="kriter-card" style="text-align:center;color:var(--text-muted);">Ayrı Canlı Puan Ağacı kurulmamış. Resmî fikstürden kesinleşen sonuçlar yukarıda gösteriliyor.</div>';old.innerHTML='';champ.innerHTML='';next.style.display='none';if(rev)rev.textContent='';return;}if(rev)rev.textContent=`Revizyon: ${state.revision||0} · Son güncelleme: ${state.updatedAt?new Date(state.updatedAt).toLocaleString('tr-TR'):'-'}`;const cr=Number(state.currentRound||1);const r=state.rounds?.['r'+cr];act.innerHTML=`<h3 style="color:var(--text-main);font-size:20px;border-left:4px solid var(--accent);padding-left:8px;">Aktif Tur: ${cr}. Eleme Eşleşmeleri</h3>`;const winners=[];Object.entries(r?.matches||{}).forEach(([mk,m])=>{if(m.winner)winners.push(m.winner);if(m.team2==='BYE'){act.innerHTML += `<div class="match-box" style="border-color:var(--success);"><b style="color:var(--success);">${htmlEscape(m.team1)}</b><br><span style="color:var(--text-muted);font-size:12px;">vs</span><br><b>BYE</b><div class="win-tag">Otomatik Tur Atladı</div></div>`;return;}const status=m.winner?`<div class="win-tag">Kazanan: ${htmlEscape(m.winner)}</div>`:(m.provisionalWinner?`<div class="win-tag" style="background:#78350f;color:#fde68a;border-color:#92400e;">Geçici üstün: ${htmlEscape(m.provisionalWinner)} · Maçı kapatınca kesinleşir</div>`:'');act.innerHTML += `<div class="match-box"><div style="font-size:10px;color:var(--text-muted);margin-bottom:6px;">${htmlEscape(m.macId)}</div><div class="match-team" style="border-bottom:1px solid #1f2937;padding-bottom:6px;"><span><b>${htmlEscape(m.team1)}</b></span><input type="number" class="skor-input" id="ts-${cr}-${mk}-1" value="${m.score1??''}" onchange="turnuvaManuelSkorKaydet('${'r'+cr}','${mk}')"></div><div style="text-align:center;margin:4px 0;font-size:11px;color:var(--text-muted);font-weight:bold;letter-spacing:1px;">VS</div><div class="match-team" style="border-top:1px solid #1f2937;padding-top:6px;"><span><b>${htmlEscape(m.team2)}</b></span><input type="number" class="skor-input" id="ts-${cr}-${mk}-2" value="${m.score2??''}" onchange="turnuvaManuelSkorKaydet('${'r'+cr}','${mk}')"></div>${status}</div>`;});
        const matchCount=Object.keys(r?.matches||{}).length;const tamam=matchCount>0&&Object.values(r.matches).every(m=>!!m.winner);if(state.champion){champ.innerHTML=`<div class="champ-card">🏆 ${htmlEscape(secimler.kategori)} ŞAMPİYONU: ${htmlEscape(state.champion)} 🏆</div>`;next.style.display='none';}else{champ.innerHTML='';next.style.display=tamam?'block':'none';}
        old.innerHTML='';for(let n=cr-1;n>=1;n--){const rr=state.rounds?.['r'+n];if(!rr)continue;let h=`<div class="old-tur"><h4 style="color:var(--text-muted);margin-bottom:10px;">${n}. Tur Sonuç Arşivi</h4>`;Object.values(rr.matches||{}).forEach(m=>{h += `<div class="match-box" style="opacity:.75;"><div>${htmlEscape(m.team1)} <span style="color:var(--accent);">(${m.score1??'-'})</span></div><div>${htmlEscape(m.team2)} <span style="color:var(--accent);">(${m.score2??'-'})</span></div><div style="font-size:11px;color:var(--success);margin-top:5px;font-weight:bold;">→ ${htmlEscape(m.winner||'Sonuç yok')}</div></div>`;});old.innerHTML += h+'</div>';}
    }

    async function ilkTuruKur(){const ta=document.getElementById('takimlar');let t=(ta?.value||'').split('\n').map(x=>x.trim()).filter(Boolean);if(t.length<2)return alert('Turnuvayı başlatmak için en az 2 okul bulunmalıdır!');const current=await turnuvaRef().once('value');if(current.exists()&&!confirm('Mevcut merkezi turnuva ağacı var. Yeni turnuva kurarsanız mevcut ağaç arşivlenip yenisi oluşturulacak. Devam edilsin mi?'))return;if(current.exists())await db.ref(`arsiv/turnuva/${secimler.kategori}/${Date.now()}`).set(current.val());t=t.map(x=>({x,r:Math.random()})).sort((a,b)=>a.r-b.r).map(o=>o.x);const round=roundOlustur(secimler.kategori,1,t);const state={version:3,revision:(current.val()?.revision||0)+1,status:'active',currentRound:1,rounds:{r1:round},champion:'',teams:t,fiksturSonuclari:current.val()?.fiksturSonuclari||{},createdAt:Date.now(),updatedAt:Date.now()};await turnuvaRef().set(state);await roundMaclariniKaydet(secimler.kategori,round);firebaseArsivYedegiAl(true,'turnuva_baslangic');}

    async function turnuvaManuelSkorKaydet(roundKey,matchKey){const stateSnap=await turnuvaRef().once('value');const cur=stateSnap.val();const turNo=Number(roundKey.replace('r',''));const s1=parseFloat(document.getElementById(`ts-${turNo}-${matchKey}-1`)?.value),s2=parseFloat(document.getElementById(`ts-${turNo}-${matchKey}-2`)?.value);await turnuvaRef().transaction(state=>{if(!state?.rounds?.[roundKey]?.matches?.[matchKey])return state;const m=state.rounds[roundKey].matches[matchKey];m.score1=Number.isFinite(s1)?s1:null;m.score2=Number.isFinite(s2)?s2:null;m.provisionalWinner='';m.winner='';if(Number.isFinite(s1)&&Number.isFinite(s2)){if(s1>s2)m.winner=m.team1;else if(s2>s1)m.winner=m.team2;}m.updatedAt=Date.now();state.revision=(state.revision||0)+1;state.updatedAt=Date.now();return state;});}

    async function turnuvaAgacinaPuanYansit(kat,hukOkul,muhOkul,forceFinalize=false) {
        if(!hukOkul||!muhOkul)return;
        const id=macKimligiOlustur(kat,hukOkul,muhOkul);
        const [s,mSnap]=await Promise.all([db.ref('puanlar/'+kat).once('value'),db.ref(`maclar/${kat}/${id}`).once('value')]);
        const mc=mSnap.val() || {};
        let tHuk=0,tMuh=0;
        snapshotKayitlariniTekillestir(s).forEach(v=>{
            if(kayitMacId(v)!==id)return;
            const t=puanToplami(v);
            if(v.secim?.okul===hukOkul)tHuk+=t;
            if(v.secim?.okul===muhOkul)tMuh+=t;
        });
        const finalized=mc.durum==='kapali' && mc.sonuc?.kazanan && mc.sonuc?.senkronDurum==='tamam';
        await turnuvaRef(kat).transaction(state=>{
            if(!state?.rounds)return;
            let changed=false;
            for(const rr of Object.values(state.rounds))for(const m of Object.values(rr.matches||{})){
                if(m.team2==='BYE' || !okulCiftiEslesiyor(m.team1,m.team2,hukOkul,muhOkul))continue;
                // Kesinleşmiş resmî sonuç ham/şüpheli jüri kayıtlarıyla ezilmez.
                const resmiH=mc.sonuc?.puanHuk, resmiM=mc.sonuc?.puanMuh;
                const resmiPuanVar=finalized&&Number.isFinite(resmiH)&&Number.isFinite(resmiM);
                const hk=resmiPuanVar?resmiH:tHuk, mh=resmiPuanVar?resmiM:tMuh;
                m.score1=skorEslesmeAnahtari(m.team1)===skorEslesmeAnahtari(hukOkul)?hk:mh;
                m.score2=skorEslesmeAnahtari(m.team2)===skorEslesmeAnahtari(muhOkul)?mh:hk;
                m.provisionalWinner=finalized?mc.sonuc.kazanan:hk>mh?hukOkul:(mh>hk?muhOkul:'');
                if(finalized)m.winner=mc.sonuc.kazanan;
                m.updatedAt=Date.now();changed=true;
            }
            if(!changed)return;
            state.revision=(state.revision||0)+1;state.updatedAt=Date.now();return state;
        },undefined,false);
    }

    async function yeniTur(){let olusanRound=null;await turnuvaRef().transaction(state=>{if(!state?.rounds)return state;const cr=Number(state.currentRound||1),r=state.rounds['r'+cr];if(!r)return state;const matches=Object.values(r.matches||{});if(!matches.length||!matches.every(m=>!!m.winner))return state;const winners=matches.map(m=>m.winner);if(winners.length===1){state.champion=winners[0];state.status='completed';state.revision=(state.revision||0)+1;state.updatedAt=Date.now();return state;}const nextNo=cr+1;if(state.rounds['r'+nextNo])return state;olusanRound=roundOlustur(secimler.kategori,nextNo,winners);state.rounds['r'+nextNo]=olusanRound;state.currentRound=nextNo;state.revision=(state.revision||0)+1;state.updatedAt=Date.now();return state;});if(olusanRound)await roundMaclariniKaydet(secimler.kategori,olusanRound);await firebaseArsivYedegiAl(true,'tur_gecisi');}

    async function turnuvayiSifirla(){const cevap=prompt(`${secimler.kategori} turnuvasını merkezi veritabanından sıfırlamak için SIFIRLA yazınız:`);if(cevap!=='SIFIRLA')return;const snap=await turnuvaRef().once('value');if(snap.exists())await db.ref(`arsiv/turnuva/${secimler.kategori}/${Date.now()}`).set(snap.val());await turnuvaRef().remove();localStorage.removeItem(TURN_CACHE_PREFIX+secimler.kategori);alert('Turnuva ağacı arşivlendi ve sıfırlandı. Puan kayıtları silinmedi.');}

    // Geriye dönük çağrılar için: artık Firebase cache'i kullanılır.
    function hafizayaKaydet(dataObj){localStorage.setItem(TURN_CACHE_PREFIX+secimler.kategori,JSON.stringify(dataObj));}
    function turKur(){/* V3'te roundOlustur + Firebase state kullanılır. */}
    function otomatikSkorKontrol(){/* V3'te turnuvaManuelSkorKaydet kullanılır. */}
    function kontrolEtVeButonGoster(){/* V3'te renderTurnuvaState hesaplar. */}

    // Kesinleşmiş sonuç tüm bağlı jüri cihazlarında birer kez görünür.
    // Tek kaynak, mevcut Firebase maç kaydı. Bir cihaz aynı kapanışı ikinci kez görmez.
    const SONUC_GORULDU_KEY='munazaraSonucDuyuruGorulduV1';
    const sonucDuyuruKuyrugu=[];
    let sonucDuyuruAcik=false;
    function sonucDuyuruKapat(){
        document.getElementById('ortakSonucDuyuru')?.remove();
        sonucDuyuruAcik=false;
        if(sonucDuyuruKuyrugu.length)sonucDuyuruGoster();
    }
    function sonucDuyuruGoster(){
        if(sonucDuyuruAcik || !sonucDuyuruKuyrugu.length)return;
        if(!juriOturumuGetir())return; // Yönetici ekranlarını kesintiye uğratma.
        const x=sonucDuyuruKuyrugu.shift();
        sonucDuyuruAcik=true;
        const host=document.createElement('div');host.id='ortakSonucDuyuru';
        host.className='sure-modal-bg';host.setAttribute('role','dialog');host.setAttribute('aria-modal','true');
        host.innerHTML=`<div class="sure-modal-card" style="max-width:570px;text-align:center;border:2px solid #10b981">
            <div style="color:#34d399;font-size:12px;font-weight:bold">🏆 RESMÎ MAÇ SONUCU</div>
            <h2 style="font-size:21px;margin-top:12px">${htmlEscape(x.etiket)}</h2>
            <div style="font-size:23px;color:#facc15;font-weight:800;line-height:1.5">${htmlEscape(x.kazanan||'Her iki okul elendi')}</div>
            ${x.puanHuk!=null&&x.puanMuh!=null?`<p>${htmlEscape(x.hukOkul)}: <b>${x.puanHuk}</b> — ${htmlEscape(x.muhOkul)}: <b>${x.puanMuh}</b></p>`:''}
            <p class="sure-hint">Maç kesinleşti. Bu bildirim aynı jüri cihazında yalnız bir kez gösterilir.</p>
            <button class="btn" style="background:#0f766e" onclick="sonucDuyuruKapat()">✓ Sonucu Gördüm</button></div>`;
        document.body.appendChild(host);
    }
    function sonucDuyuruKaydet(seen,kat,macId,stamp,result){
        const key=`${kat}|${macId}|${stamp}`;
        if(seen[key])return false;
        const already=Object.keys(seen).some(x=>{
            const parts=x.split('|');
            return parts[0]===kat && parts[1]===String(macId) && Math.abs(Number(parts[2])-stamp)<=30000;
        });
        seen[key]=true;
        if(!already && Date.now()-stamp<60*60*1000 && Date.now()>=stamp-60000)
            sonucDuyuruKuyrugu.push(result);
        return true;
    }
    function sonucDuyurulariniDinle(){
        for(const kat of ['ORTAOKUL','LİSE']){
            db.ref(`maclar/${kat}`).on('value',snap=>{
                let seen={};try{seen=JSON.parse(localStorage.getItem(SONUC_GORULDU_KEY)||'{}')||{};}catch(_){}
                const now=Date.now();let degisti=false;
                snap.forEach(c=>{
                    const m=c.val();const s=m?.sonuc;
                    if(m?.durum!=='kapali'||!s||(!s.kazanan&&s.yontem!=='cift_eleme'))return;
                    const stamp=Number(m.closedAt||s.createdAt||0);
                    if(!stamp)return;
                    if(sonucDuyuruKaydet(seen,kat,c.key,stamp,{
                        etiket:m.etiket||macEtiketi(m.hukOkul,m.muhOkul),
                        kazanan:s.kazanan,puanHuk:s.puanHuk,puanMuh:s.puanMuh,
                        hukOkul:m.hukOkul,muhOkul:m.muhOkul}))degisti=true;
                });
                if(degisti)localStorage.setItem(SONUC_GORULDU_KEY,JSON.stringify(seen));
                sonucDuyuruGoster();
            },e=>console.warn('Jüri sonuç duyurusu:',e));
        }
        // Ayrıca resmî fikstürden kesinleşen fakat operasyon kaydı açık kalan
        // tarihî maçlar: yeni sonuçlar jüri ekranına yine yalnız bir kez gelir.
        db.ref('fikstur/tekSalon_2026_2027/finalizedMatches').on('value',snap=>{
            let seen={};try{seen=JSON.parse(localStorage.getItem(SONUC_GORULDU_KEY)||'{}')||{};}catch(_){}
            let degisti=false;
            snap.forEach(c=>{
                const v=c.val();if(!v||(!v.kazanan&&v.yontem!=='cift_eleme'))return;
                const kat=v.kategori||secimler.kategori;
                const stamp=Number(v.closedAt||v.createdAt||0);
                if(!stamp)return;
                const macId=v.macId||('resmi_'+c.key);
                if(sonucDuyuruKaydet(seen,kat,macId,stamp,{
                    etiket:`#${c.key} · Resmî fikstür sonucu`,kazanan:v.kazanan,
                    puanHuk:v.puanHuk,puanMuh:v.puanMuh,
                    hukOkul:'Hükümet',muhOkul:'Muhalefet'}))degisti=true;
            });
            if(degisti)localStorage.setItem(SONUC_GORULDU_KEY,JSON.stringify(seen));
            sonucDuyuruGoster();
        },e=>console.warn('Resmî fikstür sonucu duyurusu:',e));
    }
    function ekranGeriDon(){
        if(document.getElementById('ortakSonucDuyuru'))return sonucDuyuruKapat();
        if(document.getElementById('yoneticiManuelSonucHost'))return yoneticiManuelPencereKapat();
        if(document.querySelector('.sure-modal-bg'))return sureModalKapat();
        const app=document.getElementById('app');if(!app)return;
        if(document.getElementById('ortakKonusmaSayaci'))return renderPuanlamaSecim();
        if(document.getElementById('aktifMac'))return anaMenu();
        if(document.getElementById('sureHizliMacSec'))return window.sureEkraniGirisKaynak==='yonetici'?renderYoneticiCanliPanel():renderPuanlamaSecim();
        if(document.getElementById('liveMatches')||document.getElementById('gunFiltre')||
           document.getElementById('ogrenciListesi')||document.getElementById('turnuvaFiksturFrame')||
           app.querySelector('.fixture-shell'))return renderYoneticiMenu();
        const title=(app.querySelector('h1,h2')?.textContent||'').toLocaleLowerCase('tr-TR');
        if(title.includes('yönetici modülü'))return anaMenu();
        if(title.includes('ana ')||title.includes('münazara yönetim sistemi'))return anaMenu();
        if(adminYetkiliMi())return renderYoneticiMenu();
        return anaMenu();
    }
    function ustGezinmeyiGuncelle(){
        const app=document.getElementById('app');if(!app)return;
        let nav=document.getElementById('ustGezinme');
        if(!nav){nav=document.createElement('nav');nav.id='ustGezinme';nav.className='global-nav no-print';
            nav.setAttribute('aria-label','Ekran gezinme');
            nav.innerHTML='<button onclick="ekranGeriDon()" title="Geri dön (Backspace)">← Geri</button><button onclick="anaMenu()" title="Ana menüye git">⌂ Ana Menü</button>';
            document.body.appendChild(nav);
        }
        const anasayfa=!!app.querySelector('main.home-shell:not(.admin-menu-shell) .home-head');
        nav.style.display=anasayfa?'none':'flex';
    }
    document.addEventListener('keydown',event=>{
        if(event.key!=='Backspace'||event.repeat||event.altKey||event.ctrlKey||event.metaKey)return;
        const target=event.target;
        if(target?.isContentEditable||['INPUT','TEXTAREA','SELECT'].includes(target?.tagName))return;
        event.preventDefault();ekranGeriDon();
    });
    // --- BAŞLATMA ---
    window.addEventListener('online',()=>{networkDurumunuGuncelle();offlineKuyruguGonder();});
    window.addEventListener('offline',networkDurumunuGuncelle);
    db.ref('.info/connected').on('value',s=>{firebaseBagli=s.val()===true;networkDurumunuGuncelle();if(firebaseBagli){offlineKuyruguGonder();void juriSureAuditKuyrugunuGonder();}});
    setInterval(()=>offlineKuyruguGonder(),15000);

        const oturum=juriOturumuGetir();
        if(oturum){secimler.juri=oturum.juri;secimler.juriAd=oturum.ad;secimleriKaydet();}
        networkDurumunuGuncelle();
        anaMenu();
        // Yalnız ekran kökü değiştiğinde gezinme denetimini güncelle.
        const app=document.getElementById('app');
        new MutationObserver(ustGezinmeyiGuncelle).observe(app,{childList:true});
        ustGezinmeyiGuncelle();
        sonucDuyurulariniDinle();
    };
